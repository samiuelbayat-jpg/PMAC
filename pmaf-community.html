<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PUBG MOBILE AFGHANISTAN</title>
  <meta name="description" content="Welcome to PUBG MOBILE AFGHANISTAN. Enter the PMAF Community.">
  <style>
    :root {
      color-scheme: dark;
      --black: #080a0d;
      --ink: #10151d;
      --gold: #f2b42b;
      --amber: #ffcf57;
      --green: #16864c;
      --red: #cf2436;
      --white: #f8f4ea;
      --muted: #c7c0ad;
      --line: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--black);
      color: var(--white);
    }

    body {
      overflow-x: hidden;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      isolation: isolate;
      background:
        linear-gradient(115deg, rgba(0, 0, 0, 0.72), rgba(8, 10, 13, 0.58) 42%, rgba(0, 0, 0, 0.84)),
        radial-gradient(circle at 72% 28%, rgba(242, 180, 43, 0.22), transparent 28%),
        linear-gradient(135deg, rgba(22, 134, 76, 0.35), transparent 36%),
        linear-gradient(315deg, rgba(207, 36, 54, 0.36), transparent 34%),
        #10151d;
    }

    .background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -4;
      filter: saturate(1.08) contrast(1.08);
    }

    .video-shade {
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        linear-gradient(115deg, rgba(0, 0, 0, 0.76), rgba(8, 10, 13, 0.45) 42%, rgba(0, 0, 0, 0.84)),
        radial-gradient(circle at 72% 28%, rgba(242, 180, 43, 0.2), transparent 28%),
        linear-gradient(135deg, rgba(22, 134, 76, 0.24), transparent 36%),
        linear-gradient(315deg, rgba(207, 36, 54, 0.26), transparent 34%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: 0.32;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent 84%);
    }

    .page::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 38vh;
      z-index: -1;
      background:
        linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent),
        repeating-linear-gradient(118deg, rgba(255, 255, 255, 0.04) 0 2px, transparent 2px 18px);
    }

    .flag-bar {
      position: fixed;
      inset: 0 0 auto;
      height: 6px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      z-index: 5;
    }

    .flag-bar span:nth-child(1) {
      background: #111;
    }

    .flag-bar span:nth-child(2) {
      background: var(--red);
    }

    .flag-bar span:nth-child(3) {
      background: var(--green);
    }

    .shell {
      width: min(760px, 100%);
      display: grid;
      gap: 34px;
      align-items: center;
      grid-template-columns: 1fr;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      width: fit-content;
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: rgba(8, 10, 13, 0.5);
      backdrop-filter: blur(14px);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 13px;
      font-weight: 800;
    }

    .brand-mark {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 2px solid var(--gold);
      color: var(--gold);
      font-size: 12px;
      line-height: 1;
      font-weight: 900;
    }

    h1 {
      margin: 28px 0 18px;
      max-width: 650px;
      font-size: clamp(34px, 5.8vw, 72px);
      line-height: 0.96;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .title-kicker {
      display: block;
      margin-bottom: 10px;
      color: var(--white);
      font-size: clamp(15px, 1.8vw, 22px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .title-main,
    .title-country {
      display: block;
      width: fit-content;
    }

    .title-main {
      color: var(--gold);
      text-shadow: 0 0 24px rgba(242, 180, 43, 0.2);
    }

    .title-country {
      margin-top: 6px;
      padding: 6px 12px;
      color: var(--white);
      background: linear-gradient(90deg, rgba(207, 36, 54, 0.84), rgba(22, 134, 76, 0.84));
      border-left: 6px solid var(--gold);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.22);
    }

    .intro {
      max-width: 640px;
      margin: 0 0 34px;
      color: var(--muted);
      font-size: clamp(15px, 1.6vw, 18px);
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }

    .enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 0 28px;
      border: 0;
      color: #15100a;
      background: linear-gradient(180deg, var(--amber), var(--gold));
      box-shadow: 0 16px 38px rgba(242, 180, 43, 0.28);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .enter:hover,
    .enter:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 20px 48px rgba(242, 180, 43, 0.38);
      filter: saturate(1.08);
      outline: 2px solid rgba(255, 255, 255, 0.65);
      outline-offset: 4px;
    }

    .note {
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 820px) {
      .page {
        place-items: start center;
        padding: 72px 18px 28px;
      }

      h1 {
        margin-top: 24px;
      }
    }

    @media (max-width: 460px) {
      .actions,
      .enter {
        width: 100%;
      }

      .enter {
        padding-inline: 18px;
      }

      .title-country {
        width: 100%;
        padding-inline: 10px;
      }

      .brand {
        font-size: 11px;
      }

    }
  </style>
</head>
<body>
  <div class="flag-bar" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <main class="page">
    <video class="background-video" autoplay muted loop playsinline aria-hidden="true">
      <source src="bg.mp4" type="video/mp4">
    </video>
    <div class="video-shade" aria-hidden="true"></div>

    <section class="shell" aria-labelledby="welcome-title">
      <div>
        <div class="brand">
          <span class="brand-mark">AF</span>
          <span>Official Community</span>
        </div>

        <h1 id="welcome-title">
          <span class="title-kicker">Welcome to</span>
          <span class="title-main">PUBG MOBILE</span>
          <span class="title-country">AFGHANISTAN</span>
        </h1>

        <p class="intro">
          Connect with Afghan players and enter the PMAF registration hub.
        </p>

        <div class="actions">
          <a class="enter" href="registration.html?event=default">
            Enter PMAF Community
          </a>
          <span class="note">Tap once to continue</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
