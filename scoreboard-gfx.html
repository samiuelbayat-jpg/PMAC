*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0b0d;color:#eef0f5;font-family:'Barlow Condensed',sans-serif;min-height:100vh;}
.wrap{max-width:1200px;margin:0 auto;padding:1.25rem;}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid rgba(255,255,255,0.1);flex-wrap:wrap;gap:1rem;}
.hdr-left{display:flex;align-items:center;gap:12px;}
.hdr-logo{width:48px;height:48px;border-radius:50%;border:2px solid #00ff88;object-fit:cover;}
.hdr-title{font-weight:900;font-size:20px;letter-spacing:.04em;text-transform:uppercase;}
.hdr-sub{font-size:9px;color:#00ff88;letter-spacing:.15em;margin-top:3px;}
.btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(255,255,255,0.15);color:#8a96a8;border-radius:6px;padding:8px 18px;cursor:pointer;transition:all .2s;background:#161a1f;}
.btn-green{background:linear-gradient(135deg,#00cc6a,#00aa55);border-color:#00ff88;color:#000;box-shadow:0 3px 12px rgba(0,255,136,0.3);}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:1rem;background:#0f1115;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:1rem;}
.cf{display:flex;flex-direction:column;gap:4px;}
.cl{font-size:9px;color:#8a96a8;letter-spacing:.1em;text-transform:uppercase;}
.ci{background:#161a1f;border:1px solid rgba(255,255,255,0.12);color:#eef0f5;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;padding:6px 10px;border-radius:4px;outline:none;}
.ci:focus{border-color:#00ff88;}
.file-row{display:flex;align-items:center;gap:8px;}
.file-name{font-size:11px;color:#8a96a8;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.range-grid{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:10px;width:100%;}
.range-row{display:flex;align-items:center;gap:8px;background:#10141a;border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:7px 9px;}
.range-row input{width:92px;accent-color:#00ff88;}
.range-val{font-size:11px;color:#eef0f5;min-width:32px;text-align:right;}
.status{font-size:11px;color:#606878;margin-bottom:.75rem;letter-spacing:.06em;}
#canvas-wrap{overflow-x:auto;margin-bottom:1rem;}
canvas{display:block;border-radius:4px;}
.toast{position:fixed;bottom:2rem;right:2rem;z-index:2000;font-weight:700;font-size:14px;padding:10px 20px;border-radius:6px;transform:translateY(20px);opacity:0;transition:all .25s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.tok{background:#00ff88;color:#000;}.terr{background:#ff4444;color:#fff;}
</style>

var GFX_SETUP_KEY = "pmac_gfx_generator_setup_v2";
var gfxRestoringSetup = false;
function gfxInputIds(){return ["inp-title","inp-title-size","inp-title-font","inp-team-font","inp-sub","inp-design","inp-bg","inp-accent","inp-light","inp-secondary","inp-stage","inp-qualify","inp-group","inp-date","inp-time","inp-matches","inp-bg-bright","inp-bg-contrast","inp-bg-blur","inp-bg-tint","inp-panel-alpha"];}
function saveGfxSetup(){
  if(gfxRestoringSetup) return;
  var fields={};
  gfxInputIds().forEach(function(id){var el=document.getElementById(id); if(el) fields[id]=el.value;});
  try{localStorage.setItem(GFX_SETUP_KEY,JSON.stringify({fields:fields,eventLogoData:EVENT_LOGO_DATA,eventLogoName:EVENT_LOGO_NAME,bgImageData:BG_IMAGE_DATA,bgImageName:BG_IMAGE_NAME}));}catch(e){console.warn("GFX setup could not be saved",e);}
}
function imageFromDataUrl(data,done){
  if(!data){done(null);return;}
  var img=new Image();
  img.onload=function(){done(img);};
  img.onerror=function(){done(null);};
  img.src=data;
}
function restoreGfxSetup(){
  var raw=null;
  try{raw=localStorage.getItem(GFX_SETUP_KEY);}catch(e){}
  if(!raw){updateRangeLabels();return;}
  var saved=null;
  try{saved=JSON.parse(raw);}catch(e){return;}
  gfxRestoringSetup=true;
  Object.keys(saved.fields||{}).forEach(function(id){var el=document.getElementById(id); if(el) el.value=saved.fields[id];});
  EVENT_LOGO_DATA=saved.eventLogoData||""; EVENT_LOGO_NAME=saved.eventLogoName||"";
  BG_IMAGE_DATA=saved.bgImageData||""; BG_IMAGE_NAME=saved.bgImageName||"";
  if(EVENT_LOGO_DATA){document.getElementById("event-logo-name").textContent=EVENT_LOGO_NAME||"Saved logo";document.getElementById("event-logo-clear").style.display="inline-block";imageFromDataUrl(EVENT_LOGO_DATA,function(img){EVENT_LOGO=img;build();});}
  if(BG_IMAGE_DATA){document.getElementById("bg-image-name").textContent=BG_IMAGE_NAME||"Saved background";document.getElementById("bg-image-clear").style.display="inline-block";imageFromDataUrl(BG_IMAGE_DATA,function(img){BG_IMAGE=img;build();});}
  updateRangeLabels();
  gfxRestoringSetup=false;
}
function clearGfxSetup(){
  try{localStorage.removeItem(GFX_SETUP_KEY);}catch(e){}
  EVENT_LOGO=null; BG_IMAGE=null; EVENT_LOGO_DATA=""; BG_IMAGE_DATA=""; EVENT_LOGO_NAME=""; BG_IMAGE_NAME="";
  document.getElementById("inp-event-logo").value=""; document.getElementById("inp-bg-image").value="";
  document.getElementById("event-logo-name").textContent="Using site logo"; document.getElementById("bg-image-name").textContent="Using color";
  document.getElementById("event-logo-clear").style.display="none"; document.getElementById("bg-image-clear").style.display="none";
  build(); toast("Saved GFX setup cleared",true);
}

var liveTeamsRef=null, liveScoresRef=null;
function activeSessions(session){
  if(!session) return [];
  if(Array.isArray(session.sessions)) return session.sessions.filter(function(s){return s&&s.group&&s.date;});
  if(session.group&&session.date) return [{group:session.group,date:session.date}];
  return [];
}
function bindLiveSession(session){
  if(liveTeamsRef) liveTeamsRef.off();
  if(liveScoresRef) liveScoresRef.off();
  teamsReady=false; scoresReady=false;
  var sessions=activeSessions(session), active=sessions.length>0;
  if(sessions.length>1){ bindMultiLiveSession(sessions); return; }
  var one=sessions[0];
  liveTeamsRef = active ? db.ref(eventPath("eventGroups")+"/"+one.group+"/sessions/"+one.date+"/teams") : db.ref(eventPath("teams"));
  liveScoresRef = active ? db.ref(eventPath("eventGroups")+"/"+one.group+"/sessions/"+one.date+"/scores") : db.ref(eventPath("matches"));
  liveTeamsRef.on("value",function(s){
    var v=s.val()||[]; teams=Array.isArray(v)?v:Object.values(v);
    teamsReady=true; if(scoresReady) build();
  });
  liveScoresRef.on("value",function(s){
    scores=s.val()||{}; scoresReady=true; if(teamsReady) build();
  });
}
function bindMultiLiveSession(sessions){
  var teamRefs=[],scoreRefs=[],teamBuckets={},scoreBuckets={};
  function combine(){
    var combinedTeams=[],combinedScores={};
    sessions.forEach(function(s){
      var key=s.group+"|"+s.date;
      (teamBuckets[key]||[]).forEach(function(t){ if(!combinedTeams.find(function(x){return x.name===t.name;})) combinedTeams.push(t); });
      Object.assign(combinedScores,scoreBuckets[key]||{});
    });
    teams=combinedTeams;scores=combinedScores;teamsReady=true;scoresReady=true;build();
  }
  sessions.forEach(function(s){
    var key=s.group+"|"+s.date;
    var tr=db.ref(eventPath("eventGroups")+"/"+s.group+"/sessions/"+s.date+"/teams"),sr=db.ref(eventPath("eventGroups")+"/"+s.group+"/sessions/"+s.date+"/scores");
    teamRefs.push(tr);scoreRefs.push(sr);
    tr.on("value",function(snap){var v=snap.val()||[];teamBuckets[key]=Array.isArray(v)?v:Object.values(v);combine();});
    sr.on("value",function(snap){scoreBuckets[key]=snap.val()||{};combine();});
  });
  liveTeamsRef={off:function(){teamRefs.forEach(function(r){r.off();});}};
  liveScoresRef={off:function(){scoreRefs.forEach(function(r){r.off();});}};
}
db.ref(eventPath("activeSession")).on("value",function(s){ bindLiveSession(s.val()); });

function san(n){return n.replace(/[.#$\/\[\]]/g,"_");}

function getStandings(){
  return teams.map(function(t){
    var key=san(t.name),md=scores[key]||[],tk=0,tp=0,wins=0;
    for(var i=0;i<10;i++){
      var m=md[i]||{rank:null,kills:null};
      var rp=(m.rank&&m.rank>=1&&m.rank<=25)?RANK_PTS[m.rank-1]:0;
      var kp=m.kills?parseInt(m.kills)||0:0;
      if(m.rank!=null||m.kills!=null){tp+=rp+kp;tk+=kp;}
      if(m.rank==1) wins++;
    }
    return {name:t.name,logo:t.logo||"",kills:tk,pts:tp,plc:tp-tk,wins:wins};
  }).sort(function(a,b){return b.pts-a.pts||b.kills-a.kills;});
}

function hexToRgb(hex){

}

function drawRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function drawCoverImage(ctx,img,x,y,w,h){

}

function getWWCDCards(st,logos){
  var logoByName={};
  st.forEach(function(t,i){logoByName[t.name]=logos[i]||null;});
  var byTeam={};
  teams.forEach(function(t){byTeam[san(t.name)]=t;});
  var cards=[];
  for(var match=0;match<10;match++){
    var winner=null;
    Object.keys(scores||{}).forEach(function(key){
      var row=(scores[key]||[])[match]||{};
      if(row.rank==1){
        var team=byTeam[key]||teams.find(function(t){return san(t.name)===key;})||{name:key,logo:""};
        winner={match:match+1,name:team.name,logo:logoByName[team.name]||null,kills:parseInt(row.kills)||0};
      }
    });
    if(winner) cards.push(winner);
  }
  return cards.slice(0,6);
}

function loadImage(url){
  return new Promise(function(resolve){
    if(!url){resolve(null);return;}
    var img=new Image();
    // base64 loads instantly with no CORS issues
    if(url.indexOf("data:")===0){
      img.onload=function(){resolve(img);};
      img.onerror=function(){resolve(null);};
      img.src=url;
      return;
    }
    // For external URLs try weserv proxy with 5s timeout
    var done=false;
    var timer=setTimeout(function(){if(!done){done=true;resolve(null);}},2000);
    img.crossOrigin="anonymous";
    img.onload=function(){if(!done){done=true;clearTimeout(timer);resolve(img);}};
    img.onerror=function(){
      // try weserv proxy
      var img2=new Image();
      img2.crossOrigin="anonymous";
      img2.onload=function(){if(!done){done=true;clearTimeout(timer);resolve(img2);}};
      img2.onerror=function(){if(!done){done=true;clearTimeout(timer);resolve(null);}};
      img2.src="https://images.weserv.nl/?url="+encodeURIComponent(url.replace("https://",""));
    };
    img.src=url;
  });
}

function build(){
  saveGfxSetup();
  if(!teamsReady||!scoresReady) return;
  var st=getStandings();
  if(!st.length){document.getElementById("status").textContent="No teams.";return;}
  var title=document.getElementById("inp-title").value||eventInfo.name||"PMAC";
  var sub=document.getElementById("inp-sub").value||"Overall Rankings";
  var bg=document.getElementById("inp-bg").value||"#1a1a2e";
  var ac=document.getElementById("inp-accent").value||"#00ff88";
  var today=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  var maxTeams=Math.min(st.length,20);
  document.getElementById("status").textContent="Loading logos for "+maxTeams+" teams...";

  // Load all logos in parallel
  var logoPromises=st.slice(0,maxTeams).map(function(t){return loadImage(t.logo);});
  Promise.all(logoPromises).then(function(logos){
    drawCanvas(st,logos,title,sub,bg,ac,today,maxTeams);
    document.getElementById("status").textContent=maxTeams+" teams | "+new Date().toLocaleTimeString();
    scaleCanvas();
  });
}

  if(preset.layout==="wwcd"){drawWWCDCanvas(ctx,st,logos,title,sub,bg,ac,today,maxTeams,bgBright,bgContrast,bgBlur,bgTint,panelAlpha);return;}
  if(preset.layout==="cleanpsd"){drawCleanPSDCanvas(ctx,st,logos,title,sub,bg,ac,today,maxTeams,bgBright,bgContrast,bgBlur,bgTint,panelAlpha);return;}
  if(preset.layout==="ngclime"){drawNGCLimeCanvas(ctx,st,logos,title,sub,bg,ac,today,maxTeams,bgBright,bgContrast,bgBlur,bgTint,panelAlpha);return;}
  if(preset.layout==="ngcblue"){drawNGCBlueCanvas(ctx,st,logos,title,sub,bg,ac,today,maxTeams,bgBright,bgContrast,bgBlur,bgTint,panelAlpha);return;}

  // BG: keep this area clean so uploaded backgrounds show without added design shapes.
  drawBaseCanvasBg(ctx,W,H,bg,ac,bgBright,bgContrast,bgBlur,bgTint);

  // HEADER BG
  ctx.fillStyle="rgba(0,0,0,"+Math.min(0.78,panelAlpha+0.08)+")";ctx.fillRect(0,0,W,130);
  drawDesignHeader(ctx,preset,W,ac,acRgb,panelAlpha);

  // Header logos: event logo on the left, site logo on the right.
  var leftLogo = EVENT_LOGO || PMAC_LOGO;
  if(leftLogo&&leftLogo.complete&&leftLogo.naturalWidth>0) drawCircleImage(ctx,leftLogo,120,65,48);
  if(PMAC_LOGO.complete&&PMAC_LOGO.naturalWidth>0) drawCircleImage(ctx,PMAC_LOGO,W-120,65,48);
  // Logo border circles
  ctx.strokeStyle=ac;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(120,65,48,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(W-120,65,48,0,Math.PI*2);ctx.stroke();

  // Title
  ctx.fillStyle="#ffffff";ctx.font=titleFontSpec(900,56);ctx.textAlign="center";
  ctx.shadowColor=ac;ctx.shadowBlur=20;
  ctx.fillText(title.toUpperCase(),W/2,55,W-420);ctx.shadowBlur=0;
  ctx.fillStyle=ac;ctx.font="700 18px 'Barlow Condensed',sans-serif";
  ctx.letterSpacing="0.3em";ctx.fillText(sub.toUpperCase(),W/2,85);

  // Header divider
  var hg=ctx.createLinearGradient(0,0,W,0);
  hg.addColorStop(0,"transparent");hg.addColorStop(0.2,ac);hg.addColorStop(0.5,"#ffffff");hg.addColorStop(0.8,ac);hg.addColorStop(1,"transparent");
  ctx.fillStyle=hg;ctx.fillRect(0,128,W,3);

  // Column headers
  var colHeaderY=130;
  ctx.fillStyle="rgba(0,0,0,"+Math.min(0.82,panelAlpha+0.12)+")";ctx.fillRect(20,colHeaderY,920,36);ctx.fillRect(980,colHeaderY,W-1000,36);
  ctx.font="700 13px 'Barlow Condensed',sans-serif";ctx.textAlign="center";

  function drawColHeaders(startX,width){
    ctx.fillStyle=ac;
    ctx.fillText("#",startX+28,colHeaderY+24);
    ctx.fillStyle=ac;ctx.textAlign="left";
    ctx.fillText("TEAM NAME",startX+110,colHeaderY+24);
    ctx.textAlign="center";
    ctx.fillStyle=ac;ctx.fillText("PLC",startX+width-210,colHeaderY+24);
    ctx.fillStyle="#ff6040";ctx.fillText("KILLS",startX+width-145,colHeaderY+24);
    ctx.fillStyle="#ffffff";ctx.fillText("TOTAL",startX+width-75,colHeaderY+24);
    ctx.fillStyle="#ffd700";ctx.fillText("🏆",startX+width-20,colHeaderY+24);
  }
  drawColHeaders(20,920);drawColHeaders(980,W-1000);

  // Divider line
  var dg=ctx.createLinearGradient(0,130,0,H-50);
  dg.addColorStop(0,ac);dg.addColorStop(0.5,hexAlpha(ac,0.3));dg.addColorStop(1,ac);
  ctx.fillStyle=dg;ctx.fillRect(958,130,3,H-180);

  // Rows
  for(var i=0;i<maxTeams;i++){
    var t=st[i];var pos=i+1;
    var isLeft=i<half;
    var rowIdx=isLeft?i:i-half;
    var startX=isLeft?20:980;
    var colW=isLeft?920:W-1000;
    var rowY=166+rowIdx*rowH;

    // Row BG
    ctx.fillStyle="rgba(0,0,0,"+(rowIdx%2===1?panelAlpha:Math.max(0.18,panelAlpha-0.12))+")";ctx.fillRect(startX,rowY,colW,rowH);
    if(pos===1){ctx.fillStyle=hexAlpha(ac,0.12);ctx.fillRect(startX,rowY,colW,rowH);}
    else if(pos===2){ctx.fillStyle="rgba(192,192,192,0.07)";ctx.fillRect(startX,rowY,colW,rowH);}
    else if(pos===3){ctx.fillStyle="rgba(205,127,50,0.08)";ctx.fillRect(startX,rowY,colW,rowH);}
    drawDesignRowFrame(ctx,preset,startX,rowY,colW,rowH,pos,ac,panelAlpha);

    // Left stripe
    var stripeColor=pos===1?ac:pos===2?"#c0c0c0":pos===3?"#ffa500":"rgba(255,255,255,0.08)";
    ctx.fillStyle=stripeColor;ctx.fillRect(startX,rowY,4,rowH);

    // Rank badge
    var badgeX=startX+30;var badgeY=rowY+rowH/2;
    var badgeBg=pos===1?ac:pos===2?"#c0c0c0":pos===3?"#ffa500":"rgba(255,255,255,0.05)";
    var badgeBorder=pos===1?ac:pos===2?"#c0c0c0":pos===3?"#ffa500":"rgba(255,255,255,0.1)";
    ctx.fillStyle=badgeBg;
    drawRoundRect(ctx,badgeX-18,badgeY-16,36,32,6);ctx.fill();
    ctx.strokeStyle=badgeBorder;ctx.lineWidth=1;
    drawRoundRect(ctx,badgeX-18,badgeY-16,36,32,6);ctx.stroke();
    ctx.fillStyle=pos===1?contrastText(ac):pos<=3?"#071015":"rgba(255,255,255,0.72)";
    ctx.font="800 "+(rowH>70?"15":"13")+"px 'Barlow Condensed',sans-serif";ctx.textAlign="center";
    ctx.fillText(String(pos).padStart(2,"0"),badgeX,badgeY+5);

    // Logo circle
    var logoX=startX+82;var logoY=rowY+rowH/2;var logoR=Math.min(rowH/2-6,26);
    ctx.strokeStyle=pos===1?ac:pos===2?"#c0c0c0":pos===3?"#ffa500":"rgba(255,255,255,0.15)";
    ctx.lineWidth=2;ctx.beginPath();ctx.arc(logoX,logoY,logoR,0,Math.PI*2);ctx.stroke();

    if(logos[i]&&logos[i].complete){
      drawCircleImage(ctx,logos[i],logoX,logoY,logoR-1);
    } else {
      // Initials fallback
      ctx.fillStyle=hexAlpha(ac,0.15);ctx.beginPath();ctx.arc(logoX,logoY,logoR-1,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=ac;ctx.font="700 "+(logoR>20?"14":"11")+"px 'Barlow Condensed',sans-serif";ctx.textAlign="center";
      ctx.fillText(t.name.substring(0,2).toUpperCase(),logoX,logoY+5);
    }

    // Team name
    ctx.fillStyle=pos===1?"#ffffff":"rgba(255,255,255,0.9)";
    ctx.font=teamFontSpec(800,rowH>70?18:14);ctx.textAlign="left";
    var nameX=startX+116;var maxNameW=colW-350;
    ctx.fillText(t.name.toUpperCase(),nameX,rowY+rowH/2+6,maxNameW);

    // Stats
    var fontSize=rowH>70?"22":"17";
    ctx.textAlign="center";
    ctx.fillStyle=pos===1?ac:"rgba(170,176,188,0.9)";
    ctx.font="700 "+fontSize+"px 'Barlow Condensed',sans-serif";
    ctx.fillText(t.plc,startX+colW-210,rowY+rowH/2+7);
    ctx.fillStyle="#ff6040";
    ctx.fillText(t.kills,startX+colW-145,rowY+rowH/2+7);    var totalX=startX+colW-75;
    if(preset.rows==="stripe"){
      ctx.fillStyle="rgba(0,0,0,0.58)";
      drawRoundRect(ctx,totalX-34,rowY+rowH/2-18,68,36,6);ctx.fill();
      ctx.strokeStyle=hexAlpha(ac,0.78);ctx.lineWidth=1.5;drawRoundRect(ctx,totalX-34,rowY+rowH/2-18,68,36,6);ctx.stroke();
      ctx.fillStyle="#ffffff";
      ctx.shadowColor="#000000";ctx.shadowBlur=4;
    } else {
      ctx.fillStyle=ac;
      if(pos===1){ctx.shadowColor=ac;ctx.shadowBlur=10;}
    }
    ctx.font="900 "+(pos===1?(rowH>70?"30":"24"):(rowH>70?"24":"19"))+"px 'Barlow Condensed',sans-serif";
    ctx.fillText(t.pts,totalX,rowY+rowH/2+8);ctx.shadowBlur=0;
    ctx.fillStyle=t.wins>0?"#ffd700":"rgba(255,255,255,0.15)";
    ctx.font="700 "+(rowH>70?"15":"12")+"px 'Barlow Condensed',sans-serif";
    ctx.fillText(t.wins>0?t.wins+"X":"0X",startX+colW-20,rowY+rowH/2+5);

    // Row bottom border
    ctx.fillStyle="rgba(255,255,255,0.04)";ctx.fillRect(startX,rowY+rowH-1,colW,1);
  }

  // Footer
  ctx.fillStyle="rgba(0,0,0,"+Math.min(0.9,panelAlpha+0.18)+")";ctx.fillRect(0,H-50,W,50);
  ctx.fillStyle=ac;ctx.fillRect(0,H-50,W,2);
  ctx.fillStyle=hexAlpha(ac,0.5);ctx.font="700 11px 'Barlow Condensed',sans-serif";ctx.textAlign="left";
  ctx.fillText(title.toUpperCase()+" — OFFICIAL STANDINGS",30,H-18);
  ctx.textAlign="center";ctx.fillStyle="rgba(255,255,255,0.2)";ctx.font="700 10px 'Barlow Condensed',sans-serif";
  ctx.fillText("#1=10  #2=6  #3=5  #4=4  #5=3  #6=2  #7-8=1  +1/kill",W/2,H-18);
  ctx.textAlign="right";ctx.fillStyle=hexAlpha(ac,0.5);
  ctx.fillText(today,W-30,H-18);
}

function scaleCanvas(){
  var canvas=document.getElementById("gfx");
  var wrap=document.getElementById("canvas-wrap");
  var avail=wrap.clientWidth||window.innerWidth-40;
  var scale=Math.min(1,(avail*0.95)/1920);
  canvas.style.width=(1920*scale)+"px";
  canvas.style.height=(1080*scale)+"px";
}
window.addEventListener("resize",scaleCanvas);

function toast(msg,ok){var t=document.getElementById("toast");t.innerHTML=msg;t.className="toast show "+(ok?"tok":"terr");setTimeout(function(){t.classList.remove("show");},3000);}
</script>
</body>
