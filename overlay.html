<html lang="en">

<meta charset="UTF-8">
<title>PMAC OBS Overlay - Official PUBG Points System</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Barlow Condensed',sans-serif;}
.panel{position:absolute;right:0;bottom:0;width:260px;background:rgba(10,11,13,0.96);border-left:3px solid #e8b800;border-top:3px solid #e8b800;display:flex;flex-direction:column;}
.panel-top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(10,11,13,0.99);border-bottom:2px solid rgba(232,184,0,0.4);flex-shrink:0;}
.panel-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #e8b800;flex-shrink:0;}
.panel-title-text{font-weight:900;font-size:14px;letter-spacing:0.1em;text-transform:uppercase;color:#e8b800;flex:1;}
.panel-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.live-pill{display:flex;align-items:center;gap:4px;background:rgba(255,68,68,0.15);border:1px solid rgba(255,68,68,0.5);border-radius:3px;padding:2px 7px;font-family:'Share Tech Mono',monospace;font-size:9px;color:#ff4444;letter-spacing:0.12em;}
.live-dot{width:5px;height:5px;border-radius:50%;background:#ff4444;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.35;transform:scale(0.75)}}
.match-count{font-family:'Share Tech Mono',monospace;font-size:8px;color:#606878;letter-spacing:0.08em;}
.col-headers{display:grid;grid-template-columns:22px 24px minmax(0,1fr) 32px 36px 36px;padding:4px 6px;background:rgba(22,26,31,0.95);border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;}
.col-h{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;color:#606878;text-align:center;}
.col-h.L{text-align:left;}
.col-h.acc{color:#e8b800;}
.teams-list{display:flex;flex-direction:column;}
.team-row{display:grid;grid-template-columns:22px 24px minmax(0,1fr) 32px 36px 36px;align-items:center;padding:3px 6px;border-bottom:1px solid rgba(255,255,255,0.04);border-left:3px solid transparent;}
.team-row.gold{background:rgba(245,200,66,0.08);border-left-color:#f5c842;}
.team-row.silver{background:rgba(168,184,200,0.06);border-left-color:#a8b8c8;}
.team-row.bronze{background:rgba(212,131,90,0.06);border-left-color:#d4835a;}
.pos{font-weight:900;font-size:12px;text-align:center;}
.pos.g{color:#f5c842;}.pos.s{color:#a8b8c8;}.pos.b{color:#d4835a;}.pos.x{color:#606878;font-size:10px;}
.t-logo{width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid rgba(232,184,0,0.25);background:rgba(255,255,255,0.05);}
.t-info{min-width:0;width:100%;}
.t-name{font-weight:900;font-size:14px;letter-spacing:0.05em;text-transform:uppercase;color:#eef0f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-played{font-family:'Share Tech Mono',monospace;font-size:7px;color:#606878;margin-top:1px;}
.t-kills{font-weight:700;font-size:13px;color:#8a96a8;text-align:center;}
.t-place{font-weight:700;font-size:12px;color:#8a96a8;text-align:center;}
.t-pts{font-weight:900;font-size:15px;color:#e8b800;text-align:center;}
.ticker{position:absolute;bottom:0;left:0;right:260px;height:44px;background:rgba(10,11,13,0.96);border-top:3px solid #e8b800;display:flex;align-items:center;overflow:hidden;}
.ticker-label{background:#e8b800;color:#000;font-weight:900;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:0 14px;height:100%;display:flex;align-items:center;flex-shrink:0;}
.ticker-track{flex:1;overflow:hidden;height:100%;}
.ticker-inner{display:flex;align-items:center;height:100%;white-space:nowrap;animation:tick 50s linear infinite;}
@keyframes tick{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.ti{display:inline-flex;align-items:center;gap:8px;margin-right:40px;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:0.08em;}
.ti-pos{color:#e8b800;font-weight:700;min-width:24px;}
.ti-name{color:#eef0f5;font-weight:700;}
.ti-sep{color:#444;}
.ti-val{color:#8a96a8;}
.ti-pts{color:#e8b800;font-weight:700;}
.no-data{padding:20px;font-family:'Share Tech Mono',monospace;font-size:11px;color:#606878;text-align:center;}
</style>

<script>

const FB_CONFIG = {
  apiKey: "AIzaSyD-RFu-40Igcoqhm8QBbu_PgdFxV6aUIQA",
  authDomain: "pubg-mobile-afghanistan.firebaseapp.com",
  databaseURL: "https://pubg-mobile-afghanistan-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "pubg-mobile-afghanistan",
  storageBucket: "pubg-mobile-afghanistan.firebasestorage.app",
  messagingSenderId: "279105805502",
  appId: "1:279105805502:web:8def653069d0b3d73bd2ef"
};
if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
const db = firebase.database();

// Official PUBG Points System - Placement Points
function placementPts(rank) {
  if (!rank && rank !== 0) return 0;
  const r = parseInt(rank);
  if (r === 1) return 10;
  if (r === 2) return 6;
  if (r === 3) return 5;
  if (r === 4) return 4;
  if (r === 5) return 3;
  if (r === 6) return 2;
  if (r === 7) return 1;
  if (r === 8) return 1;
  return 0;
}

let currentTeams = [];
let currentScores = {};

// Calculate team totals across all matches
function calculateTeamStats(team, matches) {
  let totalKills = 0;
  let totalPlacementPoints = 0;
  let matchesPlayed = 0;
  const matchesList = matches || [];
  
  for (const match of matchesList) {
    if (!match || (match.rank === null && match.kills === null)) continue;
    matchesPlayed++;
    const kills = (match.kills !== null && match.kills !== undefined) ? parseInt(match.kills) : 0;
    const rank = (match.rank !== null && match.rank !== undefined && match.rank !== '') ? parseInt(match.rank) : null;
    totalKills += kills;
    totalPlacementPoints += placementPts(rank);
  }
  
  const totalPoints = totalKills + totalPlacementPoints;
  
  return {
    ...team,
    kills: totalKills,
    placePoints: totalPlacementPoints,
    total: totalPoints,
    played: matchesPlayed
  };
}

// Sort by: 
// 1. Total Points (higher is better)
// 2. Placement Points (higher is better) - when total points are equal
// 3. Kills (higher is better) - when both total and placement points are equal
function sortTeams(teams) {
  return teams.sort((a, b) => {
    // Primary: Total Points (higher is better)
    if (a.total !== b.total) {
      return b.total - a.total;
    }
    // Secondary: Placement Points (higher is better)
    if (a.placePoints !== b.placePoints) {
      return b.placePoints - a.placePoints;
    }
    // Tertiary: Kills (higher is better)
    return b.kills - a.kills;
  });
}

function render() {
  if (currentTeams.length === 0) return;
  
  // Calculate stats for each team
  let teams = currentTeams.map(t => calculateTeamStats(t, currentScores[t.name] || []));
  teams = sortTeams(teams);
  
  // Calculate max matches played
  let maxMatches = 0;
  Object.values(currentScores).forEach(ms => {
    const played = (ms || []).filter(m => m && m.rank !== null).length;
    if (played > maxMatches) maxMatches = played;
  });
  document.getElementById("match-count").textContent = maxMatches + " / 10 matches";
  
  // Render standings list
  const list = document.getElementById("teams-list");
  list.innerHTML = "";
  const maxShow = 25;
  
  teams.slice(0, maxShow).forEach((team, index) => {
    const position = index + 1;
    const rankClass = position === 1 ? "gold" : position === 2 ? "silver" : position === 3 ? "bronze" : "";
    const posColorClass = position === 1 ? "g" : position === 2 ? "s" : position === 3 ? "b" : "x";
    
    const row = document.createElement("div");
    row.className = "team-row " + rankClass;
    
    // Logo handling
    const logoHtml = team.logo ? 
      '<img class="t-logo" src="' + team.logo + '" alt="" onerror="this.style.display=\'none\'; this.parentElement.innerHTML += \'<div class=\\\'t-logo\\\' style=\\\'background:#2d3748; display:flex; align-items:center; justify-content:center; font-size:10px; color:#e8b800;\\\'>?</div>\'; this.remove()">' : 
      '<div class="t-logo" style="background:#2d3748; display:flex; align-items:center; justify-content:center; font-size:10px; color:#e8b800;">?</div>';
    
    row.innerHTML =
      '<div class="pos ' + posColorClass + '">' + position + '</div>' +
      logoHtml +
      '<div class="t-info"><div class="t-name">' + escapeHtml(team.name) + '</div><div class="t-played">' + team.played + 'M</div></div>' +
      '<div class="t-kills">' + team.kills + '</div>' +
      '<div class="t-place">' + team.placePoints + '</div>' +
      '<div class="t-pts">' + team.total + '</div>';
    list.appendChild(row);
  });
  
  // Render ticker
  document.getElementById("ticker-inner").innerHTML = teams.map((team, index) =>
    '<div class="ti"><span class="ti-pos">#' + (index + 1) + '</span><span class="ti-name">' + escapeHtml(team.name) + '</span><span class="ti-sep">|</span><span class="ti-val">' + team.kills + ' kills</span><span class="ti-sep">·</span><span class="ti-val">' + team.placePoints + ' place</span><span class="ti-sep">·</span><span class="ti-pts">' + team.total + ' pts</span></div>'
  ).join("");
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

let liveTeamsRef=null, liveScoresRef=null;
function activeSessions(session){
  if(!session) return [];
  if(Array.isArray(session.sessions)) return session.sessions.filter(s=>s&&s.group&&s.date);
  if(session.group&&session.date) return [{group:session.group,date:session.date}];
  return [];
}
function bindLiveSession(session){
  if(liveTeamsRef) liveTeamsRef.off();
  if(liveScoresRef) liveScoresRef.off();
  const sessions = activeSessions(session);
  const active = sessions.length>0;
  if(sessions.length>1){ bindMultiLiveSession(sessions); return; }
  const one = sessions[0];
  liveTeamsRef = active ? db.ref(`pmac/eventGroups/${one.group}/sessions/${one.date}/teams`) : db.ref("pmac/teams");
  liveScoresRef = active ? db.ref(`pmac/eventGroups/${one.group}/sessions/${one.date}/scores`) : db.ref("pmac/matches");
  liveTeamsRef.on("value", snap => {
    const val = snap.val();
    currentTeams = val ? (Array.isArray(val) ? val : Object.values(val)) : [];
    render();
  });
  liveScoresRef.on("value", snap => {
    currentScores = snap.val() || {};
    render();
  });
}
function bindMultiLiveSession(sessions){
  const teamRefs=[], scoreRefs=[], teamBuckets={}, scoreBuckets={};
  function combine(){
    currentTeams=[]; currentScores={};
    sessions.forEach(s=>{
      const key=s.group+"|"+s.date;
      (teamBuckets[key]||[]).forEach(t=>{ if(!currentTeams.find(x=>x.name===t.name)) currentTeams.push(t); });
      Object.assign(currentScores, scoreBuckets[key]||{});
    });
    render();
  }
  sessions.forEach(s=>{
    const key=s.group+"|"+s.date;
    const tr=db.ref(`pmac/eventGroups/${s.group}/sessions/${s.date}/teams`), sr=db.ref(`pmac/eventGroups/${s.group}/sessions/${s.date}/scores`);
    teamRefs.push(tr); scoreRefs.push(sr);
    tr.on("value",snap=>{ const val=snap.val(); teamBuckets[key]=val?(Array.isArray(val)?val:Object.values(val)):[]; combine(); });
    sr.on("value",snap=>{ scoreBuckets[key]=snap.val()||{}; combine(); });
  });
  liveTeamsRef={off:function(){teamRefs.forEach(r=>r.off());}};
  liveScoresRef={off:function(){scoreRefs.forEach(r=>r.off());}};
  const status=document.getElementById("fb-status"); if(status) status.textContent=`● ${sessions.length} Groups Active`;
}
db.ref("pmac/activeSession").on("value", snap => bindLiveSession(snap.val()));
</script>
