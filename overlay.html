<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1920px;height:1080px;min-width:1920px;min-height:1080px;overflow:hidden;background:transparent;font-family:'Barlow Condensed',sans-serif;--ov-accent:#e8b800;--ov-bg:rgba(10,11,13,0.96);--ov-text:#eef0f5;--alive-color:#00d26a;--dead-color:#252a31;}
.panel{position:fixed;right:0;bottom:0;width:260px;background:var(--ov-bg);border-left:3px solid var(--ov-accent);border-top:3px solid var(--ov-accent);display:flex;flex-direction:column;}
.panel-top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(10,11,13,0.70);border-bottom:2px solid var(--ov-accent);flex-shrink:0;}
.panel-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--ov-accent);flex-shrink:0;}
.panel-title-text{font-weight:900;font-size:14px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ov-accent);flex:1;}
.panel-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.live-pill{display:flex;align-items:center;gap:4px;background:rgba(255,68,68,0.15);border:1px solid rgba(255,68,68,0.5);border-radius:3px;padding:2px 7px;font-family:'Share Tech Mono',monospace;font-size:9px;color:#ff4444;letter-spacing:0.12em;}
.live-dot{width:5px;height:5px;border-radius:50%;background:#ff4444;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.35;transform:scale(0.75)}}
.match-count{font-family:'Share Tech Mono',monospace;font-size:8px;color:#8a96a8;letter-spacing:0.08em;}
.col-headers,.team-row{display:grid;grid-template-columns:22px 24px minmax(0,1fr) 32px 36px 36px;}
.col-headers{padding:4px 6px;background:rgba(22,26,31,0.95);border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;}
.col-h{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;color:#8a96a8;text-align:center;}.col-h.L{text-align:left;}.col-h.acc{color:var(--ov-accent);}
.teams-list{display:flex;flex-direction:column;}
.team-row{align-items:center;padding:3px 6px;border-bottom:1px solid rgba(255,255,255,0.04);border-left:3px solid transparent;}
.team-row.gold{background:color-mix(in srgb,var(--ov-accent) 16%,transparent);border-left-color:var(--ov-accent);}.team-row.silver{background:rgba(168,184,200,0.06);border-left-color:#a8b8c8;}.team-row.bronze{background:rgba(212,131,90,0.06);border-left-color:#d4835a;}
.pos{font-weight:900;font-size:12px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:0.9;min-height:22px;}.pos.g{color:var(--ov-accent);}.pos.s{color:#a8b8c8;}.pos.b{color:#d4835a;}.pos.x{color:#8a96a8;font-size:10px;}.rank-move{font-family:'Share Tech Mono',monospace;font-size:8px;font-weight:900;margin-top:2px;letter-spacing:0;}.rank-move.up{color:#00ff88;text-shadow:0 0 5px rgba(0,255,136,.65);}.rank-move.down{color:#ff9d00;text-shadow:0 0 5px rgba(255,157,0,.55);}.rank-move.bigdown{color:#ff3535;text-shadow:0 0 5px rgba(255,53,53,.70);}.rank-move.kill{color:#e8d02b;text-shadow:0 0 5px rgba(232,208,43,.65);}
.t-logo{width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid var(--ov-accent);background:rgba(255,255,255,0.05);}
.t-info{min-width:0;width:100%;overflow:visible;}.t-line{display:grid;grid-template-columns:minmax(0,1fr) 42px;align-items:center;gap:2px;min-width:0;overflow:visible;}.t-name{font-weight:900;font-size:14px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ov-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.t-played{font-family:'Share Tech Mono',monospace;font-size:7px;color:#8a96a8;margin-top:1px;}
.player-strips{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;width:56px;margin-top:3px;margin-left:auto;margin-right:-10px;}
.pstrip{height:6px;background:var(--alive-color);border-radius:2px;box-shadow:0 0 5px color-mix(in srgb,var(--alive-color) 70%,transparent);}
.pstrip.dead{background:var(--dead-color);box-shadow:none;border:1px solid rgba(255,255,255,0.06);}
.player-pipes{display:inline-flex;align-items:center;justify-content:flex-start;gap:0;width:56px;flex-shrink:0;font-family:'Share Tech Mono',monospace;font-weight:900;font-size:16px;line-height:1;color:var(--alive-color);letter-spacing:0;transform:translateX(10px);}
.player-pipes .pmark.dead{color:var(--dead-color);opacity:.9;}
.player-dots{display:inline-flex;align-items:center;justify-content:flex-start;gap:2px;width:56px;flex-shrink:0;transform:translateX(10px);}
.player-dots .pmark{width:8px;height:8px;border-radius:50%;background:var(--alive-color);box-shadow:0 0 5px color-mix(in srgb,var(--alive-color) 70%,transparent);}
.player-dots .pmark.dead{background:var(--dead-color);box-shadow:none;border:1px solid rgba(255,255,255,0.10);}
.t-kills,.t-place{font-weight:700;color:#8a96a8;text-align:center;}.t-kills{font-size:13px;}.t-place{font-size:12px;}.t-pts{font-weight:900;font-size:15px;color:var(--ov-accent);text-align:center;}.score-block{display:none;}
.ticker{position:fixed;bottom:0;left:0;right:260px;height:44px;background:var(--ov-bg);border-top:3px solid var(--ov-accent);display:flex;align-items:center;overflow:hidden;}.ticker-label{background:var(--ov-accent);color:#000;font-weight:900;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:0 14px;height:100%;display:flex;align-items:center;flex-shrink:0;}.ticker-track{flex:1;overflow:hidden;height:100%;}.ticker-inner{display:flex;align-items:center;height:100%;white-space:nowrap;animation:tick 50s linear infinite;}@keyframes tick{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.ti{display:inline-flex;align-items:center;gap:8px;margin-right:40px;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:0.08em;}.ti-pos{color:var(--ov-accent);font-weight:700;min-width:24px;}.ti-name{color:var(--ov-text);font-weight:700;}.ti-sep{color:#444;}.ti-val{color:#8a96a8;}.ti-pts{color:var(--ov-accent);font-weight:700;}.no-data{padding:20px;font-family:'Share Tech Mono',monospace;font-size:11px;color:#8a96a8;text-align:center;}
.streamer-card{position:fixed;left:32px;top:32px;display:none;align-items:center;gap:12px;background:var(--ov-bg);border:2px solid var(--ov-accent);padding:10px 16px;min-width:260px;}.streamer-logo{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--ov-accent);background:rgba(255,255,255,0.08);}.streamer-name{font-weight:900;font-size:24px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ov-text);}.elim-alert{position:fixed;left:50%;top:28px;transform:translate(-50%,-20px);width:860px;max-width:calc(100vw - 420px);padding:12px 32px 11px;background:linear-gradient(90deg,rgba(5,5,7,.86),rgba(78,0,0,.92) 26%,rgba(180,0,0,.94) 50%,rgba(78,0,0,.92) 74%,rgba(5,5,7,.86));border:2px solid #ff3434;border-left:9px solid #ff3434;border-right:9px solid #ff3434;box-shadow:0 0 28px rgba(255,48,48,.52),0 9px 28px rgba(0,0,0,.40);text-align:center;opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;z-index:999;overflow:hidden;clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,20px 100%,0 50%);}.elim-alert:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 2px,transparent 2px 16px),radial-gradient(circle at 50% 0,rgba(255,255,255,.18),transparent 44%);mix-blend-mode:screen;opacity:.40;}.elim-alert:after{content:'';position:absolute;top:0;bottom:0;width:120px;left:calc(100% + 150px);background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);transform:skewX(-18deg);}.elim-alert.show{opacity:1;transform:translate(-50%,0);}.elim-alert.show:after{animation:elimShine .85s ease-out .08s 1;}@keyframes elimShine{from{left:-150px}to{left:calc(100% + 150px)}}.elim-kicker{display:none;}.elim-team{position:relative;font-weight:900;font-size:38px;line-height:1;letter-spacing:.07em;color:#fff;text-transform:uppercase;text-shadow:0 0 14px rgba(255,255,255,.30),0 3px 0 rgba(0,0,0,.34);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.elim-team:before,.elim-team:after{content:'//';font-family:'Share Tech Mono',monospace;color:var(--ov-accent);font-size:21px;margin:0 16px;text-shadow:0 0 10px var(--ov-accent);}.elim-team .elim-word{color:#ffeded;text-shadow:0 0 16px rgba(255,48,48,.85),0 3px 0 rgba(0,0,0,.34);}.elim-meta{position:relative;margin-top:5px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.15em;color:#ffd36a;text-transform:uppercase;text-shadow:0 0 9px rgba(232,184,0,.50);}
body.design-neon .panel,body.design-neon .ticker{box-shadow:0 0 24px var(--ov-accent);}body.design-neon .team-row{margin:2px 6px;border:1px solid color-mix(in srgb,var(--ov-accent) 22%,transparent);border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--ov-accent) 12%,transparent),rgba(255,255,255,0.02));}body.design-neon .t-pts{color:#ffffff;background:rgba(0,0,0,0.52);border:1px solid color-mix(in srgb,var(--ov-accent) 45%,rgba(255,255,255,0.18));border-radius:3px;padding:1px 3px;text-shadow:0 1px 3px #000;}body.design-neon .col-h.acc{color:#ffffff;text-shadow:0 0 5px var(--ov-accent);}
body.design-minimal .panel{border-width:2px;background:rgba(0,0,0,0.66);}body.design-minimal .panel-logo,.design-minimal .live-pill{display:none!important;}body.design-minimal .team-row{padding:2px 6px;border-left:0;background:transparent;}body.design-minimal .ticker{height:38px;border-width:2px;}
body.design-broadcast .panel{border-left-width:8px;}body.design-broadcast .panel-top{background:linear-gradient(90deg,var(--ov-accent),rgba(10,11,13,0.85));}body.design-broadcast .panel-title-text{font-size:18px;color:#050505;}body.design-broadcast .team-row{margin:2px 5px;padding-top:5px;padding-bottom:5px;border:1px solid rgba(255,255,255,0.10);border-left:5px solid var(--ov-accent);}body.design-broadcast .ticker{height:52px;}
body.design-pmgc .panel{border-top-width:7px;background:linear-gradient(180deg,rgba(20,12,4,0.98),rgba(8,8,10,0.96));}body.design-pmgc .panel-top{background:var(--ov-accent);}body.design-pmgc .panel-title-text{color:#050505;}body.design-pmgc .team-row{clip-path:polygon(0 0,100% 0,94% 100%,0 100%);margin:2px 0;background:rgba(255,255,255,0.05);}body.design-pmgc .live-pill{background:#050505;color:var(--ov-accent);border-color:#050505;}
body.design-pgs .panel{border-right:5px solid var(--ov-accent);border-left:1px solid var(--ov-accent);background:linear-gradient(180deg,rgba(4,18,40,0.97),rgba(5,8,20,0.96));}body.design-pgs .col-headers{background:rgba(10,50,90,0.96);}body.design-pgs .team-row{border-left:0;border-right:4px solid var(--ov-accent);}body.design-pgs .team-row.gold{background:color-mix(in srgb,var(--ov-accent) 18%,transparent);}
body.design-worldcup .panel{border-left-width:0;border-top:5px solid var(--ov-accent);border-radius:8px;overflow:hidden;background:linear-gradient(180deg,rgba(42,4,4,0.97),rgba(8,8,10,0.96));}body.design-worldcup .team-row{margin:2px 4px;border:1px solid rgba(255,255,255,0.08);border-left:4px solid var(--ov-accent);}body.design-worldcup .ticker-label{letter-spacing:0.2em;}
body.design-tactical .panel{background:rgba(5,16,10,0.96);border-style:solid;}body.design-tactical .panel-top{background:repeating-linear-gradient(90deg,rgba(255,255,255,0.05) 0 10px,rgba(255,255,255,0.01) 10px 20px);}body.design-tactical .team-row{border-bottom:1px solid color-mix(in srgb,var(--ov-accent) 20%,transparent);}body.design-tactical .col-headers{background:rgba(15,35,20,0.96);}body.design-tactical .ticker-inner{animation-duration:62s;}
body.design-glass .panel,body.design-glass .ticker{background:rgba(10,14,20,0.60);backdrop-filter:blur(10px);border-color:rgba(255,255,255,0.45);}body.design-glass .panel{border-top:4px solid var(--ov-accent);border-radius:12px 0 0 0;overflow:hidden;}body.design-glass .panel-top{background:rgba(255,255,255,0.08);}body.design-glass .team-row{background:rgba(255,255,255,0.04);margin:2px 5px;border-radius:3px;}

body.design-arena .panel{background:linear-gradient(180deg,rgba(25,8,45,0.97),rgba(8,8,14,0.96));box-shadow:0 0 30px color-mix(in srgb,var(--ov-accent) 40%,transparent);border:2px solid var(--ov-accent);}body.design-arena .team-row{margin:2px 5px;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--ov-accent) 14%,transparent),rgba(255,255,255,0.03));}body.design-arena .team-row.gold{background:linear-gradient(90deg,color-mix(in srgb,var(--ov-accent) 24%,transparent),rgba(255,255,255,0.03));}
body.design-redlive .panel{background:linear-gradient(180deg,rgba(6,6,6,0.98),rgba(24,0,0,0.96));border-left:4px solid #090909;border-top:0;box-shadow:0 0 18px rgba(0,0,0,0.55);}
body.design-redlive .panel-top{display:grid;grid-template-columns:36px 1fr auto;gap:7px;background:#070707;border-bottom:2px solid #ff2a2a;padding:10px 9px 8px;}
body.design-redlive .panel-title-text{font-size:15px;line-height:0.92;color:#fff;letter-spacing:0.02em;}
body.design-redlive .panel-logo{width:30px;height:30px;border-radius:4px;border:1px solid var(--ov-accent);}
body.design-redlive .match-count{color:#fff;font-size:8px;}body.design-redlive .live-pill{display:none;}
body.design-redlive .col-headers{grid-template-columns:22px 24px minmax(0,1fr) 32px 36px 36px;background:#240000;border-top:2px solid #a00000;border-bottom:2px solid #ff2a2a;padding:5px 6px;}
body.design-redlive .col-h{color:#fff;font-size:8px;font-weight:900;}body.design-redlive .col-h.acc{color:#fff;}

body.design-redlive .t-logo{display:block;width:20px;height:20px;border-radius:3px;border:1px solid rgba(255,255,255,0.55);}body.design-redlive .pos{color:#fff!important;font-size:12px;}body.design-redlive .t-name{color:#fff;font-size:13px;letter-spacing:0.03em;}body.design-redlive .t-played{display:none;}

<script>

const FB_CONFIG = {

if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
const db = firebase.database();
const EVENT_ID = new URLSearchParams(location.search).get("event") || "default";
function eventBasePath(){ return EVENT_ID==="default" ? "pmac" : "pmac/events/"+EVENT_ID; }
function eventPath(child){ return eventBasePath()+"/"+child; }
localStorage.setItem("pmac_active_event", EVENT_ID);

// Official PUBG Points System - Placement Points
function placementPts(rank) {
  if (!rank && rank !== 0) return 0;
  const r = parseInt(rank);
  if (r === 1) return 10;
  if (r === 2) return 6;
  if (r === 3) return 5;
  if (r === 4) return 4;
  if (r === 5) return 3;
  if (r === 6) return 2;
  if (r === 7) return 1;
  if (r === 8) return 1;
  return 0;
}

let currentTeams = [];
let currentScores = {};
let activeMatchIndex = 0;
let lastStandingSnapshot = null;
let renderCount = 0;
let overlayMessage = "Connecting...";
let overlaySettings = { design:"classic", accent:"#e8b800", bg:"#0a0b0d", text:"#eef0f5", streamerName:"", streamerLogo:"", aliveStyle:"bars", aliveColor:"#00d26a", deadColor:"#252a31" };
function hexToRgba(hex,a){
  const v=(hex||"#0a0b0d").replace("#","");
  const r=parseInt(v.slice(0,2),16)||10,g=parseInt(v.slice(2,4),16)||11,b=parseInt(v.slice(4,6),16)||13;
  return "rgba("+r+","+g+","+b+","+a+")";
}
function applyOverlaySettings(){
  const s=overlaySettings||{};
  document.body.className="design-"+(s.design||"classic");
  document.documentElement.style.setProperty("--ov-accent",s.accent||"#e8b800");
  document.documentElement.style.setProperty("--ov-bg",hexToRgba(s.bg||"#0a0b0d",0.96));
  document.documentElement.style.setProperty("--ov-text",s.text||"#eef0f5");
  document.documentElement.style.setProperty("--alive-color",s.aliveColor||"#00d26a");
  document.documentElement.style.setProperty("--dead-color",s.deadColor||"#252a31");
  const card=document.getElementById("streamer-card"), panelLogo=document.getElementById("panel-logo"), panelTitle=document.getElementById("panel-title-text");
  if(card) card.style.display="none";
  if(s.streamerLogo){ panelLogo.src=s.streamerLogo; panelLogo.style.display="block"; }
  panelTitle.textContent=(s.design==="redlive"?(s.streamerName||"LIVE STANDING"):(s.streamerName||"Standings"));
}
db.ref(eventPath("overlaySettings")).on("value",snap=>{ overlaySettings=Object.assign({},overlaySettings,snap.val()||{}); applyOverlaySettings(); render(); });
let lastEliminationTs=0, eliminationTimer=null;
function showEliminationAlert(a){
  if(!a||!a.ts||a.ts===lastEliminationTs) return;
  if(Date.now()-a.ts>45000){ lastEliminationTs=a.ts; return; }
  lastEliminationTs=a.ts;
  const box=document.getElementById("elim-alert"), teamEl=document.getElementById("elim-team"), metaEl=document.getElementById("elim-meta");
  if(!box||!teamEl||!metaEl) return;
  const tag=String(a.tag||"").trim().toUpperCase();
  const team=String(a.team||"TEAM").trim().toUpperCase();
  const display=tag||team;
  teamEl.innerHTML="TEAM "+escapeHtml(display)+" <span class=\"elim-word\">ELIMINATED</span>";
  metaEl.textContent=(tag&&team&&tag!==team?team+" · ":"")+(a.match?"Match "+a.match:"");
  box.classList.add("show");
  clearTimeout(eliminationTimer);
  eliminationTimer=setTimeout(()=>box.classList.remove("show"),3000);
}
db.ref(eventPath("overlaySettings/eliminationAlert")).on("value",snap=>showEliminationAlert(snap.val()||null));
function sanitizeKey(n){ return String(n||"").replace(/[\.\#\$\/\[\]]/g,"_"); }
function playerCount(v){ const n=parseInt(v); if(!Number.isFinite(n)) return 4; return Math.max(0,Math.min(4,n)); }
function teamTag(team){
  const saved=String(team&&team.tag?team.tag:"").trim().toUpperCase();
  if(saved) return saved.slice(0,8);
  const name=String(team&&team.name?team.name:"TEAM").trim().toUpperCase();
  const words=name.split(/\s+/).filter(Boolean);
  if(words.length>1) return words.map(w=>w[0]).join("").slice(0,5);
  return name.replace(/[^A-Z0-9]/g,"").slice(0,5) || "TEAM";
}
function playerIndicator(count){
  const alive=playerCount(count);
  const style=(overlaySettings.aliveStyle||"bars").toLowerCase();
  let html="";
  if(style==="pipes"){
    for(let i=0;i<4;i++) html+='<span class="pmark '+(i<alive?'':'dead')+'">|</span>';
    return '<span class="player-pipes" title="'+alive+'/4 players">'+html+'</span>';
  }
  if(style==="dots"){
    for(let i=0;i<4;i++) html+='<span class="pmark '+(i<alive?'':'dead')+'"></span>';
    return '<span class="player-dots" title="'+alive+'/4 players">'+html+'</span>';
  }
  for(let i=0;i<4;i++) html+='<span class="pstrip '+(i<alive?'':'dead')+'"></span>';
  return '<div class="player-strips" title="'+alive+'/4 players">'+html+'</div>';
}
function teamNameBlock(team){
  const tag=escapeHtml(teamTag(team));
  const indicator=playerIndicator(team.players);
  const style=(overlaySettings.aliveStyle||"bars").toLowerCase();
  if(style==="pipes"||style==="dots") return '<div class="t-line"><div class="t-name">'+tag+'</div>'+indicator+'</div>';
  return '<div class="t-name">'+tag+'</div>'+indicator;
}
function setOverlayMessage(msg){
  overlayMessage = msg || "";
  const list = document.getElementById("teams-list");
  if(list && currentTeams.length===0) list.innerHTML = '<div class="no-data">'+escapeHtml(overlayMessage)+'</div>';
}

// Calculate team totals across all matches
function playerCountForActiveMatch(matches){
  const list = Array.isArray(matches) ? matches : Object.values(matches || {});
  const row = list[activeMatchIndex] || {};
  return playerCount(row.players);
}
function updateActiveMatchFromScores(){
  const data=currentScores && currentScores._activeMatch;
  const idx=data && data.index!==undefined ? parseInt(data.index) : 0;
  activeMatchIndex=Math.max(0,Math.min(9,Number.isFinite(idx)?idx:0));
}
function calculateTeamStats(team, matches) {
  let totalKills = 0;
  let totalPlacementPoints = 0;
  let matchesPlayed = 0;
  const matchesList = Array.isArray(matches) ? matches : Object.values(matches || {});
  
  for (const match of matchesList) {
    if (!match) continue;
    const rankEmpty = match.rank === null || match.rank === undefined || match.rank === "";
    const killsEmpty = match.kills === null || match.kills === undefined || match.kills === "";
    const hasScore = !(rankEmpty && killsEmpty);
    if (!hasScore) continue;
    if (hasScore) matchesPlayed++;
    const kills = (match.kills !== null && match.kills !== undefined) ? parseInt(match.kills) : 0;
    const rank = (match.rank !== null && match.rank !== undefined && match.rank !== '') ? parseInt(match.rank) : null;
    totalKills += kills;
    totalPlacementPoints += placementPts(rank);
  }
  
  const totalPoints = totalKills + totalPlacementPoints;
  
  return {
    ...team,
    kills: totalKills,
    placePoints: totalPlacementPoints,
    total: totalPoints,
    played: matchesPlayed,
    players: playerCountForActiveMatch(matches)
  };
}

// Sort by: 
// 1. Total Points (higher is better)
// 2. Placement Points (higher is better) - when total points are equal
// 3. Kills (higher is better) - when both total and placement points are equal
function teamKey(team){ return sanitizeKey(team.name || ""); }
function buildStandingSnapshot(sortedTeams){
  const snap = {};
  sortedTeams.forEach((team,index)=>{ snap[teamKey(team)] = { rank:index+1, kills:team.kills||0, total:team.total||0 }; });
  return snap;
}
function movementFor(team, position){
  if(!lastStandingSnapshot) return { html:"", rowClass:"" };
  const prev = lastStandingSnapshot[teamKey(team)];
  if(!prev) return { html:"", rowClass:"" };
  const rankDelta = prev.rank - position;
  const killDelta = (team.kills||0) - (prev.kills||0);
  const totalDelta = (team.total||0) - (prev.total||0);
  if(rankDelta > 0){
    return { html:'<span class="rank-move up">+'+rankDelta+'</span>', rowClass:"rank-up" };
  }
  if(rankDelta < 0){
    const drop = Math.abs(rankDelta);
    return { html:'<span class="rank-move '+(drop>=6?'bigdown':'down')+'">-'+drop+'</span>', rowClass:drop>=6?"rank-bigdown":"rank-down" };
  }
  if(killDelta > 0 || totalDelta > 0){
    return { html:'<span class="rank-move kill">+'+(killDelta>0?killDelta:totalDelta)+'</span>', rowClass:"rank-kill" };
  }
  return { html:"", rowClass:"" };
}
function sortTeams(teams) {
  return teams.sort((a, b) => {
    // Primary: Total Points (higher is better)
    if (a.total !== b.total) {
      return b.total - a.total;
    }
    // Secondary: Placement Points (higher is better)
    if (a.placePoints !== b.placePoints) {
      return b.placePoints - a.placePoints;
    }
    // Tertiary: Kills (higher is better)
    return b.kills - a.kills;
  });
}

function render() {
  if (currentTeams.length === 0) {
    const list = document.getElementById("teams-list");
    if(list) list.innerHTML = '<div class="no-data">'+escapeHtml(overlayMessage || ("No teams found for event: "+EVENT_ID))+'</div>';
    document.getElementById("ticker-inner").innerHTML = '<div class="ti"><span style="color:#606878">'+escapeHtml(overlayMessage || "No teams found")+'</span></div>';
    return;
  }
  updateActiveMatchFromScores();
  
  // Calculate stats for each team
  let teams = currentTeams.map(t => calculateTeamStats(t, currentScores[t.name] || currentScores[sanitizeKey(t.name)] || []));
  teams = sortTeams(teams);
  
  // Calculate max matches played
  let maxMatches = 0;
  Object.keys(currentScores||{}).forEach(key => {
    if(key.charAt(0)==="_") return;
    const ms=currentScores[key];
    const matchList = Array.isArray(ms) ? ms : Object.values(ms || {});
    const played = matchList.filter(m => m && typeof m==="object" && m.rank !== null && m.rank !== undefined && m.rank !== "").length;
    if (played > maxMatches) maxMatches = played;
  });
  document.getElementById("match-count").textContent = maxMatches + " / 10 matches";
  
  // Render standings list
  const list = document.getElementById("teams-list");
  list.innerHTML = "";
  const maxShow = 25;
  
  teams.slice(0, maxShow).forEach((team, index) => {
    const position = index + 1;
    const rankClass = position === 1 ? "gold" : position === 2 ? "silver" : position === 3 ? "bronze" : "";
    const posColorClass = position === 1 ? "g" : position === 2 ? "s" : position === 3 ? "b" : "x";
    
    const move = { html:"", rowClass:"" };
    const row = document.createElement("div");
    row.className = "team-row " + rankClass + " " + move.rowClass;
    
    // Logo handling
    const logoHtml = team.logo ? 
      '<img class="t-logo" src="' + team.logo + '" alt="" onerror="this.style.display=\'none\'; this.parentElement.innerHTML += \'<div class=\\\'t-logo\\\' style=\\\'background:#2d3748; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ov-accent);\\\'>?</div>\'; this.remove()">' : 
      '<div class="t-logo" style="background:#2d3748; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ov-accent);">?</div>';
    
    row.innerHTML =
      '<div class="pos ' + posColorClass + '">' + position + move.html + '</div>' +
      logoHtml +
      '<div class="t-info">' + teamNameBlock(team) + '</div>' +
      '<div class="t-kills">' + team.kills + '</div>' +
      '<div class="t-place">' + team.placePoints + '</div>' +
      '<div class="t-pts">' + team.total + '</div>';
    list.appendChild(row);
  });
  
  // Render ticker
  lastStandingSnapshot = buildStandingSnapshot(teams);
  renderCount++;
  document.getElementById("ticker-inner").innerHTML = teams.map((team, index) =>
    '<div class="ti"><span class="ti-pos">#' + (index + 1) + '</span><span class="ti-name">' + escapeHtml(teamTag(team)) + '</span><span class="ti-sep">|</span><span class="ti-val">' + team.kills + ' kills</span><span class="ti-sep">·</span><span class="ti-val">' + team.placePoints + ' place</span><span class="ti-sep">·</span><span class="ti-pts">' + team.total + ' pts</span></div>'
  ).join("");
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

let liveTeamsRef=null, liveScoresRef=null, fallbackTeamsRef=null, fallbackScoresRef=null;
function stopFallbackRefs(){ if(fallbackTeamsRef) fallbackTeamsRef.off(); if(fallbackScoresRef) fallbackScoresRef.off(); fallbackTeamsRef=null; fallbackScoresRef=null; }
function loadMainFallback(){
  if(fallbackTeamsRef || fallbackScoresRef) return;
  fallbackTeamsRef=db.ref(eventPath("teams")); fallbackScoresRef=db.ref(eventPath("matches"));
  fallbackTeamsRef.on("value", snap=>{ const val=snap.val(); currentTeams=val?(Array.isArray(val)?val:Object.values(val)):[]; if(!currentTeams.length)setOverlayMessage("No teams found for event: "+EVENT_ID); render(); }, err=>{ setOverlayMessage("Firebase teams blocked: "+err.message); render(); });
  fallbackScoresRef.on("value", snap=>{ currentScores=snap.val()||{}; render(); }, err=>{ setOverlayMessage("Firebase scores blocked: "+err.message); render(); });
}
function activeSessions(session){
  if(!session) return [];
  if(Array.isArray(session.sessions)) return session.sessions.filter(s=>s&&s.group&&s.date);
  if(session.group&&session.date) return [{group:session.group,date:session.date}];
  return [];
}
function bindLiveSession(session){
  if(liveTeamsRef) liveTeamsRef.off();
  if(liveScoresRef) liveScoresRef.off();
  stopFallbackRefs();
  const sessions = activeSessions(session);
  const active = sessions.length>0;
  if(sessions.length>1){ bindMultiLiveSession(sessions); return; }
  const one = sessions[0];
  liveTeamsRef = active ? db.ref(`${eventPath("eventGroups")}/${one.group}/sessions/${one.date}/teams`) : db.ref(eventPath("teams"));
  liveScoresRef = active ? db.ref(`${eventPath("eventGroups")}/${one.group}/sessions/${one.date}/scores`) : db.ref(eventPath("matches"));
  liveTeamsRef.on("value", snap => {
    const val = snap.val();
    const list = val ? (Array.isArray(val) ? val : Object.values(val)) : [];
    if(active && list.length===0){ loadMainFallback(); return; }
    stopFallbackRefs();
    currentTeams = list;
    if(!currentTeams.length) setOverlayMessage(active ? "No teams in active session. Check group/date in admin." : "No teams found for event: "+EVENT_ID);
    render();
  }, err=>{ setOverlayMessage("Firebase teams blocked: "+err.message); render(); });
  liveScoresRef.on("value", snap => {
    currentScores = snap.val() || {};
    render();
  }, err=>{ setOverlayMessage("Firebase scores blocked: "+err.message); render(); });
}
function bindMultiLiveSession(sessions){
  const teamRefs=[], scoreRefs=[], teamBuckets={}, scoreBuckets={};
  function combine(){
    currentTeams=[]; currentScores={};
    sessions.forEach(s=>{
      const key=s.group+"|"+s.date;
      (teamBuckets[key]||[]).forEach(t=>{ if(!currentTeams.find(x=>x.name===t.name)) currentTeams.push(t); });
      Object.assign(currentScores, scoreBuckets[key]||{});
    });
    render();
  }
  sessions.forEach(s=>{
    const key=s.group+"|"+s.date;
    const tr=db.ref(`${eventPath("eventGroups")}/${s.group}/sessions/${s.date}/teams`), sr=db.ref(`${eventPath("eventGroups")}/${s.group}/sessions/${s.date}/scores`);
    teamRefs.push(tr); scoreRefs.push(sr);
    tr.on("value",snap=>{ const val=snap.val(); teamBuckets[key]=val?(Array.isArray(val)?val:Object.values(val)):[]; if(!teamBuckets[key].length)setOverlayMessage("No teams in Group "+s.group+" · "+s.date); combine(); }, err=>{ setOverlayMessage("Firebase teams blocked: "+err.message); render(); });
    sr.on("value",snap=>{ scoreBuckets[key]=snap.val()||{}; combine(); }, err=>{ setOverlayMessage("Firebase scores blocked: "+err.message); render(); });
  });
  liveTeamsRef={off:function(){teamRefs.forEach(r=>r.off());}};
  liveScoresRef={off:function(){scoreRefs.forEach(r=>r.off());}};
  const status=document.getElementById("fb-status"); if(status) status.textContent=`● ${sessions.length} Groups Active`;
}
db.ref(eventPath("activeSession")).on("value", snap => bindLiveSession(snap.val()), err=>{ setOverlayMessage("Firebase active session blocked: "+err.message); loadMainFallback(); });
</script>
</body>
</html>
