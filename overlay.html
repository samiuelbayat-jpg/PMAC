  if(card) card.style.display="none";
  if(s.streamerLogo){ panelLogo.src=s.streamerLogo; panelLogo.style.display="block"; }
  panelTitle.textContent=(activeDesign==="redlive"?(s.streamerName||"LIVE STANDING"):(activeDesign==="pmgo"?(s.streamerName||"PMGO LIVE POINTS"):(s.streamerName||"Standings")));
}
function applySettingsPayload(val){ overlaySettings=Object.assign({},overlaySettings,val||{}); applyOverlaySettings(); render(); }
const overlaySettingsLiveRef=db.ref(eventPath("overlaySettings"));
overlaySettingsLiveRef.on("value",snap=>applySettingsPayload(snap.val()||{}));
setInterval(()=>{ overlaySettingsLiveRef.once("value").then(snap=>{ const val=snap.val(); if(val) applySettingsPayload(val); }); },2000);
let lastEliminationTs=0, eliminationTimer=null;
function showEliminationAlert(a){
  if(!a||!a.ts||a.ts===lastEliminationTs) return;
  if(Date.now()-a.ts>45000){ lastEliminationTs=a.ts; return; }
  lastEliminationTs=a.ts;
  const box=document.getElementById("elim-alert"), teamEl=document.getElementById("elim-team"), metaEl=document.getElementById("elim-meta"), logoEl=document.getElementById("elim-logo"), fallbackEl=document.getElementById("elim-logo-fallback");
  if(!box||!teamEl||!metaEl) return;
  const tag=String(a.tag||"").trim().toUpperCase();
  const team=String(a.team||"TEAM").trim().toUpperCase();
  const display=tag||team;
  const matched=findEliminationTeam(team,tag);
  const logo=matched && matched.logo ? matched.logo : "";
  if(logoEl&&fallbackEl){
    if(logo){ logoEl.src=logo; logoEl.style.display="block"; fallbackEl.style.display="none"; }
    else { logoEl.removeAttribute("src"); logoEl.style.display="none"; fallbackEl.style.display="flex"; }
  }
  const elimInfo=getEliminationInfo(matched,team,tag);
  if(["official","bluecard"].includes(overlaySettings.elimStyle||"")){
    teamEl.innerHTML="<span class=\"elim-name\">"+escapeHtml(display)+"</span><span class=\"elim-word\">ELIMINATED</span>";
    metaEl.textContent="";
  }else{
    teamEl.innerHTML="TEAM "+escapeHtml(display)+" <span class=\"elim-word\">ELIMINATED</span>";
    metaEl.textContent=(tag&&team&&tag!==team?team+" · ":"")+(a.match?"Match "+a.match:"");
  }
  box.classList.add("show");
  clearTimeout(eliminationTimer);
  eliminationTimer=setTimeout(()=>box.classList.remove("show"),3000);
}
db.ref(eventPath("overlaySettings/eliminationAlert")).on("value",snap=>showEliminationAlert(snap.val()||null));
function sanitizeKey(n){ return String(n||"").replace(/[\.\#\$\/\[\]]/g,"_"); }
function playerCount(v){ const n=parseInt(v); if(!Number.isFinite(n)) return 4; return Math.max(0,Math.min(4,n)); }
function findEliminationTeam(teamName,tag){
  const t=String(teamName||"").trim().toUpperCase();
  const g=String(tag||"").trim().toUpperCase();
  return currentTeams.find(x=>String(x.name||"").trim().toUpperCase()===t || teamTag(x)===g || teamTag(x)===t) || null;
}
function getEliminationInfo(teamObj,teamName,tag){
  const standings=currentTeams.map(t=>calculateTeamStats(t,currentScores[t.name]||currentScores[sanitizeKey(t.name)]||[])).sort((a,b)=>(b.total-a.total)||(b.placePoints-a.placePoints)||(b.kills-a.kills));
  const found=teamObj ? standings.find(x=>String(x.name||"")===String(teamObj.name||"")) : standings.find(x=>String(x.name||"").trim().toUpperCase()===String(teamName||"").trim().toUpperCase() || teamTag(x)===String(tag||"").trim().toUpperCase());
  const rank=found ? standings.indexOf(found)+1 : 0;
  return { rank: rank || "-", kills: found ? (parseInt(found.kills)||0) : 0 };
}
function teamTag(team){
  const saved=String(team&&team.tag?team.tag:"").trim().toUpperCase();
  if(saved) return saved.slice(0,8);
  const name=String(team&&team.name?team.name:"TEAM").trim().toUpperCase();
  const words=name.split(/\s+/).filter(Boolean);
  if(words.length>1) return words.map(w=>w[0]).join("").slice(0,5);
  return name.replace(/[^A-Z0-9]/g,"").slice(0,5) || "TEAM";
}
function playerIndicator(count){
  const alive=playerCount(count);
  const style=(overlaySettings.aliveStyle||"bars").toLowerCase();
  let html="";
  if(style==="pipes"){
    for(let i=0;i<4;i++) html+='<span class="pmark '+(i<alive?'':'dead')+'">|</span>';
    return '<span class="player-pipes" title="'+alive+'/4 players">'+html+'</span>';
  }
  if(style==="dots"){
    for(let i=0;i<4;i++) html+='<span class="pmark '+(i<alive?'':'dead')+'"></span>';
    return '<span class="player-dots" title="'+alive+'/4 players">'+html+'</span>';
  }
  for(let i=0;i<4;i++) html+='<span class="pstrip '+(i<alive?'':'dead')+'"></span>';
  return '<div class="player-strips" title="'+alive+'/4 players">'+html+'</div>';
}
function teamNameBlock(team){
  const tag=escapeHtml(teamTag(team));
  const indicator=playerIndicator(team.players);
  const style=(overlaySettings.aliveStyle||"bars").toLowerCase();
  if(style==="pipes"||style==="dots") return '<div class="t-line"><div class="t-name">'+tag+'</div>'+indicator+'</div>';
  return '<div class="t-name">'+tag+'</div>'+indicator;
}
function setOverlayMessage(msg){
  overlayMessage = msg || "";
  applyColumnHeaders();
  const list = document.getElementById("teams-list");
  if(list && currentTeams.length===0) list.innerHTML = '<div class="no-data">'+escapeHtml(overlayMessage)+'</div>';
}

// Calculate team totals across all matches
function playerCountForActiveMatch(matches){
  const list = Array.isArray(matches) ? matches : Object.values(matches || {});
  const row = list[activeMatchIndex] || {};
  return playerCount(row.players);
}
function updateActiveMatchFromScores(){
  const data=currentScores && currentScores._activeMatch;
  const idx=data && data.index!==undefined ? parseInt(data.index) : 0;
  activeMatchIndex=Math.max(0,Math.min(9,Number.isFinite(idx)?idx:0));
}
function calculateTeamStats(team, matches) {
  let totalKills = 0;
  let totalPlacementPoints = 0;
  let matchesPlayed = 0;
  const matchesList = Array.isArray(matches) ? matches : Object.values(matches || {});
  
  for (const match of matchesList) {
    if (!match) continue;
    const rankEmpty = match.rank === null || match.rank === undefined || match.rank === "";
    const killsEmpty = match.kills === null || match.kills === undefined || match.kills === "";
    const hasScore = !(rankEmpty && killsEmpty);
    if (!hasScore) continue;
    if (hasScore) matchesPlayed++;
    const kills = (match.kills !== null && match.kills !== undefined) ? parseInt(match.kills) : 0;
    const rank = (match.rank !== null && match.rank !== undefined && match.rank !== '') ? parseInt(match.rank) : null;
    totalKills += kills;
    totalPlacementPoints += placementPts(rank);
  }
  
  const totalPoints = totalKills + totalPlacementPoints;
  
  return {
    ...team,
    kills: totalKills,
    placePoints: totalPlacementPoints,
    total: totalPoints,
    played: matchesPlayed,
    players: playerCountForActiveMatch(matches)
  };
}

// Sort by: 
// 1. Total Points (higher is better)
// 2. Placement Points (higher is better) - when total points are equal
// 3. Kills (higher is better) - when both total and placement points are equal
function teamKey(team){ return sanitizeKey(team.name || ""); }
function buildStandingSnapshot(sortedTeams){
  const snap = {};
  sortedTeams.forEach((team,index)=>{ snap[teamKey(team)] = { rank:index+1, kills:team.kills||0, total:team.total||0 }; });
  return snap;
}
function movementFor(team, position){
  if(!lastStandingSnapshot) return { html:"", rowClass:"" };
  const prev = lastStandingSnapshot[teamKey(team)];
  if(!prev) return { html:"", rowClass:"" };
  const rankDelta = prev.rank - position;
  const killDelta = (team.kills||0) - (prev.kills||0);
  const totalDelta = (team.total||0) - (prev.total||0);
  if(rankDelta > 0){
    return { html:'<span class="rank-move up">+'+rankDelta+'</span>', rowClass:"rank-up" };
  }
  if(rankDelta < 0){
    const drop = Math.abs(rankDelta);
    return { html:'<span class="rank-move '+(drop>=6?'bigdown':'down')+'">-'+drop+'</span>', rowClass:drop>=6?"rank-bigdown":"rank-down" };
  }
  if(killDelta > 0 || totalDelta > 0){
    return { html:'<span class="rank-move kill">+'+(killDelta>0?killDelta:totalDelta)+'</span>', rowClass:"rank-kill" };
  }
  return { html:"", rowClass:"" };
}
function captureRowTops(list){
  const tops = {};
  if(!list) return tops;
  Array.from(list.querySelectorAll(".team-row[data-team-key]")).forEach(row=>{
    tops[row.dataset.teamKey] = row.getBoundingClientRect().top;
  });
  return tops;
}
function animateRankSlides(list, oldTops){
  if(!list || !oldTops || !Object.keys(oldTops).length) return;
  const rows = Array.from(list.querySelectorAll(".team-row[data-team-key]"));
  rows.forEach(row=>{
    const oldTop = oldTops[row.dataset.teamKey];
    if(oldTop === undefined) return;
    const newTop = row.getBoundingClientRect().top;
    const delta = oldTop - newTop;
    if(Math.abs(delta) < 2) return;
    row.classList.add("rank-slide");
    row.style.transition = "none";
    row.style.transform = "translateY("+delta+"px)";
  });
  requestAnimationFrame(()=>{
    rows.forEach(row=>{
      if(!row.classList.contains("rank-slide")) return;
      row.style.transition = "";
      row.style.transform = "translateY(0)";
      window.setTimeout(()=>{
        row.classList.remove("rank-slide");
        row.style.transform = "";
      }, 680);
    });
  });
}
function sortTeams(teams) {
  return teams.sort((a, b) => {
    // Primary: Total Points (higher is better)
    if (a.total !== b.total) {
      return b.total - a.total;
    }
    // Secondary: Placement Points (higher is better)
    if (a.placePoints !== b.placePoints) {
      return b.placePoints - a.placePoints;
    }
    // Tertiary: Kills (higher is better)
    return b.kills - a.kills;
  });
}

function render() {
  const activeDesign = currentOverlayDesign();
  applyColumnHeaders();
  if (currentTeams.length === 0) {
    const list = document.getElementById("teams-list");
    if(list) list.innerHTML = '<div class="no-data">'+escapeHtml(overlayMessage || ("No teams found for event: "+EVENT_ID))+'</div>';
    document.getElementById("ticker-inner").innerHTML = '<div class="ti"><span style="color:#606878">'+escapeHtml(overlayMessage || "No teams found")+'</span></div>';
    return;
  }
  updateActiveMatchFromScores();
  
  // Calculate stats for each team
  let teams = currentTeams.map(t => calculateTeamStats(t, currentScores[t.name] || currentScores[sanitizeKey(t.name)] || []));
  teams = sortTeams(teams);
  
  // Calculate max matches played
  let maxMatches = 0;
  Object.keys(currentScores||{}).forEach(key => {
    if(key.charAt(0)==="_") return;
    const ms=currentScores[key];
    const matchList = Array.isArray(ms) ? ms : Object.values(ms || {});
    const played = matchList.filter(m => m && typeof m==="object" && m.rank !== null && m.rank !== undefined && m.rank !== "").length;
    if (played > maxMatches) maxMatches = played;
  });
  document.getElementById("match-count").textContent = maxMatches + " / 10 matches";
  
  // Render standings list
  const list = document.getElementById("teams-list");
  const oldRowTops = captureRowTops(list);
  list.innerHTML = "";
  const maxShow = activeDesign==="pmgo" ? 16 : 25;
  
  teams.slice(0, maxShow).forEach((team, index) => {
    const position = index + 1;
    const rankClass = position === 1 ? "gold" : position === 2 ? "silver" : position === 3 ? "bronze" : "";
    const eliminatedClass = playerCount(team.players) === 0 ? "eliminated-team" : "";
    const posColorClass = position === 1 ? "g" : position === 2 ? "s" : position === 3 ? "b" : "x";
    
    const move = { html:"", rowClass:"" };
    const row = document.createElement("div");
    row.className = "team-row " + rankClass + " " + eliminatedClass + " " + move.rowClass;
    row.dataset.teamKey = teamKey(team);
    
    // Logo handling
    const logoHtml = team.logo ? 
      '<img class="t-logo" src="' + team.logo + '" alt="" onerror="this.style.display=\'none\'; this.parentElement.innerHTML += \'<div class=\\\'t-logo\\\' style=\\\'background:transparent; border:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ov-accent);\\\'>?</div>\'; this.remove()">' : 
      '<div class="t-logo" style="background:transparent; border:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ov-accent);">?</div>';
    
    if(activeDesign==="pmgo"){
      row.innerHTML =
        '<div class="pos ' + posColorClass + '">' + position + '</div>' +
        '<div class="pmgo-team-cell">' + logoHtml + '<div class="t-name">' + escapeHtml(teamTag(team)) + '</div></div>' +
        '<div class="pmgo-alive">' + playerIndicator(team.players) + '</div>' +
        '<div class="t-kills">' + team.kills + '</div>' +
        '<div class="t-pts">' + team.total + '</div>';
    }else{
      row.innerHTML =
        '<div class="pos ' + posColorClass + '">' + position + move.html + '</div>' +
        logoHtml +
        '<div class="t-info">' + teamNameBlock(team) + '</div>' +
        '<div class="t-kills">' + team.kills + '</div>' +
        '<div class="t-place">' + team.placePoints + '</div>' +
        '<div class="t-pts">' + team.total + '</div>';
    }
    list.appendChild(row);
  });
  animateRankSlides(list, oldRowTops);
  
  // Render ticker
  lastStandingSnapshot = buildStandingSnapshot(teams);
  renderCount++;
  document.getElementById("ticker-inner").innerHTML = teams.map((team, index) =>
    '<div class="ti"><span class="ti-pos">#' + (index + 1) + '</span><span class="ti-name">' + escapeHtml(teamTag(team)) + '</span><span class="ti-sep">|</span><span class="ti-val">' + team.kills + ' kills</span><span class="ti-sep">·</span><span class="ti-val">' + team.placePoints + ' place</span><span class="ti-sep">·</span><span class="ti-pts">' + team.total + ' pts</span></div>'
  ).join("");
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

let liveTeamsRef=null, liveScoresRef=null, fallbackTeamsRef=null, fallbackScoresRef=null;
function stopFallbackRefs(){ if(fallbackTeamsRef) fallbackTeamsRef.off(); if(fallbackScoresRef) fallbackScoresRef.off(); fallbackTeamsRef=null; fallbackScoresRef=null; }
function loadMainFallback(){
  if(fallbackTeamsRef || fallbackScoresRef) return;
  fallbackTeamsRef=db.ref(eventPath("teams")); fallbackScoresRef=db.ref(eventPath("matches"));
  fallbackTeamsRef.on("value", snap=>{ const val=snap.val(); currentTeams=val?(Array.isArray(val)?val:Object.values(val)):[]; if(!currentTeams.length)setOverlayMessage("No teams found for event: "+EVENT_ID); render(); }, err=>{ setOverlayMessage("Firebase teams blocked: "+err.message); render(); });
  fallbackScoresRef.on("value", snap=>{ currentScores=snap.val()||{}; render(); }, err=>{ setOverlayMessage("Firebase scores blocked: "+err.message); render(); });
}
function activeSessions(session){
  if(!session) return [];
  if(Array.isArray(session.sessions)) return session.sessions.filter(s=>s&&s.group&&s.date);
  if(session.group&&session.date) return [{group:session.group,date:session.date}];
  return [];
}
function bindLiveSession(session){
  if(liveTeamsRef) liveTeamsRef.off();
  if(liveScoresRef) liveScoresRef.off();
  stopFallbackRefs();
  const sessions = activeSessions(session);
  const active = sessions.length>0;
  if(sessions.length>1){ bindMultiLiveSession(sessions); return; }
  const one = sessions[0];
  liveTeamsRef = active ? db.ref(`${eventPath("eventGroups")}/${one.group}/sessions/${one.date}/teams`) : db.ref(eventPath("teams"));
  liveScoresRef = active ? db.ref(`${eventPath("eventGroups")}/${one.group}/sessions/${one.date}/scores`) : db.ref(eventPath("matches"));
  liveTeamsRef.on("value", snap => {
    const val = snap.val();
    const list = val ? (Array.isArray(val) ? val : Object.values(val)) : [];
    if(active && list.length===0){ loadMainFallback(); return; }
    stopFallbackRefs();
    currentTeams = list;
    if(!currentTeams.length) setOverlayMessage(active ? "No teams in active session. Check group/date in admin." : "No teams found for event: "+EVENT_ID);
    render();
  }, err=>{ setOverlayMessage("Firebase teams blocked: "+err.message); render(); });
  liveScoresRef.on("value", snap => {
    currentScores = snap.val() || {};
    render();
  }, err=>{ setOverlayMessage("Firebase scores blocked: "+err.message); render(); });
}
function bindMultiLiveSession(sessions){
  const teamRefs=[], scoreRefs=[], teamBuckets={}, scoreBuckets={};
  function combine(){
    currentTeams=[]; currentScores={};
    sessions.forEach(s=>{
      const key=s.group+"|"+s.date;
      (teamBuckets[key]||[]).forEach(t=>{ if(!currentTeams.find(x=>x.name===t.name)) currentTeams.push(t); });
      Object.assign(currentScores, scoreBuckets[key]||{});
    });
    render();
  }
  sessions.forEach(s=>{
    const key=s.group+"|"+s.date;
    const tr=db.ref(`${eventPath("eventGroups")}/${s.group}/sessions/${s.date}/teams`), sr=db.ref(`${eventPath("eventGroups")}/${s.group}/sessions/${s.date}/scores`);
    teamRefs.push(tr); scoreRefs.push(sr);
    tr.on("value",snap=>{ const val=snap.val(); teamBuckets[key]=val?(Array.isArray(val)?val:Object.values(val)):[]; if(!teamBuckets[key].length)setOverlayMessage("No teams in Group "+s.group+" · "+s.date); combine(); }, err=>{ setOverlayMessage("Firebase teams blocked: "+err.message); render(); });
    sr.on("value",snap=>{ scoreBuckets[key]=snap.val()||{}; combine(); }, err=>{ setOverlayMessage("Firebase scores blocked: "+err.message); render(); });
  });
  liveTeamsRef={off:function(){teamRefs.forEach(r=>r.off());}};
  liveScoresRef={off:function(){scoreRefs.forEach(r=>r.off());}};
  const status=document.getElementById("fb-status"); if(status) status.textContent=`● ${sessions.length} Groups Active`;
}
db.ref(eventPath("activeSession")).on("value", snap => bindLiveSession(snap.val()), err=>{ setOverlayMessage("Firebase active session blocked: "+err.message); loadMainFallback(); });
</script>
