<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PMAF Team Match Points Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:transparent}
    body{position:relative;font-family:"Barlow Condensed",Arial,sans-serif;color:#fff}
    .stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:left top;background:transparent;overflow:hidden}
    .panel{position:absolute;left:120px;right:120px;top:112px;padding:0;background:transparent;filter:drop-shadow(0 24px 45px rgba(0,0,0,.45))}
    .head{position:relative;z-index:1}
    .titlebar{height:82px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 0 12px 0;color:#fff;text-shadow:0 4px 12px rgba(0,0,0,.55)}
    .title{font-size:60px;line-height:.9;font-weight:900;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
    .sub{font-family:"Share Tech Mono",monospace;font-size:18px;color:#111;background:#ffd33f;text-transform:uppercase;padding:5px 12px;border-left:7px solid #e00018;font-weight:900;text-shadow:none}
    .colhead{height:40px;display:grid;grid-template-columns:82px 1fr repeat(var(--matches),96px) 112px;align-items:center;background:#f7f7f7;color:#070707;border-top:4px solid #111;border-bottom:3px solid #111}
    .hcell{height:100%;display:flex;align-items:center;justify-content:center;border-right:2px solid #d2d2d2;font-size:19px;font-weight:900;text-align:center;text-transform:uppercase;color:#070707}
    .hcell.rankh,.hcell.teamh{background:#ffe15a}
    .rows{position:relative;z-index:1}
    .row{position:relative;z-index:0;height:var(--row-h,56px);display:grid;grid-template-columns:82px 1fr repeat(var(--matches),96px) 112px;align-items:center;margin-bottom:var(--row-gap,8px);background:#fff;color:#080808;border-bottom:3px solid #111}
    .row>*{position:relative;z-index:1}
    .row:before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(82px + ((100% - 82px - (var(--matches) * 96px) - 112px) * .58));background:linear-gradient(90deg,#fff099,#ffd83d);z-index:0}
    .row:after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.75)}
    .row.animate-in{animation:rowSlideIn 1.05s cubic-bezier(.18,.86,.2,1) both;animation-delay:calc(var(--i,0) * 160ms)}
    @keyframes rowSlideIn{0%{opacity:0;transform:translateX(-360px);filter:blur(3px)}65%{opacity:1;filter:blur(0)}100%{opacity:1;transform:translateX(0);filter:blur(0)}}
    .row:nth-child(1):before{background:linear-gradient(90deg,#fff3a6,#ffcf37)}
    .rank{font-size:var(--rank-size,27px);font-weight:900;text-align:center;color:#050505}
    .team{min-width:0;display:flex;align-items:center;gap:12px}
    .logo{width:var(--logo-w,54px);height:var(--logo-h,40px);display:flex;align-items:center;justify-content:center;overflow:visible;flex:0 0 auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
    .logo img{width:100%;height:100%;object-fit:contain;display:block;transform:scale(var(--logo-scale,1))}
    .logo span{font-size:15px;font-weight:900;color:#111}
    .name{font-size:var(--name-size,27px);font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#111}
    .points{height:100%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.96);border-left:2px solid #d0d0d0;font-family:"Share Tech Mono",monospace;font-size:var(--point-size,23px);font-weight:900;color:#111}
    .total{height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff3a8 0%,#ffd33f 42%,#e39b00 100%);color:#080808;border-left:4px solid #111;border-right:3px solid #111;font-size:var(--total-size,27px);font-weight:900;text-shadow:0 1px 0 rgba(255,255,255,.45);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.20)}
    .empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:42px;font-weight:900;text-transform:uppercase;color:rgba(255,255,255,.8);background:rgba(0,0,0,.28)}
    .status{position:absolute;right:24px;bottom:20px;font-family:"Share Tech Mono",monospace;font-size:12px;color:rgba(255,255,255,.55)}
  </style>
</head>
<body>
<div class="stage" id="stage">
  <div class="panel" id="panel">
    <div class="head" id="head"></div>
    <div class="rows" id="rows"></div>
    <div class="empty" id="empty">Waiting for teams and scores</div>
  </div>
  <div class="status" id="status"></div>
</div>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyD-RFu-40Igcoqhm8QBbu_PgdFxV6aUIQA",
  authDomain:"pubg-mobile-afghanistan.firebaseapp.com",
  databaseURL:"https://pubg-mobile-afghanistan-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"pubg-mobile-afghanistan",
  storageBucket:"pubg-mobile-afghanistan.firebasestorage.app",
  messagingSenderId:"279105805502",
  appId:"1:279105805502:web:8def653069d0b3d73bd2ef"
});

var db=firebase.database();
var qs=new URLSearchParams(location.search);
var EVENT_ID=qs.get("event")||localStorage.getItem("pmac_active_event")||"default";
var MATCHES=Math.max(1,Math.min(12,parseInt(qs.get("matches")||"6",10)||6));
var LIMIT=Math.max(1,Math.min(64,parseInt(qs.get("limit")||"64",10)||64));
var TITLE=qs.get("title")||"MATCH BY MATCH POINTS";
var MODE=qs.get("mode")||"event";
var teams=[],scores={},teamsRef=null,scoresRef=null,activeRef=null;

document.documentElement.style.setProperty("--matches",MATCHES);

function fitStage(){
  var scale=Math.min(window.innerWidth/1920,window.innerHeight/1080);
  document.getElementById("stage").style.transform="scale("+scale+")";
}
window.addEventListener("resize",fitStage);
fitStage();

function eventBasePath(){return EVENT_ID==="default"?"pmac":"pmac/events/"+EVENT_ID;}
function eventPath(child){return eventBasePath()+"/"+child;}
function sanitizeKey(n){return String(n||"").replace(/[\.\#\$\/\[\]]/g,"_");}
function norm(n){return String(n||"").trim().toUpperCase();}
function initials(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(function(s){return s[0]||"";}).join("").toUpperCase()||"?";}
function placePoints(rank){
  var r=parseInt(rank,10);
  if(r===1)return 10;if(r===2)return 6;if(r===3)return 5;if(r===4)return 4;if(r===5)return 3;if(r===6)return 2;if(r===7||r===8)return 1;
  return 0;
}
function rowPoints(row){
  if(!row)return 0;
  if(row.total!==undefined&&row.total!==null&&row.total!=="")return parseInt(row.total,10)||0;
  if(row.points!==undefined&&row.points!==null&&row.points!=="")return parseInt(row.points,10)||0;
  if(row.pts!==undefined&&row.pts!==null&&row.pts!=="")return parseInt(row.pts,10)||0;
  return (parseInt(row.kills,10)||0)+placePoints(row.rank);
}
function scoreRowsForTeam(team){
  var key=sanitizeKey(team.name);
  return scores[key]||scores[norm(team.name)]||scores[team.name]||[];
}
function teamTotal(team){
  var rows=scoreRowsForTeam(team),sum=0;
  for(var i=0;i<MATCHES;i++)sum+=rowPoints(rows[i]||{});
  return sum;
}
function setStatus(t){document.getElementById("status").textContent=t||"";}
function attachDataRefs(base){
  if(teamsRef)teamsRef.off();
  if(scoresRef)scoresRef.off();
  teamsRef=db.ref(base+"/teams");
  scoresRef=db.ref(base+(base.indexOf("/eventGroups/")>-1?"/scores":"/matches"));
  teamsRef.on("value",function(s){var v=s.val()||[];teams=Array.isArray(v)?v:Object.values(v);render();},function(e){setStatus(e.message);});
  scoresRef.on("value",function(s){scores=s.val()||{};render();},function(e){setStatus(e.message);});
}
function watchActive(){
  if(activeRef)activeRef.off();
  activeRef=db.ref(eventPath("activeSession"));
  activeRef.on("value",function(s){
    var a=s.val();
    if(a&&a.group&&a.date)attachDataRefs(eventPath("eventGroups/"+a.group+"/sessions/"+a.date));
    else attachDataRefs(eventBasePath());
  },function(){attachDataRefs(eventBasePath());});
}
function renderHead(){
  var head=document.getElementById("head"),html="";
  html+='<div class="titlebar"><div class="title">'+TITLE+'</div><div class="sub">'+(EVENT_ID==="default"?"PMAF":EVENT_ID).replace(/[-_]/g," ")+'</div></div>';
  html+='<div class="colhead"><div class="hcell rankh">RANK</div><div class="hcell teamh">TEAM NAME</div>';
  for(var i=1;i<=MATCHES;i++)html+='<div class="hcell">M'+i+'</div>';
  html+='<div class="hcell">TOTAL</div></div>';
  head.innerHTML=html;
}
function renderLogo(team){
  if(team.logo)return '<img src="'+team.logo+'" alt="" onload="fitLogo(this)">';
  return '<span>'+initials(team.name)+'</span>';
}
function fitLogo(img){
  var scale=1;
  var longest=Math.max(img.naturalWidth||0,img.naturalHeight||0);
  try{
    var c=document.createElement("canvas"),w=img.naturalWidth||0,h=img.naturalHeight||0;
    c.width=w;c.height=h;
    var ctx=c.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(img,0,0,w,h);
    var data=ctx.getImageData(0,0,w,h).data,minX=w,minY=h,maxX=0,maxY=0,found=false;
    for(var y=0;y<h;y++){
      for(var x=0;x<w;x++){
        if(data[(y*w+x)*4+3]>18){if(x<minX)minX=x;if(y<minY)minY=y;if(x>maxX)maxX=x;if(y>maxY)maxY=y;found=true;}
      }
    }
    if(found){
      var visual=Math.max(maxX-minX+1,maxY-minY+1);
      var ratio=visual/Math.max(w,h);
      if(ratio<.45)scale=2.05;
      else if(ratio<.60)scale=1.62;
      else if(ratio<.72)scale=1.34;
    }
  }catch(e){
    if(longest&&longest<80)scale=1.85;
    else if(longest&&longest<130)scale=1.45;
  }
  img.style.setProperty("--logo-scale",scale);
}
function fitRows(count){
  var root=document.documentElement;
  var gap=count>28?3:(count>22?4:(count>18?6:8));
  var top=112,title=82,head=40,bottom=28;
  var available=1080-top-title-head-bottom;
  var rowH=Math.floor((available-(Math.max(count-1,0)*gap))/Math.max(count,1));
  rowH=Math.max(26,Math.min(56,rowH));
  root.style.setProperty("--row-h",rowH+"px");
  root.style.setProperty("--row-gap",gap+"px");
  root.style.setProperty("--rank-size",Math.max(18,Math.min(30,rowH*.58))+"px");
  root.style.setProperty("--name-size",Math.max(16,Math.min(27,rowH*.48))+"px");
  root.style.setProperty("--point-size",Math.max(17,Math.min(29,rowH*.56))+"px");
  root.style.setProperty("--total-size",Math.max(19,Math.min(32,rowH*.62))+"px");
  root.style.setProperty("--logo-w",Math.max(32,Math.min(54,rowH*.96))+"px");
  root.style.setProperty("--logo-h",Math.max(24,Math.min(40,rowH*.72))+"px");
}
function render(){
  renderHead();
  var list=(teams||[]).filter(function(t){return t&&t.name;}).map(function(t){return Object.assign({},t,{total:teamTotal(t)});});
  list.sort(function(a,b){return b.total-a.total||norm(a.name).localeCompare(norm(b.name));});
  list=list.slice(0,LIMIT);
  fitRows(list.length);
  var rows=document.getElementById("rows");
  document.getElementById("empty").style.display=list.length?"none":"flex";
  rows.innerHTML=list.map(function(t,idx){
    var sr=scoreRowsForTeam(t),cells="";
    for(var i=0;i<MATCHES;i++)cells+='<div class="points">'+rowPoints(sr[i]||{})+'</div>';
    return '<div class="row animate-in" style="--i:'+idx+'"><div class="rank">'+(idx+1)+'</div><div class="team"><div class="logo">'+renderLogo(t)+'</div><div class="name">'+String(t.name||"").toUpperCase()+'</div></div>'+cells+'<div class="total">'+t.total+'</div></div>';
  }).join("");
  setStatus("event: "+EVENT_ID+" | teams: "+teams.length);
}

watchActive();
</script>
</body>
</html>
