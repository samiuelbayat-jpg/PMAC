<style>

.bottom{position:absolute;left:385px;right:0;bottom:0;height:228px;z-index:7;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(0,0,0,.72)}
.map-card{position:relative;overflow:hidden;background:#09120f;border-right:3px solid var(--accent);display:grid;grid-template-rows:42px 1fr}
.map-card:last-child{border-right:0}
.map-label{position:relative;z-index:4;height:42px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#07130d;font-size:27px;font-weight:900;text-transform:uppercase}
.map-body{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.map-body:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.78)),var(--map-bg);background-size:cover;background-position:center;filter:saturate(1.05) contrast(1.05);transform:scale(1.06)}
.map-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.05);transform:scale(1.06)}
.map-body:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.42),transparent 45%,rgba(0,0,0,.38))}
.map-info{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;text-transform:uppercase;text-shadow:0 5px 12px #000}
.map-status{font-size:24px;font-weight:900;color:#fff;line-height:1;letter-spacing:.04em}
.map-time{margin-top:8px;font-family:'Share Tech Mono',monospace;font-size:42px;font-weight:900;color:#fff;line-height:1}
.map-name{margin-top:12px;font-size:36px;font-weight:900;color:#fff;line-height:.9}
.winner-logo{width:66px;height:54px;max-width:66px;max-height:54px;object-fit:contain;object-position:center;margin-bottom:4px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.75))}
.winner-name{margin-top:7px;font-size:32px;font-weight:900;color:#fff;line-height:1}
.winner-small{font-size:19px;font-weight:900;color:#fff;letter-spacing:.08em;line-height:1}
.status{position:absolute;right:16px;top:14px;z-index:30;font-family:'Share Tech Mono',monospace;font-size:10px;color:rgba(255,255,255,.45);text-shadow:0 2px 8px #000}
.status.ok{color:rgba(66,255,136,.55)}
.status.err{color:#ff6868}
</style>
</head>
<body>

<script>
const DEFAULT_CONFIG={eventTitle:"Finals",eventCount:"Day 1",ticker:"From the drop to the last one standing show!",countdownText:"00:41",nextLabel:"Be Right Back In",accentColor:"#28bd54",panelColor:"#041a14",sideDesign:"green",sideImageUrl:"",highlightUrl:"",highlightType:"auto",highlightTitle:"MATCH HIGHLIGHTS",highlightSub:"PMAF live highlights and daily roadmap",maps:[{name:"ERANGEL",sub:"MATCH 1",matchIndex:0,bg:"linear-gradient(135deg,#325331,#c9d7a6)",imageUrl:""},{name:"MIRAMAR",sub:"MATCH 2",matchIndex:1,bg:"linear-gradient(135deg,#9d7a48,#e2bc75)",imageUrl:""},{name:"RONDO",sub:"MATCH 3",matchIndex:2,bg:"linear-gradient(135deg,#53625d,#c8c0a9)",imageUrl:""},{name:"MIRAMAR",sub:"MATCH 4",matchIndex:3,bg:"linear-gradient(135deg,#9d7a48,#e2bc75)",imageUrl:""},{name:"ERANGEL",sub:"MATCH 5",matchIndex:4,bg:"linear-gradient(135deg,#53625d,#c8c0a9)",imageUrl:""}]};
const FB_CONFIG={apiKey:"AIzaSyD-RFu-40Igcoqhm8QBbu_PgdFxV6aUIQA",authDomain:"pubg-mobile-afghanistan.firebaseapp.com",databaseURL:"https://pubg-mobile-afghanistan-default-rtdb.europe-west1.firebasedatabase.app",projectId:"pubg-mobile-afghanistan",storageBucket:"pubg-mobile-afghanistan.firebasestorage.app",messagingSenderId:"279105805502",appId:"1:279105805502:web:8def653069d0b3d73bd2ef"};
if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);
const db=firebase.database();
const qs=new URLSearchParams(location.search);
const MODE=(qs.get("mode")||"event").toLowerCase()==="scrim"?"scrim":"event";
const EVENT_ID=qs.get("event")||localStorage.getItem("pmac_active_event")||"default";
function eventBasePath(){return EVENT_ID==="default"?"pmac":"pmac/events/"+EVENT_ID;}
function configPath(){return MODE==="scrim"?eventBasePath()+"/scrim/event/roadmap":eventBasePath()+"/event/roadmap";}
let cfg=DEFAULT_CONFIG,teams=[],sideTeams=[],scores={},teamsRef=null,scoresRef=null,regsRef=null,overlaySettingsRef=null,countdownTimer=null,countdownRemaining=0,countdownSource="";
function sanitizeKey(n){return String(n||"").replace(/[\.\#\$\/\[\]]/g,"_");}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function cssBg(v){v=String(v||"");if(!v)return"linear-gradient(135deg,#53625d,#c8c0a9)";if(/^https?:|^data:|^file:/i.test(v))return`url('${v.replace(/'/g,"%27")}')`;return v;}
function safeRoadmapFallbackBg(m,img){const bg=String((m&&m.bg)||"").trim();if(img&&(/^https?:|^data:|^file:/i.test(bg)||/^url\(/i.test(bg)))return"linear-gradient(135deg,#53625d,#c8c0a9)";return bg||"linear-gradient(135deg,#53625d,#c8c0a9)";}
function mapImgUrl(m){let v=String((m&&m.imageUrl)||"").trim();if(!v&&m&&/^url\(/i.test(String(m.bg||"")))v=String(m.bg).replace(/^url\((['"]?)(.*?)\1\)$/i,"$2");if(/^https?:|^data:/i.test(v))return v;if(/^file:/i.test(v)){setStatus("Map image is local file and will not load for remote streamer","err");return"";}return"";}
function mediaUrl(){return String(cfg.highlightUrl||"").trim();}
function mediaIsVideo(u){return /\.(mp4|webm|ogg)(\?|#|$)/i.test(u);}
function mediaIsFrame(u){return /youtube\.com|youtu\.be|twitch\.tv|kick\.com/i.test(u);}
function teamLabel(t){return String((t&&(t.tag||t.teamTag||t.shortName||t.name||t.teamName))||"").trim();}
function teamName(t){return String((t&&(t.name||t.teamName||t.tag||t.teamTag))||"").trim();}
function teamLogo(t){return String((t&&(t.logo||t.logoUrl||t.teamLogo))||"").trim();}
function setStatus(t,c){const el=document.getElementById("status");if(el){el.textContent=t;el.className="status "+(c||"");}}
function hexToRgb(hex){const h=String(hex||"").replace("#","").trim();const x=h.length===3?h.split("").map(c=>c+c).join(""):h;if(!/^[0-9a-f]{6}$/i.test(x))return[40,189,84];return[parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)];}
function applyTheme(){const accent=String(cfg.accentColor||cfg.roadmapColor||cfg.color||cfg.accent||"#28bd54").trim()||"#28bd54";const panel=String(cfg.panelColor||"#041a14").trim()||"#041a14";document.documentElement.style.setProperty("--accent",accent);document.documentElement.style.setProperty("--accent-soft",`rgba(${hexToRgb(accent).join(",")},.22)`);document.documentElement.style.setProperty("--panel-rgb",hexToRgb(panel).join(","));}
function applyConfig(){applyTheme();document.getElementById("event-title").textContent=cfg.eventTitle||DEFAULT_CONFIG.eventTitle;document.getElementById("event-count").textContent=cfg.eventCount||DEFAULT_CONFIG.eventCount;document.getElementById("next-label").textContent=cfg.nextLabel||DEFAULT_CONFIG.nextLabel;document.getElementById("hero-title").textContent=cfg.highlightTitle||DEFAULT_CONFIG.highlightTitle;document.getElementById("hero-sub").textContent=cfg.highlightSub||DEFAULT_CONFIG.highlightSub;startCountdown(cfg.countdownText||DEFAULT_CONFIG.countdownText);renderSideLogo();renderHero();renderSideTeams();renderRoadmap();}
function renderSideLogo(){const wrap=document.getElementById("side-logo-wrap");const u=String(cfg.sideImageUrl||"").trim();if(!wrap)return;if(u)wrap.innerHTML=`<img class="side-logo" src="${esc(u)}" onerror="this.outerHTML='<div class=&quot;side-logo-text&quot;>${esc(cfg.eventTitle||"PMAF")}</div>'">`;else wrap.innerHTML=`<div class="side-logo-text">${esc(cfg.eventTitle||"PMAF")}</div>`;}
function parseCountdown(v){v=String(v||"").trim();if(!v)return 0;if(/^\d+$/.test(v))return parseInt(v,10);const parts=v.split(":").map(n=>parseInt(n,10)||0);if(parts.length===2)return parts[0]*60+parts[1];if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];return 0;}
function formatCountdown(sec){sec=Math.max(0,parseInt(sec,10)||0);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;if(h>0)return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
function startCountdown(value){const el=document.getElementById("countdown");const source=String(value||"").trim();if(source===countdownSource&&countdownTimer)return;countdownSource=source;if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null;}countdownRemaining=parseCountdown(source);if(el)el.textContent=formatCountdown(countdownRemaining);countdownTimer=setInterval(()=>{countdownRemaining=Math.max(0,countdownRemaining-1);if(el)el.textContent=formatCountdown(countdownRemaining);if(countdownRemaining<=0){clearInterval(countdownTimer);countdownTimer=null;}},1000);}
function resetCountdown(){countdownSource="";startCountdown(cfg.countdownText||DEFAULT_CONFIG.countdownText);}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)resetCountdown();});
window.addEventListener("focus",resetCountdown);
window.addEventListener("pageshow",resetCountdown);
function renderHero(){const h=document.getElementById("hero");if(!h)return;h.querySelectorAll(".hero-media").forEach(el=>el.remove());const u=mediaUrl();const ph=document.getElementById("hero-placeholder");if(!u){if(ph)ph.style.display="flex";return;}if(ph)ph.style.display="none";let node;if(mediaIsVideo(u)){node=document.createElement("video");node.className="hero-media";node.src=u;node.autoplay=true;node.loop=true;node.muted=true;node.playsInline=true;}else if(mediaIsFrame(u)){node=document.createElement("iframe");node.className="hero-media";node.src=u;node.allow="autoplay; fullscreen";}else{node=document.createElement("img");node.className="hero-media";node.src=u;}node.onerror=()=>{node.remove();if(ph)ph.style.display="flex";setStatus("Highlight media blocked or missing","err");};h.prepend(node);}
function renderSideTeams(){const wrap=document.getElementById("side-teams");if(!wrap)return;const source=(teams&&teams.length?teams:sideTeams).filter(Boolean).slice(0,16);const pages=[source.slice(0,8),source.slice(8,16)].filter(p=>p.length);const displayPages=pages.length>1?pages.concat([pages[0]]):pages;function card(t){const logo=teamLogo(t);const label=teamLabel(t)||teamName(t)||"TEAM";return `<div class="side-team">${logo?`<img class="side-team-logo" src="${esc(logo)}" alt="${esc(label)}" onerror="this.classList.add('no-logo')">`:`<div></div>`}<div class="side-team-tag">${esc(label)}</div></div>`;}wrap.innerHTML=`<div class="side-team-track ${pages.length>1?"has-pages":""}">${displayPages.map(p=>`<div class="side-team-page">${p.map(card).join("")}</div>`).join("")}</div>`;}
function scoreRowsForTeam(t){const keys=[t&&t.name,t&&t.teamName,t&&t.tag,t&&t.teamTag,teamLabel(t)].map(sanitizeKey).filter(Boolean);for(const k of keys){if(scores&&scores[k])return Array.isArray(scores[k])?scores[k]:Object.values(scores[k]);}return[];}
function winnerForMatch(matchIndex){let best=null;teams.forEach(t=>{const rows=scoreRowsForTeam(t);const m=rows[matchIndex]||null;if(m&&parseInt(m.rank)===1){const kills=parseInt(m.kills)||0;if(!best||kills>best.kills)best={team:t,kills};}});if(!best&&scores)Object.keys(scores).forEach(k=>{const rows=Array.isArray(scores[k])?scores[k]:Object.values(scores[k]||{});const m=rows[matchIndex]||null;if(m&&parseInt(m.rank)===1){const kills=parseInt(m.kills)||0;const label=k.replace(/_/g," ");if(!best||kills>best.kills)best={team:{name:label,tag:label},kills};}});return best;}
function renderRoadmap(){const wrap=document.getElementById("roadmap");if(!wrap)return;const maps=(cfg.maps&&cfg.maps.length?cfg.maps:DEFAULT_CONFIG.maps).slice(0,5);wrap.innerHTML=maps.map((m,i)=>{const win=winnerForMatch(parseInt(m.matchIndex)||0);const img=mapImgUrl(m);const bg=cssBg(safeRoadmapFallbackBg(m,img));const label=win?teamLabel(win.team)||teamName(win.team):"";const logo=win?teamLogo(win.team):"";const status=win?"WINNER":String(m.status||m.phase||"SCHEDULED").toUpperCase();const time=String(m.time||m.startTime||m.scheduleTime||"").trim();return `<div class="map-card" style="--map-bg:${bg}"><div class="map-label">${esc(m.sub||("MATCH "+(i+1)))}</div><div class="map-body">${img?`<img class="map-bg-img" src="${esc(img)}" onerror="this.remove();mapImgError('${esc(m.name)}')">`:``}<div class="map-info">${win?(logo?`<img class="winner-logo" src="${esc(logo)}" onerror="this.remove()">`:``):``}<div class="${win?"winner-small":"map-status"}">${esc(status)}</div>${win?`<div class="winner-name">${esc(label)}</div>`:`<div class="map-time">${esc(time||"")}</div>`}<div class="map-name">${esc(m.name||"")}</div></div></div></div>`;}).join("");}
function mapImgError(name){setStatus("Map image blocked or not public: "+(name||"map"),"err");}
function activeSessions(a){if(!a)return[];if(Array.isArray(a.sessions))return a.sessions.filter(s=>s&&s.group&&s.date);if(a.group&&a.date)return[{group:a.group,date:a.date}];return[];}
function attachRefs(base){if(teamsRef)teamsRef.off();if(scoresRef)scoresRef.off();teamsRef=db.ref(base?base+"/teams":eventBasePath()+"/teams");scoresRef=db.ref(base?base+"/scores":eventBasePath()+"/matches");teamsRef.on("value",s=>{const v=s.val();teams=v?(Array.isArray(v)?v:Object.values(v)):[];renderSideTeams();renderRoadmap();setStatus((MODE==="scrim"?"Scrim":"Event")+" highlights live","ok");},e=>setStatus(e.message,"err"));scoresRef.on("value",s=>{scores=s.val()||{};renderRoadmap();},e=>setStatus(e.message,"err"));}
function attachMultiRefs(sessions){if(teamsRef)teamsRef.off();if(scoresRef)scoresRef.off();const teamRefs=[],scoreRefs=[],teamBuckets={},scoreBuckets={};function combine(){const combinedTeams=[],combinedScores={};sessions.forEach(a=>{const k=a.group+"|"+a.date;(teamBuckets[k]||[]).forEach(t=>{const tk=sanitizeKey(t&&t.name||t&&t.teamName||teamLabel(t));if(!combinedTeams.find(x=>sanitizeKey(x&&x.name||x&&x.teamName||teamLabel(x))===tk))combinedTeams.push(t);});Object.assign(combinedScores,scoreBuckets[k]||{});});teams=combinedTeams;scores=combinedScores;renderSideTeams();renderRoadmap();setStatus(sessions.length+" active groups highlights live","ok");}sessions.forEach(a=>{const k=a.group+"|"+a.date,base=eventBasePath()+`/eventGroups/${a.group}/sessions/${a.date}`;const tr=db.ref(base+"/teams"),sr=db.ref(base+"/scores");teamRefs.push(tr);scoreRefs.push(sr);tr.on("value",s=>{const v=s.val();teamBuckets[k]=v?(Array.isArray(v)?v:Object.values(v)):[];combine();},e=>setStatus(e.message,"err"));sr.on("value",s=>{scoreBuckets[k]=s.val()||{};combine();},e=>setStatus(e.message,"err"));});teamsRef={off:function(){teamRefs.forEach(r=>r.off());}};scoresRef={off:function(){scoreRefs.forEach(r=>r.off());}};}
function watchActiveSession(){db.ref(eventBasePath()+"/activeSession").on("value",s=>{const sessions=activeSessions(s.val());if(sessions.length>1)attachMultiRefs(sessions);else if(sessions.length===1)attachRefs(eventBasePath()+`/eventGroups/${sessions[0].group}/sessions/${sessions[0].date}`);else attachRefs(null);},e=>{setStatus(e.message,"err");attachRefs(null);});}
function watchRegisteredTeamLogos(){if(regsRef)regsRef.off();const path=MODE==="scrim"?eventBasePath()+"/scrim/registrations":eventBasePath()+"/registrations";regsRef=db.ref(path);regsRef.on("value",s=>{const v=s.val()||{};sideTeams=Object.values(v).filter(t=>t&&(t.logo||t.logoUrl));renderSideTeams();},e=>setStatus(e.message,"err"));}
function watchOverlaySettings(){overlaySettingsRef=db.ref(eventBasePath()+"/overlaySettings");overlaySettingsRef.on("value",s=>{const v=s.val()||{};if(!cfg.accentColor&&(v.accent||v.top4Color)){cfg=Object.assign({},cfg,{accentColor:v.accent||v.top4Color});applyTheme();}},()=>{});}
db.ref(configPath()).on("value",s=>{cfg=Object.assign({},DEFAULT_CONFIG,s.val()||{});applyConfig();},e=>{setStatus(e.message,"err");applyConfig();});
watchActiveSession();
watchRegisteredTeamLogos();
watchOverlaySettings();
applyConfig();
</script>
