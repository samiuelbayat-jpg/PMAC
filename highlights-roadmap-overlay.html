<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1920px;height:1080px;min-width:1920px;min-height:1080px;max-width:1920px;max-height:1080px;overflow:hidden;background:transparent;font-family:'Barlow Condensed',Arial,sans-serif;color:#fff}.stage{position:fixed;left:0;top:0;width:1920px;height:1080px;background:transparent;border:3px solid #d40d15;overflow:hidden;transform-origin:top left}.topbar{display:none}.side{position:absolute;left:0;top:0;width:380px;height:860px;background:linear-gradient(145deg,#ff1d1d,#9b0007 55%,#e11117);overflow:hidden;border-right:2px solid rgba(255,255,255,.14);z-index:10;background-size:cover;background-position:center;background-repeat:no-repeat}.side:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(220,0,10,.30),rgba(90,0,4,.46)),radial-gradient(circle at 30% 20%,rgba(255,255,255,.18),transparent 20%),radial-gradient(circle at 70% 70%,rgba(0,0,0,.22),transparent 30%);opacity:.95}.side:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 12px,transparent 12px 44px);mix-blend-mode:screen}.brand,.brand-row,.brand-mark,.road{display:none}.finals{position:relative;z-index:2;margin:48px 32px 0;text-align:center}.finals h1{display:none}.finals .count{font-size:34px;font-weight:900;margin-top:8px}.supported{display:none}.charts{position:relative;z-index:2;margin:185px 32px 0;text-align:center}.charts-image{display:none}.charts.has-image .charts-logo,.charts.has-image .charts-title,.charts.has-image .charts-sub{display:none}.side-teams{position:absolute;left:28px;right:28px;top:42px;z-index:3;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:center;justify-items:center}.side-team-logo{width:72px;height:72px;border-radius:10px;object-fit:contain;background:rgba(0,0,0,.48);padding:6px;box-shadow:0 8px 20px rgba(0,0,0,.45)}.side-team-logo.no-logo{display:none}.charts-logo,.charts-title,.charts-sub{display:none}.hero{position:absolute;left:380px;top:0;right:0;height:792px;background:transparent;overflow:hidden}.hero-media,.hero iframe,.hero video,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}.hero-placeholder{display:none}.hero:after{display:none}.hero-text{display:none}.hero-title{font-size:62px;font-weight:900;line-height:.86;color:#fff}.hero-sub{font-family:'Share Tech Mono',monospace;font-size:18px;line-height:1.35;color:#ffdf7a;margin-top:10px;white-space:pre-line}.pubg-badge{display:none}.pubg-badge span{display:none}.ticker{position:absolute;left:380px;right:0;top:792px;height:68px;background:#030303;border-top:3px solid #151515;border-bottom:3px solid #d40d15;display:flex;align-items:center;justify-content:center;z-index:10}.ticker-text{font-size:34px;font-weight:900;text-transform:uppercase;letter-spacing:.035em;text-shadow:0 3px 8px #000}.bottom{position:absolute;left:0;right:0;bottom:0;height:220px;background:#f4f4f4;display:grid;grid-template-columns:380px repeat(6,1fr);z-index:20}.timer{position:relative;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:2px solid rgba(0,0,0,.08);overflow:hidden}.timer:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 40% 50%,rgba(212,13,21,.08),transparent 48%)}.time{position:relative;font-family:'Barlow Condensed',Arial,sans-serif;font-size:78px;font-weight:900;color:#cf1019;line-height:.9;letter-spacing:.02em}.next{position:relative;font-size:28px;font-weight:900;color:#cf1019;text-transform:uppercase}.map-card{position:relative;background:#070707;border-right:2px solid rgba(0,0,0,.28);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.map-card:before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(0,0,0,.46),rgba(0,0,0,.28) 38%,rgba(0,0,0,.74)),var(--map-bg);background-size:cover;background-position:center;filter:saturate(1.08) contrast(1.08)}.map-bg-img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;filter:saturate(1.08) contrast(1.08)}.map-card:after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(0deg,rgba(0,0,0,.28),transparent 45%);pointer-events:none}.map-card.done:after{content:"";display:none}.map-head{position:relative;z-index:3;margin-top:12px;text-align:center;text-transform:uppercase;color:#fff;text-shadow:0 4px 12px #000,0 2px 0 #000}.map-name{font-size:46px;font-weight:900;line-height:.82}.match-num{font-size:24px;font-weight:900;line-height:.95;color:#ffcf55}.map-img{display:none}.winner{position:absolute;z-index:5;left:0;right:0;bottom:18px;min-height:95px;background:transparent;border:0;display:none;align-items:center;justify-content:center;padding:0;box-shadow:none}.done .winner{display:flex}.winner-logo{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#111;border:0;box-shadow:0 8px 24px rgba(0,0,0,.65)}.winner-fallback{min-width:92px;min-height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font-size:32px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.65);padding:8px;text-align:center;text-transform:uppercase}.winner-info,.winner-small,.winner-name,.winner-kills{display:none}.status{position:absolute;right:18px;top:18px;z-index:40;font-family:'Share Tech Mono',monospace;font-size:11px;color:#777}.status.ok{color:#42ff88}.status.err{color:#ff5757}.hidden{display:none!important}
</style>

<body>
<div class="stage">
  
  <div class="side"><div class="finals"><h1 id="event-title" style="display:none"></h1><div class="count" id="event-count">1/12</div></div><div class="charts" id="side-picture"></div><div class="side-teams" id="side-teams"></div></div>
  <div class="hero" id="hero"><div class="hero-placeholder">Highlights Screen</div><div class="hero-text"><div class="hero-title" id="hero-title"></div><div class="hero-sub" id="hero-sub"></div></div></div>
  
  <div class="ticker"><div class="ticker-text" id="ticker-text">From the drop to the last one standing show!</div></div>
  <div class="bottom"><div class="timer"><div class="time" id="countdown">04:00</div><div class="next" id="next-label">Next Match</div></div><div id="roadmap" style="display:contents"></div></div>
  <div class="status" id="status">Connecting...</div>
</div>
<script>
const DEFAULT_CONFIG={eventTitle:"Grand Finals",eventCount:"1/12",ticker:"From the drop to the last one standing show!",countdownText:"04:00",nextLabel:"Next Match",sideImageUrl:"",highlightUrl:"",highlightType:"auto",highlightTitle:"MATCH HIGHLIGHTS",highlightSub:"PMAF live highlights and daily roadmap",maps:[{name:"RONDO",sub:"MATCH 1",matchIndex:0,bg:"linear-gradient(135deg,#325331,#c9d7a6)",imageUrl:""},{name:"ERANGEL",sub:"MATCH 2",matchIndex:1,bg:"linear-gradient(135deg,#53625d,#c8c0a9)",imageUrl:""},{name:"ERANGEL",sub:"MATCH 3",matchIndex:2,bg:"linear-gradient(135deg,#53625d,#c8c0a9)",imageUrl:""},{name:"ERANGEL",sub:"MATCH 4",matchIndex:3,bg:"linear-gradient(135deg,#53625d,#c8c0a9)",imageUrl:""},{name:"MIRAMAR",sub:"MATCH 5",matchIndex:4,bg:"linear-gradient(135deg,#9d7a48,#e2bc75)",imageUrl:""},{name:"MIRAMAR",sub:"MATCH 6",matchIndex:5,bg:"linear-gradient(135deg,#9d7a48,#e2bc75)",imageUrl:""}]};
const FB_CONFIG={apiKey:"AIzaSyD-RFu-40Igcoqhm8QBbu_PgdFxV6aUIQA",authDomain:"pubg-mobile-afghanistan.firebaseapp.com",databaseURL:"https://pubg-mobile-afghanistan-default-rtdb.europe-west1.firebasedatabase.app",projectId:"pubg-mobile-afghanistan",storageBucket:"pubg-mobile-afghanistan.firebasestorage.app",messagingSenderId:"279105805502",appId:"1:279105805502:web:8def653069d0b3d73bd2ef"};
if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);const db=firebase.database();
const qs=new URLSearchParams(location.search);const MODE=(qs.get('mode')||'event').toLowerCase()==='scrim'?'scrim':'event';const EVENT_ID=qs.get('event')||localStorage.getItem('pmac_active_event')||'default';function eventBasePath(){return EVENT_ID==='default'?'pmac':'pmac/events/'+EVENT_ID;}function configPath(){return MODE==='scrim'?eventBasePath()+'/scrim/event/roadmap':eventBasePath()+'/event/roadmap';}
let cfg=DEFAULT_CONFIG,teams=[],sideTeams=[],scores={},teamsRef=null,scoresRef=null,regsRef=null,countdownTimer=null,countdownRemaining=0,countdownSource="";
function sanitizeKey(n){return String(n||"").replace(/[\.\#\$\/\[\]]/g,"_");}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}function cssBg(v){v=String(v||"");if(!v)return"linear-gradient(135deg,#53625d,#c8c0a9)";if(/^https?:|^data:|^file:/i.test(v))return`url('${v.replace(/'/g,'%27')}')`;return v;}function mapImgUrl(m){let v=String((m&&m.imageUrl)||"").trim();if(!v&&m&&/^url\(/i.test(String(m.bg||""))){v=String(m.bg).replace(/^url\((['"]?)(.*?)\1\)$/i,"$2");}if(/^https?:|^data:/i.test(v))return v;if(/^file:/i.test(v)){setStatus("Map image is local file and will not load for remote streamer","err");return"";}return"";}function mapImgError(name){setStatus("Map image blocked or not public: "+(name||"map"),"err");}function setStatus(t,c){const el=document.getElementById('status');el.textContent=t;el.className='status '+(c||'');}
function applyConfig(){document.getElementById('event-title').textContent=cfg.eventTitle||DEFAULT_CONFIG.eventTitle;document.getElementById('event-count').textContent=cfg.eventCount||'';document.getElementById('ticker-text').textContent=cfg.ticker||'';startCountdown(cfg.countdownText||'');document.getElementById('next-label').textContent=cfg.nextLabel||'Next Match';document.getElementById('hero-title').textContent=cfg.highlightTitle||'';document.getElementById('hero-sub').textContent=cfg.highlightSub||'';renderHero();renderSidePicture();renderSideTeams();renderRoadmap();}
function parseCountdown(v){v=String(v||"").trim();if(!v)return 0;if(/^\d+$/.test(v))return parseInt(v,10);const parts=v.split(":").map(n=>parseInt(n,10)||0);if(parts.length===2)return parts[0]*60+parts[1];if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];return 0;}function formatCountdown(sec){sec=Math.max(0,parseInt(sec,10)||0);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;if(h>0)return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}function startCountdown(value){const el=document.getElementById("countdown");const source=String(value||"").trim();if(source===countdownSource&&countdownTimer)return;countdownSource=source;if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null;}countdownRemaining=parseCountdown(source);if(el)el.textContent=formatCountdown(countdownRemaining);countdownTimer=setInterval(()=>{countdownRemaining=Math.max(0,countdownRemaining-1);if(el)el.textContent=formatCountdown(countdownRemaining);if(countdownRemaining<=0){clearInterval(countdownTimer);countdownTimer=null;}},1000);}function renderSidePicture(){const box=document.getElementById("side-picture");const side=document.querySelector(".side");if(!box||!side)return;const u=(cfg.sideImageUrl||"").trim();if(!u){box.classList.remove("has-image");side.style.backgroundImage="linear-gradient(145deg,#ff1d1d,#9b0007 55%,#e11117)";return;}box.classList.add("has-image");side.style.backgroundImage=`url('${u.replace(/'/g,'%27')}')`;}
function resetCountdown(){countdownSource="";startCountdown(cfg.countdownText||"");}document.addEventListener("visibilitychange",()=>{if(!document.hidden)resetCountdown();});window.addEventListener("focus",resetCountdown);window.addEventListener("pageshow",resetCountdown);function renderHero(){const h=document.getElementById('hero');if(!h)return;const old=h.querySelector('.hero-media');if(old)old.remove();const ph=h.querySelector('.hero-placeholder');if(ph)ph.style.display='none';}
function renderSideTeams(){const wrap=document.getElementById("side-teams");if(!wrap)return;const source=(sideTeams&&sideTeams.length)?sideTeams:teams;const list=(source||[]).filter(t=>t&&t.logo).slice(0,18);wrap.innerHTML=list.map(t=>`<img class="side-team-logo" src="${esc(t.logo)}" alt="${esc(t.name||"Team")}" onerror="this.classList.add(\"no-logo\")">`).join("");}function teamLabel(t){return String((t&&(t.tag||t.name))||"").trim();}function scoreRowsForTeam(t){const keys=[t&&t.name,t&&t.tag,teamLabel(t)].map(sanitizeKey).filter(Boolean);for(const k of keys){if(scores&&scores[k])return Array.isArray(scores[k])?scores[k]:Object.values(scores[k]);}return [];}function winnerForMatch(matchIndex){let best=null;teams.forEach(t=>{const rows=scoreRowsForTeam(t);const m=rows[matchIndex]||null;if(m&&parseInt(m.rank)===1){const kills=parseInt(m.kills)||0;if(!best||kills>best.kills)best={team:t,kills};}});if(!best&&scores)Object.keys(scores).forEach(k=>{const rows=Array.isArray(scores[k])?scores[k]:Object.values(scores[k]||{});const m=rows[matchIndex]||null;if(m&&parseInt(m.rank)===1){const kills=parseInt(m.kills)||0;const label=k.replace(/_/g," ");if(!best||kills>best.kills)best={team:{name:label,tag:label},kills};}});return best;}
function renderRoadmap(){const wrap=document.getElementById('roadmap');const maps=(cfg.maps&&cfg.maps.length?cfg.maps:DEFAULT_CONFIG.maps).slice(0,6);wrap.innerHTML=maps.map((m,i)=>{const win=winnerForMatch(parseInt(m.matchIndex)||0);const img=mapImgUrl(m);const bg=cssBg(img?m.bg:(m.imageUrl||m.bg));const logo=win&&win.team.logo;const label=win?teamLabel(win.team):'';return `<div class="map-card ${win?'done':''}" style="--map-bg:${bg}">${img?`<img class="map-bg-img" src="${esc(img)}" onerror="this.remove();mapImgError('${esc(m.name)}')">`:``}<div class="map-head"><div class="map-name">${esc(m.name)}</div><div class="match-num">${esc(m.sub||('MATCH '+(i+1)))}</div></div><div class="map-img"></div><div class="winner">${logo?`<img class="winner-logo" src="${esc(logo)}" onerror="this.outerHTML='<div class=&quot;winner-fallback&quot;>${esc(label)}</div>'">`:`<div class="winner-fallback">${esc(label)}</div>`}<div class="winner-info"><div class="winner-small">CHICKEN DINNER</div><div class="winner-name">${esc(win?win.team.name:'')}</div><div class="winner-kills">${win?win.kills:0} KILLS · MAP WINNER</div></div></div></div>`;}).join('');}
function activeSessions(a){if(!a)return[];if(Array.isArray(a.sessions))return a.sessions.filter(s=>s&&s.group&&s.date);if(a.group&&a.date)return[{group:a.group,date:a.date}];return[];}function attachRefs(base){if(teamsRef)teamsRef.off();if(scoresRef)scoresRef.off();teamsRef=db.ref(base?base+'/teams':eventBasePath()+'/teams');scoresRef=db.ref(base?base+'/scores':eventBasePath()+'/matches');teamsRef.on('value',s=>{const v=s.val();teams=v?(Array.isArray(v)?v:Object.values(v)):[];renderSideTeams();renderRoadmap();setStatus((MODE==='scrim'?'Scrim':'Event')+' roadmap live','ok');},e=>setStatus(e.message,'err'));scoresRef.on('value',s=>{scores=s.val()||{};renderRoadmap();},e=>setStatus(e.message,'err'));}
function attachMultiRefs(sessions){if(teamsRef)teamsRef.off();if(scoresRef)scoresRef.off();const teamRefs=[],scoreRefs=[],teamBuckets={},scoreBuckets={};function combine(){const combinedTeams=[],combinedScores={};sessions.forEach(a=>{const k=a.group+"|"+a.date;(teamBuckets[k]||[]).forEach(t=>{const tk=sanitizeKey(t&&t.name||teamLabel(t));if(!combinedTeams.find(x=>sanitizeKey(x&&x.name||teamLabel(x))===tk))combinedTeams.push(t);});Object.assign(combinedScores,scoreBuckets[k]||{});});teams=combinedTeams;scores=combinedScores;renderSideTeams();renderRoadmap();setStatus(sessions.length+' active groups roadmap live','ok');}sessions.forEach(a=>{const k=a.group+"|"+a.date,base=eventBasePath()+`/eventGroups/${a.group}/sessions/${a.date}`;const tr=db.ref(base+'/teams'),sr=db.ref(base+'/scores');teamRefs.push(tr);scoreRefs.push(sr);tr.on('value',s=>{const v=s.val();teamBuckets[k]=v?(Array.isArray(v)?v:Object.values(v)):[];combine();},e=>setStatus(e.message,'err'));sr.on('value',s=>{scoreBuckets[k]=s.val()||{};combine();},e=>setStatus(e.message,'err'));});teamsRef={off:function(){teamRefs.forEach(r=>r.off());}};scoresRef={off:function(){scoreRefs.forEach(r=>r.off());}};}
function watchActiveSession(){db.ref(eventBasePath()+'/activeSession').on('value',s=>{const sessions=activeSessions(s.val());if(sessions.length>1)attachMultiRefs(sessions);else if(sessions.length===1)attachRefs(eventBasePath()+`/eventGroups/${sessions[0].group}/sessions/${sessions[0].date}`);else attachRefs(null);},e=>{setStatus(e.message,'err');attachRefs(null);});}function watchRegisteredTeamLogos(){if(regsRef)regsRef.off();const path=MODE==='scrim'?eventBasePath()+'/scrim/registrations':eventBasePath()+'/registrations';regsRef=db.ref(path);regsRef.on('value',s=>{const v=s.val()||{};sideTeams=Object.values(v).filter(t=>t&&t.logo);renderSideTeams();},e=>setStatus(e.message,'err'));}
db.ref(configPath()).on('value',s=>{cfg=Object.assign({},DEFAULT_CONFIG,s.val()||{});applyConfig();},e=>{setStatus(e.message,'err');applyConfig();});watchActiveSession();watchRegisteredTeamLogos();applyConfig();
</script>
