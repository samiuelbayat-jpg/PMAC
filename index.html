<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PUBG Mobile Afghanistan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:   #f5c400;
      --dark:   #03050d;
      --panel:  rgba(3,5,18,0.85);
      --border: rgba(245,196,0,0.2);
      --muted:  #45536a;
    }

    html, body {
      height: 100%;
      font-family: 'Rajdhani', sans-serif;
      background: var(--dark);
      color: #dde4f0;
      overflow: hidden;
    }

    /* ── canvas ── */
    #bg { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; }
    .scanlines {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 3px);
    }

    /* ── centered layout ── */
    .screen {
      position: relative; z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ── title above card ── */
    .brand {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeDown .6s ease both;
    }
    .brand-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(1.8rem, 4.5vw, 2.8rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 6px;
      color: #fff;
      text-shadow: 0 0 40px rgba(245,196,0,.4);
    }
    .brand-title em { font-style: normal; color: var(--gold); }
    .brand-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 5px;
    }

    /* ── login card ── */
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 2.2rem 2rem;
      position: relative;
      animation: fadeUp .6s ease .1s both;
    }
    /* corner brackets */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      border-color: var(--gold);
      border-style: solid;
    }
    .card::before { top: -1px; left: -1px;   border-width: 2px 0 0 2px; }
    .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .card-heading {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.6rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-heading::before {
      content: '';
      width: 22px; height: 2px;
      background: var(--gold);
      flex-shrink: 0;
    }

    /* ── fields ── */
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 1.1rem; }
    .field label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px; font-weight: 700;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--muted);
    }
    .field input {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px; font-weight: 600;
      padding: 11px 13px;
      outline: none;
      transition: border-color .18s, background .18s;
    }
    .field input:focus {
      border-color: var(--gold);
      background: rgba(245,196,0,.04);
    }
    .field input::placeholder { color: var(--muted); font-weight: 500; font-size: 13px; }

    /* ── error ── */
    #err {
      display: none;
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px; font-weight: 600;
      background: rgba(220,50,50,.1);
      border: 1px solid rgba(220,50,50,.3);
      color: #ff6b6b;
      padding: 9px 13px;
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    /* ── button ── */
    #login-btn {
      width: 100%;
      background: var(--gold);
      border: none;
      color: #060810;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px; font-weight: 900;
      letter-spacing: 4px; text-transform: uppercase;
      padding: 13px;
      cursor: pointer;
      margin-top: .4rem;
      transition: background .18s, transform .1s;
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    }
    #login-btn:hover    { background: #ffe066; }
    #login-btn:active   { transform: scale(.98); }
    #login-btn:disabled { background: #1e2230; color: #3a4255; cursor: not-allowed; }

    @keyframes fadeUp   { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }
    @keyframes fadeDown { from { opacity:0; transform:translateY(-14px); } to { opacity:1; transform:none; } }

    @media (max-width: 420px) { .card { padding: 1.7rem 1.3rem; } }
  </style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="scanlines"></div>

<div class="screen">

  <div class="brand">
    <div class="brand-title">PUBG <em>Mobile</em> Afghanistan</div>
    <div class="brand-sub">Official Tournament Platform</div>
  </div>

  <div class="card">
    <div class="card-heading">Admin Access</div>

    <div id="err"></div>

    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@example.com" autocomplete="email" required/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required/>
      </div>
      <button type="submit" id="login-btn">Sign In</button>
    </form>
  </div>

</div>

<!-- ══ FIREBASE AUTH ══ -->
<script type="module">
  import { initializeApp }                from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword,
           signOut }           from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyD-RFu-40Igcoqhm8QBbu_PgdFxV6aUIQA",
    authDomain:        "pubg-mobile-afghanistan.firebaseapp.com",
    databaseURL:       "https://pubg-mobile-afghanistan-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "pubg-mobile-afghanistan",
    storageBucket:     "pubg-mobile-afghanistan.firebasestorage.app",
    messagingSenderId: "279105805502",
    appId:             "1:279105805502:web:8def653069d0b3d73bd2ef"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const errEl = document.getElementById("err");
  const btn   = document.getElementById("login-btn");

  function showErr(msg) { errEl.textContent = msg; errEl.style.display = "block"; }
  function clearErr()   { errEl.style.display = "none"; }

  document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();
    clearErr();
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) { showErr("Please enter your email and password."); return; }

    btn.disabled    = true;
    btn.textContent = "Signing in…";

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "admin.html";
    } catch (err) {
      const msgs = {
        "auth/user-not-found":    "No account found with that email.",
        "auth/wrong-password":    "Incorrect password.",
        "auth/invalid-email":     "Please enter a valid email address.",
        "auth/too-many-requests": "Too many failed attempts. Try again later.",
        "auth/invalid-credential":"Invalid email or password.",
      };
      showErr(msgs[err.code] || "Sign in failed. Please try again.");
      btn.disabled    = false;
      btn.textContent = "Sign In";
    }
  });

  // Always sign out when landing on index so the login form always shows
  signOut(auth).catch(() => {});
</script>

<!-- ══ GAMING BACKGROUND ══ -->
<script>
(function () {
  const cv = document.getElementById('bg');
  const cx = cv.getContext('2d');
  let W, H, t = 0;

  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  addEventListener('resize', resize);
  W = cv.width = innerWidth; H = cv.height = innerHeight;

  /* ══════════════════════════════════════════════
     AK-47 SILHOUETTE DRAW  (origin = left grip)
     scale: 1 unit ≈ 1px at s=1
  ══════════════════════════════════════════════ */
  function drawAK(x, y, s, alpha) {
    cx.save();
    cx.translate(x, y);
    cx.scale(s, s);
    cx.globalAlpha = alpha;

    const col = '#c8a855';       // gold-bronze
    const dark = '#7a5e1a';
    const wood = '#6b3a1f';
    const metal = '#3a3a3a';

    /* ── barrel ── */
    cx.fillStyle = metal;
    cx.fillRect(60, -4, 180, 8);          // main barrel tube
    cx.fillRect(220, -2, 18, 4);           // flash hider base
    // flash hider prongs
    cx.fillRect(236, -6, 4, 5);
    cx.fillRect(236,  2, 4, 5);
    cx.fillRect(242, -4, 4, 3);
    cx.fillRect(242,  2, 4, 3);

    /* ── gas tube above barrel ── */
    cx.fillStyle = metal;
    cx.fillRect(100, -10, 120, 4);

    /* ── receiver (main body) ── */
    cx.fillStyle = col;
    cx.beginPath();
    cx.rect(30, -14, 150, 28);
    cx.fill();
    // selector / detail lines
    cx.fillStyle = dark;
    cx.fillRect(120, -12, 2, 24);
    cx.fillRect(148, -8, 2, 16);
    // dust cover
    cx.fillStyle = '#b8962e';
    cx.fillRect(50, -12, 80, 6);

    /* ── pistol grip ── */
    cx.fillStyle = wood;
    cx.beginPath();
    cx.moveTo(55, 14); cx.lineTo(70, 14); cx.lineTo(75, 50); cx.lineTo(52, 50);
    cx.closePath(); cx.fill();
    // grip texture lines
    cx.strokeStyle = 'rgba(0,0,0,0.3)'; cx.lineWidth = 1;
    for (let i = 0; i < 5; i++) { cx.beginPath(); cx.moveTo(54+i*3, 16); cx.lineTo(57+i*3, 48); cx.stroke(); }

    /* ── trigger guard ── */
    cx.strokeStyle = metal; cx.lineWidth = 3; cx.fillStyle = 'transparent';
    cx.beginPath();
    cx.moveTo(55, 14); cx.quadraticCurveTo(45, 32, 55, 48); cx.lineTo(75, 50);
    cx.stroke();

    /* ── trigger ── */
    cx.strokeStyle = metal; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(62, 16); cx.lineTo(58, 38); cx.stroke();

    /* ── magazine (curved AK-style) ── */
    cx.fillStyle = metal;
    cx.beginPath();
    cx.moveTo(75, 14); cx.lineTo(105, 14);
    cx.quadraticCurveTo(112, 50, 108, 70);
    cx.lineTo(80, 70);
    cx.quadraticCurveTo(72, 50, 75, 14);
    cx.fill();
    // mag rib
    cx.fillStyle = '#555';
    cx.fillRect(88, 20, 4, 44);

    /* ── handguard (wood) ── */
    cx.fillStyle = wood;
    cx.beginPath();
    cx.rect(60, -18, 90, 8);
    cx.fill();
    cx.fillRect(60, 10, 90, 8);

    /* ── stock (folding style) ── */
    cx.strokeStyle = metal; cx.lineWidth = 5;
    cx.beginPath();
    cx.moveTo(30, -8); cx.lineTo(-40, -20); cx.stroke();
    cx.beginPath();
    cx.moveTo(30, 8);  cx.lineTo(-40,  20); cx.stroke();
    cx.beginPath();
    cx.moveTo(-40, -20); cx.lineTo(-40, 20); cx.stroke();

    /* ── front sight post ── */
    cx.fillStyle = metal;
    cx.fillRect(198, -18, 6, 14);
    cx.fillRect(196, -22, 10, 5);

    /* ── rear sight ── */
    cx.fillStyle = metal;
    cx.fillRect(148, -20, 12, 10);
    cx.fillRect(150, -26, 8, 8);

    cx.restore();
  }

  /* ══════════════════════════════════════════════
     FLOATING AK-47s (background silhouettes)
  ══════════════════════════════════════════════ */
  const guns = Array.from({ length: 4 }, (_, i) => ({
    x:     W * (0.1 + i * 0.26),
    y:     H * (0.15 + Math.random() * 0.6),
    vy:    0.08 + Math.random() * 0.08,
    phase: Math.random() * Math.PI * 2,
    s:     0.55 + Math.random() * 0.35,
    flip:  Math.random() > 0.5,
  }));

  function drawGuns() {
    guns.forEach(g => {
      g.y += g.vy;
      if (g.y > H + 80) { g.y = -80; g.x = W * (0.05 + Math.random() * 0.9); }
      const bob   = Math.sin(t * 0.001 + g.phase) * 6;
      const alpha = 0.06 + 0.04 * Math.abs(Math.sin(t * 0.0008 + g.phase));
      cx.save();
      if (g.flip) { cx.translate(g.x + g.s * 260, g.y + bob); cx.scale(-1, 1); drawAK(0, 0, g.s, alpha); }
      else          drawAK(g.x, g.y + bob, g.s, alpha);
      cx.restore();
    });
  }

  /* ══════════════════════════════════════════════
     FLYING BULLETS  (streaking left → right)
  ══════════════════════════════════════════════ */
  const bullets = [];
  let bTimer = 0;

  function spawnBullet() {
    const angle = (Math.random() - 0.5) * 0.18;   // slight spread
    const speed = 14 + Math.random() * 10;
    bullets.push({
      x:     -20,
      y:     H * (0.1 + Math.random() * 0.8),
      vx:    Math.cos(angle) * speed,
      vy:    Math.sin(angle) * speed,
      life:  1,
      len:   18 + Math.random() * 22,
    });
  }

  function drawBullets() {
    if (++bTimer > 8 + Math.floor(Math.random() * 12)) { spawnBullet(); bTimer = 0; }
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy;
      if (b.x > W + 40 || b.y < -20 || b.y > H + 20) { bullets.splice(i, 1); continue; }

      // tracer streak
      const g = cx.createLinearGradient(b.x, b.y, b.x - b.vx * b.len / b.vx, b.y - b.vy * b.len / b.vx);
      g.addColorStop(0,   `rgba(255,240,150,${b.life * 0.95})`);
      g.addColorStop(0.3, `rgba(255,180,50,${b.life * 0.6})`);
      g.addColorStop(1,   'rgba(255,100,0,0)');
      cx.beginPath();
      cx.moveTo(b.x, b.y);
      cx.lineTo(b.x - b.vx * (b.len / Math.max(Math.abs(b.vx), 1)),
                b.y - b.vy * (b.len / Math.max(Math.abs(b.vx), 1)));
      cx.strokeStyle = g;
      cx.lineWidth = 1.8;
      cx.stroke();

      // bullet tip dot
      cx.beginPath(); cx.arc(b.x, b.y, 2, 0, Math.PI * 2);
      cx.fillStyle = `rgba(255,255,200,${b.life * 0.9})`; cx.fill();
    }
  }

  /* ══════════════════════════════════════════════
     SHELL CASINGS  (eject upward + arc down)
  ══════════════════════════════════════════════ */
  const casings = [];
  let cTimer = 0;

  function spawnCasing(bx, by) {
    casings.push({
      x: bx || W * (0.3 + Math.random() * 0.5),
      y: by || H * (0.3 + Math.random() * 0.4),
      vx:  3 + Math.random() * 4,
      vy: -(4 + Math.random() * 5),
      rot: Math.random() * Math.PI * 2,
      rspd: (Math.random() - 0.5) * 0.3,
      life: 1,
    });
  }

  function drawCasings() {
    if (++cTimer > 12) { spawnCasing(); cTimer = 0; }
    for (let i = casings.length - 1; i >= 0; i--) {
      const c = casings[i];
      c.x   += c.vx;
      c.y   += c.vy;
      c.vy  += 0.18;          // gravity
      c.rot += c.rspd;
      c.life -= 0.012;
      if (c.life <= 0) { casings.splice(i, 1); continue; }

      cx.save();
      cx.translate(c.x, c.y);
      cx.rotate(c.rot);
      cx.globalAlpha = c.life * 0.7;
      // casing body
      cx.fillStyle = '#c8901a';
      cx.beginPath(); cx.roundRect(-2, -6, 5, 12, 1); cx.fill();
      // brass shine
      cx.fillStyle = 'rgba(255,220,100,0.5)';
      cx.beginPath(); cx.roundRect(-1, -5, 2, 9, 1); cx.fill();
      // rim
      cx.fillStyle = '#a06010';
      cx.beginPath(); cx.ellipse(0.5, 6, 3, 2, 0, 0, Math.PI * 2); cx.fill();
      cx.restore();
    }
  }

  /* ══════════════════════════════════════════════
     MUZZLE FLASH  (periodic burst)
  ══════════════════════════════════════════════ */
  let flash = null, flashT = 0;

  function drawMuzzleFlash() {
    if (++flashT > 25 + Math.floor(Math.random() * 40)) {
      flash = { x: W * (0.05 + Math.random() * 0.12), y: H * (0.3 + Math.random() * 0.4), life: 1 };
      flashT = 0;
      spawnCasing(flash.x + 20, flash.y);
    }
    if (!flash) return;
    flash.life -= 0.15;
    if (flash.life <= 0) { flash = null; return; }

    const fx = flash.x, fy = flash.y, fl = flash.life;
    // outer glow
    const glow = cx.createRadialGradient(fx, fy, 0, fx, fy, 60);
    glow.addColorStop(0,   `rgba(255,220,80,${fl * 0.6})`);
    glow.addColorStop(0.4, `rgba(255,100,0,${fl * 0.25})`);
    glow.addColorStop(1,   'rgba(0,0,0,0)');
    cx.fillStyle = glow; cx.beginPath(); cx.arc(fx, fy, 60, 0, Math.PI * 2); cx.fill();
    // star burst rays
    cx.save(); cx.translate(fx, fy);
    for (let i = 0; i < 8; i++) {
      cx.rotate(Math.PI / 4);
      const len = (20 + Math.random() * 30) * fl;
      cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(len, 0);
      cx.strokeStyle = `rgba(255,240,120,${fl * 0.7})`; cx.lineWidth = 2 + Math.random() * 3;
      cx.stroke();
    }
    cx.restore();
  }

  /* ══════════════════════════════════════════════
     CROSSHAIR  (floating, slow drift)
  ══════════════════════════════════════════════ */
  function drawCrosshair(x, y, r, alpha) {
    const gap = r * 0.35;
    cx.save();
    cx.globalAlpha = alpha;
    cx.strokeStyle = '#f5c400';
    cx.lineWidth = 1.5;
    // cross lines
    cx.beginPath(); cx.moveTo(x - r, y); cx.lineTo(x - gap, y); cx.stroke();
    cx.beginPath(); cx.moveTo(x + gap, y); cx.lineTo(x + r, y); cx.stroke();
    cx.beginPath(); cx.moveTo(x, y - r); cx.lineTo(x, y - gap); cx.stroke();
    cx.beginPath(); cx.moveTo(x, y + gap); cx.lineTo(x, y + r); cx.stroke();
    // outer ring
    cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2);
    cx.strokeStyle = `rgba(245,196,0,${alpha * 0.5})`; cx.stroke();
    // center dot
    cx.beginPath(); cx.arc(x, y, 2, 0, Math.PI * 2);
    cx.fillStyle = `rgba(245,196,0,${alpha})`; cx.fill();
    cx.restore();
  }

  const crosshairs = Array.from({ length: 3 }, (_, i) => ({
    x:     W * (0.15 + i * 0.35),
    y:     H * (0.2  + Math.random() * 0.5),
    r:     18 + Math.random() * 14,
    phase: Math.random() * Math.PI * 2,
    spd:   0.0004 + Math.random() * 0.0004,
  }));

  function drawCrosshairs() {
    crosshairs.forEach(c => {
      const alpha = 0.08 + 0.06 * Math.abs(Math.sin(t * c.spd + c.phase));
      const drift = Math.sin(t * 0.0007 + c.phase) * 18;
      drawCrosshair(c.x + drift, c.y, c.r, alpha);
    });
  }

  /* ══════════════════════════════════════════════
     HEX GRID (light)
  ══════════════════════════════════════════════ */
  const HR = 34;
  let hexes = [];
  function buildHexes() {
    hexes = [];
    const cols = Math.ceil(W / (HR * 1.5)) + 3;
    const rows = Math.ceil(H / (HR * Math.sqrt(3))) + 3;
    for (let r = -1; r < rows; r++)
      for (let c = -1; c < cols; c++)
        hexes.push({ cx: c * HR * 1.5, cy: r * HR * Math.sqrt(3) + (c % 2 ? HR * Math.sqrt(3) / 2 : 0),
          phase: Math.random() * Math.PI * 2, spd: 0.0004 + Math.random() * 0.001, lit: Math.random() > 0.9 });
  }
  buildHexes();
  addEventListener('resize', buildHexes);

  function hexPath(x, y, r) {
    cx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 3 * i - Math.PI / 6;
      i ? cx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a))
        : cx.moveTo(x + r * Math.cos(a), y + r * Math.sin(a));
    }
    cx.closePath();
  }

  function drawHexGrid() {
    hexes.forEach(h => {
      const p = Math.abs(Math.sin(t * h.spd + h.phase));
      if (h.lit) { hexPath(h.cx, h.cy, HR - 1); cx.fillStyle = `rgba(245,196,0,${p * 0.045})`; cx.fill(); }
      hexPath(h.cx, h.cy, HR - 1);
      cx.strokeStyle = h.lit ? `rgba(245,196,0,${0.03 + p * 0.12})` : `rgba(30,80,200,${0.01 + p * 0.02})`;
      cx.lineWidth = h.lit ? 1 : 0.4; cx.stroke();
    });
  }

  /* ══════════════════════════════════════════════
     ZONE RING
  ══════════════════════════════════════════════ */
  function drawZone() {
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.0005);
    const r = Math.min(W, H) * (0.3 + 0.018 * pulse);
    const zx = W * 0.5, zy = H * 0.42;
    const g = cx.createRadialGradient(zx, zy, r * 0.82, zx, zy, r * 1.14);
    g.addColorStop(0, 'rgba(0,120,255,0)');
    g.addColorStop(0.7, `rgba(0,100,255,${0.055 * pulse})`);
    g.addColorStop(1, 'rgba(0,50,180,0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(zx, zy, r * 1.14, 0, Math.PI * 2); cx.fill();
    cx.beginPath(); cx.arc(zx, zy, r, 0, Math.PI * 2);
    cx.strokeStyle = `rgba(25,140,255,${0.16 + 0.06 * pulse})`;
    cx.lineWidth = 1.2; cx.setLineDash([10, 8]); cx.stroke(); cx.setLineDash([]);
  }

  /* ══════════════════════════════════════════════
     VIGNETTE
  ══════════════════════════════════════════════ */
  function drawVig() {
    const v = cx.createRadialGradient(W/2, H/2, H*0.1, W/2, H/2, H*1.05);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(0.4, 'rgba(0,0,0,0.22)');
    v.addColorStop(1, 'rgba(0,0,0,0.95)');
    cx.fillStyle = v; cx.fillRect(0, 0, W, H);
  }

  /* ══════════════════════════════════════════════
     MAIN LOOP
  ══════════════════════════════════════════════ */
  function loop(ts) {
    t = ts;
    cx.clearRect(0, 0, W, H);

    // deep bg
    cx.fillStyle = '#02040c'; cx.fillRect(0, 0, W, H);
    const n1 = cx.createRadialGradient(W*.3, H*.28, 0, W*.3, H*.28, W*.56);
    n1.addColorStop(0, 'rgba(12,6,45,.5)'); n1.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = n1; cx.fillRect(0, 0, W, H);
    const n2 = cx.createRadialGradient(W*.78, H*.7, 0, W*.78, H*.7, W*.4);
    n2.addColorStop(0, 'rgba(30,6,6,.35)'); n2.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = n2; cx.fillRect(0, 0, W, H);

    drawHexGrid();
    drawZone();
    drawGuns();          // floating AK-47 silhouettes
    drawCrosshairs();    // PUBG crosshairs
    drawMuzzleFlash();   // muzzle flash bursts
    drawBullets();       // tracer bullets
    drawCasings();       // ejected brass
    drawVig();

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
