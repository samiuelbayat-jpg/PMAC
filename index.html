  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PUBG Mobile Afghanistan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --gold:  #f5c400;
      --panel: rgba(4,6,16,0.78);
      --border:rgba(245,196,0,0.25);
      --muted: #4a5568;
    }
    html, body { height:100%; font-family:'Rajdhani',sans-serif; background:#03050d; color:#dde4f0; overflow:hidden; }

    /* bg canvas sits behind everything */
    #bg { position:fixed; inset:0; z-index:0; width:100%; height:100%; display:block; }

    /* scanline flicker */
    .scanlines {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,0.045) 2px,rgba(0,0,0,0.045) 3px);
      animation:flicker 9s infinite;
    }
    @keyframes flicker {
      0%,100%{opacity:1} 91%{opacity:1} 92%{opacity:.88} 93%{opacity:1} 97%{opacity:1} 98%{opacity:.92} 99%{opacity:1}
    }

    /* centered screen */
    .screen {
      position:relative; z-index:2;
      height:100vh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:1.5rem;
    }

    /* brand */
    .brand { text-align:center; margin-bottom:1.8rem; animation:fadeDown .65s ease both; }
    .brand-title {
      font-family:'Barlow Condensed',sans-serif;
      font-size:clamp(1.9rem,4.5vw,3rem); font-weight:900;
      text-transform:uppercase; letter-spacing:6px; color:#fff;
      text-shadow:0 2px 30px rgba(0,0,0,.9), 0 0 60px rgba(245,196,0,.35);
    }
    .brand-title em { font-style:normal; color:var(--gold); }
    .brand-sub {
      font-family:'Barlow Condensed',sans-serif;
      font-size:9px; font-weight:700; letter-spacing:5px; text-transform:uppercase;
      color:var(--muted); margin-top:5px;
      text-shadow:0 1px 6px rgba(0,0,0,.8);
    }

    /* card */
    .card {
      width:100%; max-width:390px;
      background:var(--panel);
      border:1px solid var(--border);
      backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px);
      padding:2.2rem 2rem;
      position:relative;
      animation:fadeUp .6s ease .1s both;
      box-shadow:0 8px 40px rgba(0,0,0,.7);
    }
    .card::before,.card::after {
      content:''; position:absolute;
      width:16px; height:16px;
      border-color:var(--gold); border-style:solid;
    }
    .card::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
    .card::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

    .card-heading {
      font-family:'Barlow Condensed',sans-serif;
      font-size:11px; font-weight:700; letter-spacing:4px; text-transform:uppercase;
      color:var(--gold); margin-bottom:1.6rem;
      display:flex; align-items:center; gap:10px;
    }
    .card-heading::before { content:''; width:22px; height:2px; background:var(--gold); flex-shrink:0; }

    /* fields */
    .field { display:flex; flex-direction:column; gap:5px; margin-bottom:1.1rem; }
    .field label {
      font-family:'Barlow Condensed',sans-serif;
      font-size:9px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--muted);
    }
    .field input {
      width:100%; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
      color:#fff; font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600;
      padding:11px 13px; outline:none; transition:border-color .18s,background .18s;
    }
    .field input:focus { border-color:var(--gold); background:rgba(245,196,0,.05); }
    .field input::placeholder { color:var(--muted); font-weight:500; font-size:13px; }

    /* error */
    #err {
      display:none; font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:600;
      background:rgba(220,50,50,.12); border:1px solid rgba(220,50,50,.3);
      color:#ff6b6b; padding:9px 13px; margin-bottom:1rem; line-height:1.4;
    }

    /* button */
    #login-btn {
      width:100%; background:var(--gold); border:none; color:#060810;
      font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:900;
      letter-spacing:4px; text-transform:uppercase; padding:13px; cursor:pointer;
      margin-top:.4rem; transition:background .18s,transform .1s;
      clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
    }
    #login-btn:hover    { background:#ffe066; }
    #login-btn:active   { transform:scale(.98); }
    #login-btn:disabled { background:#1a1f2e; color:#3a4255; cursor:not-allowed; }

    @keyframes fadeUp   { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
    @keyframes fadeDown { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:none} }
    @media(max-width:420px){ .card{padding:1.7rem 1.3rem;} }
  </style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="scanlines"></div>

<div class="screen">
  <div class="brand">
    <div class="brand-title">PUBG <em>Mobile</em> Afghanistan</div>
    <div class="brand-sub">Official Tournament Platform</div>
  </div>
  <div class="card">
    <div class="card-heading">Admin Access</div>
    <div id="err"></div>
    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@example.com" autocomplete="email" required/>
      </div>

<script type="module">

  import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyD-RFu-40Igcoqhm8QBbu_PgdFxV6aUIQA",
    authDomain:        "pubg-mobile-afghanistan.firebaseapp.com",
    databaseURL:       "https://pubg-mobile-afghanistan-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "pubg-mobile-afghanistan",
    storageBucket:     "pubg-mobile-afghanistan.firebasestorage.app",
    messagingSenderId: "279105805502",
    appId:             "1:279105805502:web:8def653069d0b3d73bd2ef"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const errEl = document.getElementById("err");
  const btn   = document.getElementById("login-btn");

  // Always sign out on load so login form always shows
  signOut(auth).catch(()=>{});

  document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();
    errEl.style.display = "none";
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) { errEl.textContent="Please enter your email and password."; errEl.style.display="block"; return; }
    btn.disabled = true; btn.textContent = "Signing in\u2026";
    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "admin.html";
    } catch(err) {
      const msgs = {
        "auth/user-not-found":    "No account found with that email.",
        "auth/wrong-password":    "Incorrect password.",
        "auth/invalid-email":     "Please enter a valid email address.",
        "auth/too-many-requests": "Too many failed attempts. Try again later.",
        "auth/invalid-credential":"Invalid email or password.",
      };
      errEl.textContent = msgs[err.code] || "Sign in failed. Please try again.";
      errEl.style.display = "block";
      btn.disabled = false; btn.textContent = "Sign In";
    }
  });
</script>

  /* ── Ken Burns pan ── */
  function drawBg(){
    if(!bgImg.complete || !bgImg.naturalWidth) return;
    const iw = bgImg.naturalWidth, ih = bgImg.naturalHeight;
    const scale = Math.max(W/iw, H/ih) * 1.06;
    const sw = iw*scale, sh = ih*scale;
    const zoom  = 1 + 0.018 * Math.sin(t*0.00015);
    const panX  = (sw*zoom - W)/2 + 22*Math.sin(t*0.0001);
    const panY  = (sh*zoom - H)/2 + 12*Math.sin(t*0.000075+1);
    cx.save();
    cx.filter = 'brightness(0.52) saturate(0.85)';
    cx.drawImage(bgImg, -panX, -panY, sw*zoom, sh*zoom);
    cx.restore();
  }

  /* ── Dark overlay gradient to darken edges and centre-focus ── */
  function drawOverlay(){
    // deep vignette
    const v = cx.createRadialGradient(W/2,H/2,H*0.08,W/2,H/2,H*1.0);
    v.addColorStop(0,   'rgba(0,0,0,0)');
    v.addColorStop(0.38,'rgba(0,0,0,0.18)');
    v.addColorStop(1,   'rgba(0,0,0,0.88)');
    cx.fillStyle = v; cx.fillRect(0,0,W,H);
    // bottom darkness so card reads cleanly
    const bot = cx.createLinearGradient(0,H*0.55,0,H);
    bot.addColorStop(0,'rgba(0,0,0,0)');
    bot.addColorStop(1,'rgba(2,3,10,0.65)');
    cx.fillStyle = bot; cx.fillRect(0,0,W,H);
  }

  /* ══ TRACER BULLETS ══ */
  const bullets = [];
  let bT = 0;
  function spawnBullet(){
    const angle = (Math.random()-0.5)*0.12;
    const speed = 16 + Math.random()*12;
    bullets.push({
      x:-20, y: H*(0.08+Math.random()*0.84),
      vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
      len:20+Math.random()*28, life:1
    });
  }
  function drawBullets(){
    if(++bT > 6+Math.floor(Math.random()*10)){ spawnBullet(); bT=0; }
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      b.x+=b.vx; b.y+=b.vy;
      if(b.x>W+40||b.y<-20||b.y>H+20){ bullets.splice(i,1); continue; }
      const tail = b.len / Math.max(Math.abs(b.vx),1);
      const g = cx.createLinearGradient(b.x,b.y, b.x-b.vx*tail, b.y-b.vy*tail);
      g.addColorStop(0,  `rgba(255,245,160,0.95)`);
      g.addColorStop(0.3,`rgba(255,170,40,0.6)`);
      g.addColorStop(1,  'rgba(255,80,0,0)');
      cx.beginPath(); cx.moveTo(b.x,b.y); cx.lineTo(b.x-b.vx*tail, b.y-b.vy*tail);
      cx.strokeStyle=g; cx.lineWidth=2; cx.stroke();
      cx.beginPath(); cx.arc(b.x,b.y,2.2,0,Math.PI*2);
      cx.fillStyle='rgba(255,255,200,0.95)'; cx.fill();
    }
  }

  /* ══ SHELL CASINGS ══ */
  const casings=[];
  let cT=0;
  function spawnCasing(){
    casings.push({
      x:W*(0.25+Math.random()*0.5), y:H*(0.25+Math.random()*0.5),
      vx:2+Math.random()*4, vy:-(4+Math.random()*5),
      rot:Math.random()*Math.PI*2, rspd:(Math.random()-0.5)*0.28, life:1
    });
  }
  function drawCasings(){
    if(++cT>14){ spawnCasing(); cT=0; }
    for(let i=casings.length-1;i>=0;i--){
      const c=casings[i];
      c.x+=c.vx; c.y+=c.vy; c.vy+=0.16; c.rot+=c.rspd; c.life-=0.011;
      if(c.life<=0){ casings.splice(i,1); continue; }
      cx.save(); cx.translate(c.x,c.y); cx.rotate(c.rot); cx.globalAlpha=c.life*0.72;
      cx.fillStyle='#c8901a';
      cx.beginPath(); cx.roundRect(-2,-6,5,12,1); cx.fill();
      cx.fillStyle='rgba(255,215,90,0.5)';
      cx.beginPath(); cx.roundRect(-1,-5,2,9,1); cx.fill();
      cx.fillStyle='#904808';
      cx.beginPath(); cx.ellipse(0.5,6,3,2,0,0,Math.PI*2); cx.fill();
      cx.restore();
    }
  }

  /* ══ MUZZLE FLASH ══ */
  let flash=null, fT=0;
  function drawFlash(){
    if(++fT > 30+Math.floor(Math.random()*50)){
      flash={x:W*(0.04+Math.random()*0.1), y:H*(0.28+Math.random()*0.44), life:1};
      fT=0; spawnCasing();
    }
    if(!flash) return;
    flash.life-=0.14;
    if(flash.life<=0){ flash=null; return; }
    const fx=flash.x, fy=flash.y, fl=flash.life;
    const glow=cx.createRadialGradient(fx,fy,0,fx,fy,65);
    glow.addColorStop(0,  `rgba(255,225,90,${fl*0.65})`);
    glow.addColorStop(0.4,`rgba(255,100,0,${fl*0.28})`);
    glow.addColorStop(1,  'rgba(0,0,0,0)');
    cx.fillStyle=glow; cx.beginPath(); cx.arc(fx,fy,65,0,Math.PI*2); cx.fill();
    cx.save(); cx.translate(fx,fy);
    for(let i=0;i<8;i++){
      cx.rotate(Math.PI/4);
      const len=(18+Math.random()*26)*fl;
      cx.beginPath(); cx.moveTo(0,0); cx.lineTo(len,0);
      cx.strokeStyle=`rgba(255,235,120,${fl*0.7})`; cx.lineWidth=2+Math.random()*3; cx.stroke();
    }
    cx.restore();
  }

  /* ══ CROSSHAIRS ══ */
  const crosshairs=[
    {x:0.15,y:0.25,r:22,phase:0,     spd:0.0005},
    {x:0.82,y:0.65,r:18,phase:2.1,   spd:0.0007},
    {x:0.55,y:0.12,r:26,phase:4.3,   spd:0.0004},
  ];
  function drawCrosshairs(){
    crosshairs.forEach(c=>{
      const alpha=0.1+0.08*Math.abs(Math.sin(t*c.spd+c.phase));
      const dx=Math.sin(t*0.0008+c.phase)*20, dy=Math.cos(t*0.0006+c.phase)*12;
      const x=c.x*W+dx, y=c.y*H+dy, r=c.r, gap=r*0.3;
      cx.save(); cx.globalAlpha=alpha; cx.strokeStyle='#f5c400'; cx.lineWidth=1.4;
      cx.beginPath(); cx.moveTo(x-r,y); cx.lineTo(x-gap,y); cx.stroke();
      cx.beginPath(); cx.moveTo(x+gap,y); cx.lineTo(x+r,y); cx.stroke();
      cx.beginPath(); cx.moveTo(x,y-r); cx.lineTo(x,y-gap); cx.stroke();
      cx.beginPath(); cx.moveTo(x,y+gap); cx.lineTo(x,y+r); cx.stroke();
      cx.beginPath(); cx.arc(x,y,r,0,Math.PI*2);
      cx.strokeStyle=`rgba(245,196,0,${alpha*0.45})`; cx.stroke();
      cx.beginPath(); cx.arc(x,y,2,0,Math.PI*2);
      cx.fillStyle=`rgba(245,196,0,${alpha})`; cx.fill();
      cx.restore();
    });
  }

  /* ══ EMBERS / SPARKS ══ */
  const embers=[];
  let eT=0;
  function spawnEmber(){
    embers.push({
      x:Math.random()*W, y:H+10,
      vx:(Math.random()-0.5)*1.4, vy:-(0.6+Math.random()*1.8),
      r:0.5+Math.random()*1.8, life:1, decay:0.003+Math.random()*0.006,
      hue:15+Math.floor(Math.random()*35)
    });
  }
  function drawEmbers(){
    if(++eT>4){ spawnEmber(); eT=0; }
    for(let i=embers.length-1;i>=0;i--){
      const e=embers[i];
      e.x+=e.vx+Math.sin(t*0.002+i)*0.3; e.y+=e.vy; e.life-=e.decay;
      if(e.life<=0||e.y<-10){ embers.splice(i,1); continue; }
      cx.beginPath(); cx.arc(e.x,e.y,e.r,0,Math.PI*2);
      cx.fillStyle=`hsla(${e.hue},100%,65%,${e.life*0.8})`; cx.fill();
      cx.beginPath(); cx.moveTo(e.x,e.y); cx.lineTo(e.x-e.vx*4,e.y-e.vy*4);
      cx.strokeStyle=`hsla(${e.hue},100%,75%,${e.life*0.3})`; cx.lineWidth=e.r*0.5; cx.stroke();
    }
  }

  /* ══ FLOATING DUST PARTICLES ══ */
  const dust=Array.from({length:55},()=>({
    x:Math.random()*2000, y:Math.random()*1200,
    vx:(Math.random()-0.5)*0.3, vy:-0.08-Math.random()*0.3,
    r:0.4+Math.random()*1.4, a:0.08+Math.random()*0.28, gold:Math.random()>0.6
  }));
  function drawDust(){
    dust.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.y<-4)p.y=H+4; if(p.x<-4)p.x=W+4; if(p.x>W+4)p.x=-4;
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,Math.PI*2);
      cx.fillStyle=p.gold?`rgba(245,196,0,${p.a})`:`rgba(200,160,100,${p.a*0.6})`; cx.fill();
    });
  }

  /* ══ RADAR PING RINGS ══ */
  const rings=[]; let rT=0;
  function drawRings(){
    if(++rT>100){ rings.push({x:W*(0.15+Math.random()*0.7),y:H*(0.1+Math.random()*0.5),r:0,max:80+Math.random()*120,spd:0.5+Math.random()*0.45}); rT=0; }
    for(let i=rings.length-1;i>=0;i--){
      const r=rings[i]; r.r+=r.spd;
      const life=1-r.r/r.max;
      if(life<=0){rings.splice(i,1);continue;}
      cx.beginPath(); cx.arc(r.x,r.y,r.r,0,Math.PI*2);
      cx.strokeStyle=`rgba(245,196,0,${life*0.14})`; cx.lineWidth=1; cx.stroke();
    }
  }

  /* ══ MAIN LOOP ══ */
  function loop(ts){
    t=ts; cx.clearRect(0,0,W,H);
    drawBg();         // PUBG wallpaper (Ken Burns)
    drawOverlay();    // vignette + bottom dark
    drawCrosshairs(); // floating crosshairs
    drawFlash();      // muzzle flash
    drawBullets();    // tracer bullets
    drawCasings();    // ejected brass
    drawEmbers();     // rising sparks
    drawDust();       // dust particles
    drawRings();      // radar pings
    requestAnimationFrame(loop);
  }

  bgImg.onload  = ()=>requestAnimationFrame(loop);
  bgImg.onerror = ()=>{ cx.fillStyle='#03050d'; cx.fillRect(0,0,W,H); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
})();
</script>
