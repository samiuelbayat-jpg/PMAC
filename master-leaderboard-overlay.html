  <style>

  </style>
</head>
<body>

<script>
firebase.initializeApp({

var db=firebase.database();
var qs=new URLSearchParams(location.search);
var EVENT_ID=qs.get("event")||localStorage.getItem("pmac_active_event")||"default";
var MATCHES=Math.max(1,Math.min(60,parseInt(qs.get("matches")||"20",10)||20));

var TITLE=qs.get("title")||"MASTER LEADERBOARD";
var SUBTITLE=qs.get("subtitle")||"GROUP STAGE";
var MODE=qs.get("mode")||qs.get("scope")||"event";
var OVERALL_MODE=/^(overall|all|history)$/i.test(MODE);
var teams=[],scoreTeams=[],regTeams=[],scores={},eventInfo={},overlayInfo={},countryFlagLibrary={},teamsRef=null,regsRef=null,scoresRef=null,activeRef=null,themeRef=null,overlayInfoRef=null,eventInfoRef=null,eventGroupsRef=null,mainTeamsRef=null,mainScoresRef=null,countryFlagsRef=null,activeTeamRefs=[],activeScoreRefs=[],lastRenderSignature="",currentTheme=null;
var masterConfig={title:TITLE,eventInfo:SUBTITLE,pageSeconds:30,selectedArchives:{}},archiveCache={},masterConfigRef=null,masterArchiveRef=null,pageIndex=0,pageTimer=null,currentPageSeconds=30,masterRotationStartedAt=Date.now();
var THEME_KEY="pmac_match_points_theme_"+EVENT_ID;
var THEME_DEFAULTS={titleColor:"#f4eadc",team:"#d95b06",accent:"#f47a19",text:"#080808",total1:"#f2eee6",total2:"#ddd8cf",total3:"#c9c2b7"};
var THEME_VARS={titleColor:"--title-color",team:"--team-b",accent:"--sub-accent",text:"--row-text",total1:"--total-a",total2:"--total-b",total3:"--total-c"};
var HAS_THEME_PARAMS=Object.keys(THEME_DEFAULTS).some(function(k){return !!qs.get(k);});

document.documentElement.style.setProperty("--matches",MATCHES);

function readTheme(){
  var saved={};
  try{saved=JSON.parse(localStorage.getItem(THEME_KEY)||"{}");}catch(e){saved={};}
  Object.keys(THEME_DEFAULTS).forEach(function(k){if(qs.get(k))saved[k]=qs.get(k);});
  return Object.assign({},THEME_DEFAULTS,saved);
}
function applyTheme(theme,save){
  currentTheme=Object.assign({},THEME_DEFAULTS,theme||{});
  Object.keys(THEME_VARS).forEach(function(k){
    var val=theme[k]||THEME_DEFAULTS[k];
    document.documentElement.style.setProperty(THEME_VARS[k],val);
    var inp=document.querySelector('[data-theme="'+k+'"]');
    if(inp)inp.value=val;
  });
  document.documentElement.style.setProperty("--team-a",lightenHex(theme.team||THEME_DEFAULTS.team,.45));
  document.documentElement.style.setProperty("--sub-bg",theme.team||THEME_DEFAULTS.team);
  document.documentElement.style.setProperty("--col-bg",darkenHex(theme.team||THEME_DEFAULTS.team,.10));
  if(save)localStorage.setItem(THEME_KEY,JSON.stringify(theme));
  updateThemeLink(theme);
}
function sharedOverlayColor(){
  var s=overlayInfo||{};
  return s.accent||s.top4Color||"";
}
function applySharedOverlayColor(){
  if(HAS_THEME_PARAMS)return;
  var color=sharedOverlayColor();
  if(!color)return;
  var theme=Object.assign({},currentTheme||readTheme(),{team:color,accent:color});
  applyTheme(theme,false);
}
function darkenHex(hex,mix){
  hex=String(hex||"#d95b06").replace("#","");
  var n=parseInt(hex.length===3?hex.replace(/(.)/g,"$1$1"):hex,16);
  var r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r*(1-mix));g=Math.round(g*(1-mix));b=Math.round(b*(1-mix));
  return "#"+[r,g,b].map(function(v){return v.toString(16).padStart(2,"0");}).join("");
}
function lightenHex(hex,mix){
  hex=String(hex||"#ffd83d").replace("#","");
  var n=parseInt(hex.length===3?hex.replace(/(.)/g,"$1$1"):hex,16);
  var r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r+(255-r)*mix);g=Math.round(g+(255-g)*mix);b=Math.round(b+(255-b)*mix);
  return "#"+[r,g,b].map(function(v){return v.toString(16).padStart(2,"0");}).join("");
}
function themeUrl(theme){
  var u=new URL(location.href);
  u.searchParams.delete("controls");
  u.searchParams.set("event",EVENT_ID);
  u.searchParams.set("matches",MATCHES);
  u.searchParams.set("limit",LIMIT);
  Object.keys(THEME_DEFAULTS).forEach(function(k){u.searchParams.set(k,theme[k]||THEME_DEFAULTS[k]);});
  return u.toString();
}
function updateThemeLink(theme){
  var box=document.getElementById("theme-link");
  if(box)box.value=themeUrl(theme||readTheme());
}
function resetTheme(){applyTheme(Object.assign({},THEME_DEFAULTS),true);}
function copyThemeLink(){
  var box=document.getElementById("theme-link");
  if(!box)return;
  box.select();
  try{navigator.clipboard.writeText(box.value);}catch(e){document.execCommand("copy");}
}
function setupThemeControls(){
  var controls=document.getElementById("theme-controls");
  var theme=readTheme();
  applyTheme(theme,false);
  if(qs.get("controls")==="1")controls.classList.add("show");
  document.querySelectorAll("[data-theme]").forEach(function(inp){
    inp.addEventListener("input",function(){
      theme=readTheme();
      document.querySelectorAll("[data-theme]").forEach(function(i){theme[i.dataset.theme]=i.value;});
      applyTheme(theme,true);
    });
  });
}

function fitStage(){
  var scale=Math.min(window.innerWidth/1920,window.innerHeight/1080);
  document.getElementById("stage").style.transform="scale("+scale+")";
}
window.addEventListener("resize",fitStage);
fitStage();
setupThemeControls();

function eventBasePath(){return EVENT_ID==="default"?"pmac":"pmac/events/"+EVENT_ID;}
function eventPath(child){return eventBasePath()+"/"+child;}
function esc(v){
  return String(v==null?"":v).replace(/[&<>"']/g,function(m){
    return m==="&"?"&amp;":m==="<"?"&lt;":m===">"?"&gt;":m==='"'?"&quot;":"&#39;";
  });
}
function watchTheme(){
  if(HAS_THEME_PARAMS) return;
  if(themeRef) themeRef.off();
  themeRef=db.ref(eventPath("matchPointsOverlay/theme"));
  themeRef.on("value",function(s){
    var theme=Object.assign({},THEME_DEFAULTS,s.val()||{});
    applyTheme(theme,true);
    applySharedOverlayColor();
  });
}
function watchOverlayInfo(){
  if(overlayInfoRef) overlayInfoRef.off();
  overlayInfoRef=db.ref(eventPath("overlaySettings"));
  overlayInfoRef.on("value",function(s){
    overlayInfo=s.val()||{};
    applySharedOverlayColor();
    renderHead();
  });
}
function sanitizeKey(n){return String(n||"").replace(/[\.\#\$\/\[\]]/g,"_");}
function norm(n){return String(n||"").trim().toUpperCase();}
function countryCode(v){return String(v||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);}
function teamCountryFlag(team){
  if(!team) return "";
  if(team.flag||team.countryFlag) return team.flag||team.countryFlag||"";
  var code=countryCode(team.country);
  return code&&countryFlagLibrary[code] ? (countryFlagLibrary[code].flag||"") : "";
}
function renderFlag(team){
  var flag=teamCountryFlag(team);
  return flag?'<div class="flag"><img src="'+esc(flag)+'" alt="" onerror="this.parentElement.remove()"></div>':"";
}
function watchCountryFlags(){
  if(countryFlagsRef) countryFlagsRef.off();
  countryFlagsRef=db.ref(eventPath("countryFlags"));
  countryFlagsRef.on("value",function(s){
    var data=s.val()||{},next={};
    Object.keys(data).forEach(function(k){
      var item=data[k]||{},code=countryCode(item.code||k);
      if(code&&item.flag) next[code]={code:code,flag:item.flag};
    });
    countryFlagLibrary=next;
    render();
  },function(){});
}
function initials(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(function(s){return s[0]||"";}).join("").toUpperCase()||"?";}
function placePoints(rank){
  var r=parseInt(rank,10);
  if(r===1)return 10;if(r===2)return 6;if(r===3)return 5;if(r===4)return 4;if(r===5)return 3;if(r===6)return 2;if(r===7||r===8)return 1;
  return 0;
}
function rowPoints(row){
  if(!row)return 0;
  if(row.total!==undefined&&row.total!==null&&row.total!=="")return parseInt(row.total,10)||0;
  if(row.points!==undefined&&row.points!==null&&row.points!=="")return parseInt(row.points,10)||0;
  if(row.pts!==undefined&&row.pts!==null&&row.pts!=="")return parseInt(row.pts,10)||0;
  return (parseInt(row.kills,10)||0)+placePoints(row.rank);
}
function rowKills(row){
  var k=parseInt(row&&row.kills,10);
  return Number.isFinite(k)?Math.max(0,k):0;
}
function rowRankPoints(row){
  if(!row)return 0;
  var explicit=parseInt(row.rankPts!==undefined?row.rankPts:(row.placePoints!==undefined?row.placePoints:row.placementPoints),10);
  if(Number.isFinite(explicit))return Math.max(0,explicit);
  if(row.total!==undefined||row.points!==undefined||row.pts!==undefined)return Math.max(0,rowPoints(row)-rowKills(row));
  return placePoints(row.rank);
}
function scoreRowsForTeam(team){
  if(team&&team.matchRows) return team.matchRows;
  var key=sanitizeKey(team.name);
  var tagKey=team&&team.tag?sanitizeKey(team.tag):"";
  return scores[key]||scores[norm(team.name)]||scores[team.name]||(tagKey&&scores[tagKey])||[];
}
function teamTotal(team){
  if(team&&Number.isFinite(Number(team.totalOverall))) return Number(team.totalOverall)||0;
  var rows=scoreRowsForTeam(team),sum=0;
  for(var i=0;i<MATCHES;i++)sum+=rowPoints(rows[i]||{});
  return sum;
}
function teamStats(team){
  if(team&&Number.isFinite(Number(team.killsOverall))&&Number.isFinite(Number(team.rankPtsOverall))){
    return {kills:Number(team.killsOverall)||0,rankPts:Number(team.rankPtsOverall)||0,total:teamTotal(team),best:Number(team.bestSingleMatch)||0};
  }
  var rows=scoreRowsForTeam(team),kills=0,rankPts=0;
  for(var i=0;i<MATCHES;i++){kills+=rowKills(rows[i]||{});rankPts+=rowRankPoints(rows[i]||{});}
  return {kills:kills,rankPts:rankPts,total:teamTotal(team),best:0};
}
function setStatus(t){document.getElementById("status").textContent=t||"";}
function toList(v){
  return Array.isArray(v)?v:Object.keys(v||{}).map(function(k){var o=v[k]||{};if(!o.id)o.id=k;return o;});
}
function useableRegistrationTeams(v){
  return toList(v).filter(function(t){return t&&t.name&&(t.status==="approved"||t.approved===true||t.idPassConfirmed===true||!t.status);});
}
function refreshTeams(){
  teams=scoreTeams.length?scoreTeams:regTeams;
  render();
}
function attachDataRefs(base,fallbackBase){
  if(teamsRef)teamsRef.off();
  if(regsRef)regsRef.off();
  if(scoresRef)scoresRef.off();
  activeTeamRefs.forEach(function(r){r.off();});
  activeScoreRefs.forEach(function(r){r.off();});
  activeTeamRefs=[];activeScoreRefs=[];
  teamsRef=db.ref(base+"/teams");
  regsRef=db.ref((fallbackBase||base)+"/registrations");
  scoresRef=db.ref(base+(base.indexOf("/eventGroups/")>-1?"/scores":"/matches"));
  teamsRef.on("value",function(s){scoreTeams=toList(s.val()||[]);refreshTeams();},function(e){setStatus(e.message);});
  regsRef.on("value",function(s){regTeams=useableRegistrationTeams(s.val()||{});refreshTeams();},function(){regTeams=[];refreshTeams();});
  scoresRef.on("value",function(s){scores=s.val()||{};render();},function(e){setStatus(e.message);});
}
function activeSessionList(active){
  if(!active) return [];
  if(active.sessions){
    var sessions=Array.isArray(active.sessions)?active.sessions:Object.keys(active.sessions||{}).map(function(k){return active.sessions[k];});
    return sessions.filter(function(s){return s&&s.group&&s.date;}).map(function(s){return {group:s.group,date:s.date};});
  }
  if(active.group&&active.date) return [{group:active.group,date:active.date}];
  return [];
}
function attachActiveSessionList(list){
  if(teamsRef)teamsRef.off();
  if(regsRef)regsRef.off();
  if(scoresRef)scoresRef.off();
  activeTeamRefs.forEach(function(r){r.off();});
  activeScoreRefs.forEach(function(r){r.off();});
  activeTeamRefs=[];activeScoreRefs=[];
  if(!list.length){ attachDataRefs(eventBasePath(),eventBasePath()); return; }
  var teamBuckets={},scoreBuckets={};
  function combine(){
    var teamMap={},scoreMap={};
    list.forEach(function(a){
      var key=a.group+"|"+a.date;
      (teamBuckets[key]||[]).forEach(function(t){
        if(!t||!t.name) return;
        var k=teamKey(t);
        if(!teamMap[k]) teamMap[k]=t;
      });
      Object.keys(scoreBuckets[key]||{}).forEach(function(scoreKey){
        scoreMap[scoreKey]=scoreBuckets[key][scoreKey];
      });
    });
    scoreTeams=Object.keys(teamMap).map(function(k){return teamMap[k];});
    regTeams=[];
    scores=scoreMap;
    refreshTeams();
  }
  list.forEach(function(a){
    var base=eventPath("eventGroups/"+a.group+"/sessions/"+a.date);
    var key=a.group+"|"+a.date;
    var tr=db.ref(base+"/teams"),sr=db.ref(base+"/scores");
    activeTeamRefs.push(tr);activeScoreRefs.push(sr);
    tr.on("value",function(s){
      teamBuckets[key]=toList(s.val()||[]);
      combine();
    },function(e){setStatus(e&&e.message?e.message:"active teams blocked");});
    sr.on("value",function(s){
      scoreBuckets[key]=s.val()||{};
      combine();
    },function(e){setStatus(e&&e.message?e.message:"active scores blocked");});
  });
}
function watchActive(){
  if(activeRef)activeRef.off();
  activeRef=db.ref(eventPath("activeSession"));
  activeRef.on("value",function(s){
    var list=activeSessionList(s.val());
    if(list.length) attachActiveSessionList(list);
    else attachDataRefs(eventBasePath(),eventBasePath());
  },function(){attachDataRefs(eventBasePath(),eventBasePath());});
}
function cleanDate(v){
  var m=String(v||"").match(/\d{4}-\d{2}-\d{2}/);
  return m?m[0]:"";
}
function inOverallRange(date){
  date=cleanDate(date);
  var start=cleanDate(eventInfo.overallStartDate||"");
  var end=cleanDate(eventInfo.overallEndDate||"");
  if(start&&date&&date<start) return false;
  if(end&&date&&date>end) return false;
  return true;
}
function teamKey(t){
  var tag=norm(t&&t.tag);
  return tag ? "TAG:"+tag : "NAME:"+norm(t&&t.name);
}
function sameTeamIdentity(a,b){
  var an=norm(a&&a.name),bn=norm(b&&b.name),at=norm(a&&a.tag),bt=norm(b&&b.tag);
  return (!!an&&an===bn) || (!!at&&!!bt&&at===bt);
}
function findTeamKey(map,t){
  var direct=teamKey(t);
  if(map[direct]) return direct;
  return Object.keys(map||{}).find(function(k){return sameTeamIdentity(map[k],t);}) || direct;
}
function matchStats(row){
  if(!row) return null;
  var rank=parseInt(row.rank,10), kills=parseInt(row.kills,10);
  var hasRank=Number.isFinite(rank)&&rank>=1&&rank<=25;
  var hasKills=Number.isFinite(kills)&&kills>0;
  if(!hasRank&&!hasKills&&row.total===undefined&&row.points===undefined&&row.pts===undefined) return null;
  return {rank:hasRank?rank:null,kills:Number.isFinite(kills)?Math.max(0,kills):0,rankPts:rowRankPoints(row),total:rowPoints(row)};
}
function addOverallScores(totals,teamList,scoreSet,slotPrefix){
  toList(teamList).forEach(function(t){
    if(!t||!t.name) return;
    var k=findTeamKey(totals,t);
    if(!totals[k]) totals[k]={name:t.name,tag:t.tag||"",logo:t.logo||"",country:t.country||"",flag:t.flag||t.countryFlag||"",matchRows:[],totalOverall:0,killsOverall:0,rankPtsOverall:0,playedOverall:0,bestSingleMatch:0,matchSlots:{}};
    if(t.logo&&!totals[k].logo) totals[k].logo=t.logo;
    if(t.tag&&!totals[k].tag) totals[k].tag=t.tag;
    if(t.country&&!totals[k].country) totals[k].country=t.country;
    if((t.flag||t.countryFlag)&&!totals[k].flag) totals[k].flag=t.flag||t.countryFlag;
    var md=rowsList(scoreRowsFromSet(scoreSet,t));
    for(var i=0;i<md.length;i++){
      var st=matchStats(md[i]);
      if(!st) continue;
      var slot=slotPrefix+"|M"+((md[i]&&md[i].match)||i+1);
      if(totals[k].matchSlots[slot]) continue;
      totals[k].matchSlots[slot]=true;
      totals[k].totalOverall+=st.total;
      totals[k].killsOverall+=st.kills;
      totals[k].rankPtsOverall+=st.rankPts;
      totals[k].playedOverall++;
      totals[k].bestSingleMatch=Math.max(totals[k].bestSingleMatch||0,st.total);
      if(totals[k].matchRows.length<MATCHES) totals[k].matchRows.push({total:st.total,rank:st.rank,kills:st.kills});
    }
  });
}
function rowsList(v){
  if(Array.isArray(v)) return v;
  if(!v || typeof v!=="object") return [];
  return Object.keys(v).sort(function(a,b){
    var na=parseInt(a,10),nb=parseInt(b,10);
    if(Number.isFinite(na)&&Number.isFinite(nb)) return na-nb;
    return String(a).localeCompare(String(b));
  }).map(function(k){return v[k];});
}
function scoreRowsFromSet(scoreSet,t){
  if(Array.isArray(scoreSet)) return scoreSet;
  var raw=[t&&t.name,t&&t.tag,norm(t&&t.name),norm(t&&t.tag)].filter(Boolean);
  var keys=[];
  raw.forEach(function(k){
    [k,sanitizeKey(k),norm(k),sanitizeKey(norm(k))].forEach(function(v){if(v&&keys.indexOf(v)<0)keys.push(v);});
  });
  for(var i=0;i<keys.length;i++) if(scoreSet&&scoreSet[keys[i]]) return scoreSet[keys[i]];
  var targetName=norm(t&&t.name),targetTag=norm(t&&t.tag);
  var foundKey=Object.keys(scoreSet||{}).find(function(k){
    var nk=norm(k),sk=norm(sanitizeKey(k));
    return nk===targetName||nk===targetTag||sk===targetName||sk===targetTag;
  });
  if(foundKey) return scoreSet[foundKey];
  return [];
}
function archiveScoreSource(archive){
  var merged={}, sources=[archive&&archive.data, archive&&archive.scores];
  sources.forEach(function(source){
    if(!source||typeof source!=="object") return;
    Object.keys(source).forEach(function(key){
      if(!key||key.charAt(0)==="_") return;
      var current=rowsList(merged[key]);
      var incoming=rowsList(source[key]);
      merged[key]=current.concat(incoming);
    });
  });
  return merged;
}
function scoreKeyMatchesTeam(scoreKey,t){
  var nk=norm(scoreKey),sk=norm(sanitizeKey(scoreKey));
  return [t&&t.name,t&&t.tag,norm(t&&t.name),norm(t&&t.tag),sanitizeKey(t&&t.name),sanitizeKey(t&&t.tag)]
    .filter(Boolean)
    .some(function(v){
      var nv=norm(v),sv=norm(sanitizeKey(v));
      return nv===nk||nv===sk||sv===nk||sv===sk;
    });
}
function archiveMetaForScoreKey(metaList,scoreKey){
  return (metaList||[]).find(function(t){return scoreKeyMatchesTeam(scoreKey,t);}) || null;
}
function addRowsToMasterTotals(totals,team,rows,slotPrefix){
  if(!team||!team.name) return;
  var k=findTeamKey(totals,team);
  if(!totals[k]) totals[k]={name:team.name,tag:team.tag||"",logo:team.logo||"",country:team.country||"",flag:team.flag||team.countryFlag||"",matchRows:[],totalOverall:0,killsOverall:0,rankPtsOverall:0,playedOverall:0,bestSingleMatch:0,matchSlots:{}};
  if(team.logo&&!totals[k].logo) totals[k].logo=team.logo;
  if(team.tag&&!totals[k].tag) totals[k].tag=team.tag;
  if(team.country&&!totals[k].country) totals[k].country=team.country;
  if((team.flag||team.countryFlag)&&!totals[k].flag) totals[k].flag=team.flag||team.countryFlag;
  rowsList(rows).forEach(function(row,i){
    var st=matchStats(row);
    if(!st) return;
    var rowDate=(row&&row.date)||"";
    var rowGroup=(row&&row.group)||"";
    var rowMatch=(row&&row.match)||i+1;
    var slot=slotPrefix+"|"+rowGroup+"|"+rowDate+"|M"+rowMatch;
    if(totals[k].matchSlots[slot]) return;
    totals[k].matchSlots[slot]=true;
    totals[k].totalOverall+=st.total;
    totals[k].killsOverall+=st.kills;
    totals[k].rankPtsOverall+=st.rankPts;
    totals[k].playedOverall++;
    totals[k].bestSingleMatch=Math.max(totals[k].bestSingleMatch||0,st.total);
    if(totals[k].matchRows.length<MATCHES) totals[k].matchRows.push({total:st.total,rank:st.rank,kills:st.kills});
  });
}
function addArchiveScoresToMaster(totals,archive,archiveKey){
  var source=archiveScoreSource(archive);
  var metaList=archiveTeamList(archive);
  var keys=Object.keys(source||{}).filter(function(k){return k&&k.charAt(0)!=="_";});
  keys.forEach(function(scoreKey){
    var rows=rowsList(source[scoreKey]);
    if(!rows.length) return;
    var meta=archiveMetaForScoreKey(metaList,scoreKey)||{name:scoreKey,tag:"",logo:""};
    addRowsToMasterTotals(totals,meta,rows,archiveKey+"|"+teamKey(meta));
  });
}
function detachOverallRefs(){
  [eventInfoRef,eventGroupsRef,mainTeamsRef,mainScoresRef].forEach(function(r){if(r)r.off();});
}
function renderOverallFromSnapshots(){
  var groups=window.__overallGroups||{}, mainTeams=window.__overallMainTeams||[], mainScores=window.__overallMainScores||{};
  var totals={};
  mainTeams=toList(mainTeams);
  mainTeams.forEach(function(t){ if(t&&t.name&&!totals[teamKey(t)]) totals[teamKey(t)]={name:t.name,tag:t.tag||"",logo:t.logo||"",country:t.country||"",flag:t.flag||t.countryFlag||"",matchRows:[],totalOverall:0,playedOverall:0,matchSlots:{}}; });
  Object.keys(groups).sort().forEach(function(gid){
    var sessions=(groups[gid]&&groups[gid].sessions)||{};
    Object.keys(sessions).sort().forEach(function(date){
      var sess=sessions[date]||{};
      var d=cleanDate(sess.date||date);
      if(!inOverallRange(d)) return;
      addOverallScores(totals,sess.teams||[],sess.scores||{},d||date);
    });
  });
  if(!Object.keys(totals).some(function(k){return totals[k].playedOverall>0;})){
    addOverallScores(totals,mainTeams,mainScores,"MAIN");
  }
  teams=Object.keys(totals).map(function(k){delete totals[k].matchSlots; return totals[k];});
  scores={};
  render();
}
function watchOverall(){
  detachOverallRefs();
  eventInfoRef=db.ref(eventPath("event"));
  eventGroupsRef=db.ref(eventPath("eventGroups"));
  mainTeamsRef=db.ref(eventPath("teams"));
  mainScoresRef=db.ref(eventPath("matches"));
  eventInfoRef.on("value",function(s){eventInfo=s.val()||{};renderOverallFromSnapshots();});
  eventGroupsRef.on("value",function(s){window.__overallGroups=s.val()||{};renderOverallFromSnapshots();});
  mainTeamsRef.on("value",function(s){window.__overallMainTeams=s.val()||[];renderOverallFromSnapshots();});
  mainScoresRef.on("value",function(s){window.__overallMainScores=s.val()||{};renderOverallFromSnapshots();});
}
function selectedArchiveKeys(selected){
  if(Array.isArray(selected)) return selected.filter(Boolean);
  return Object.keys(selected||{}).filter(function(key){
    var val=selected[key];
    return val===true || val==="true" || val===1 || val==="1";
  });
}
function archiveTeamList(archive){
  var map={};
  function add(t){
    if(!t) return;
    if(typeof t==="string") t={name:t};
    var name=String(t.name||"").trim();
    if(!name) return;
    var tag=String(t.tag||"").trim();
    var candidate={name:name,tag:tag,logo:t.logo||"",country:t.country||"",flag:t.flag||t.countryFlag||""};
    var key=findTeamKey(map,candidate);
    if(!map[key]) map[key]={name:name,tag:tag,logo:t.logo||"",country:t.country||"",flag:t.flag||t.countryFlag||""};
    else {
      if(tag&&!map[key].tag) map[key].tag=tag;
      if(t.logo&&!map[key].logo) map[key].logo=t.logo;
      if(t.country&&!map[key].country) map[key].country=t.country;
      if((t.flag||t.countryFlag)&&!map[key].flag) map[key].flag=t.flag||t.countryFlag;
    }
  }
  toList(archive&&archive.teams).forEach(add);
  var source=archiveScoreSource(archive);
  Object.keys(source||{}).forEach(function(name){add({name:name});});
  return Object.keys(map).map(function(k){return map[k];});
}
function rebuildMasterFromArchive(){
  var selected=masterConfig.selectedArchives||{},totals={},selectedCount=0,loadedCount=0;
  selectedArchiveKeys(selected).forEach(function(key){
    if(!archiveCache[key]) return;
    selectedCount++;
    var archive=archiveCache[key]||{};
    addArchiveScoresToMaster(totals,archive,key);
    loadedCount++;
  });
  teams=Object.keys(totals).map(function(k){delete totals[k].matchSlots;return totals[k];});
  scores={};
  window.__masterArchiveStatus={selected:selectedCount,loaded:loadedCount};
  render();
}
function resetMasterTimer(){
  currentPageSeconds=Math.max(5,Math.min(120,parseInt(masterConfig.pageSeconds||qs.get("seconds")||"30",10)||30));
  masterRotationStartedAt=Date.now();
  pageIndex=0;
  lastRenderSignature="";
  scheduleMasterRotation();
}
function masterPageForCount(count){
  var pages=Math.max(1,Math.ceil((count||0)/LIMIT));
  if(pages<=1) return {page:0,pages:pages,nextMs:currentPageSeconds*1000};
  var elapsed=Math.max(0,Date.now()-masterRotationStartedAt);
  var slot=Math.floor(elapsed/(currentPageSeconds*1000));
  var nextMs=(currentPageSeconds*1000)-(elapsed%(currentPageSeconds*1000));
  return {page:slot%pages,pages:pages,nextMs:Math.max(500,nextMs)};
}
function scheduleMasterRotation(){
  if(pageTimer) clearTimeout(pageTimer);
  pageTimer=setTimeout(function(){
    lastRenderSignature="";
    render();
  },Math.max(500,currentPageSeconds*1000));
}
function watchMaster(){
  if(masterConfigRef) masterConfigRef.off();
  if(masterArchiveRef) masterArchiveRef.off();
  masterConfigRef=db.ref(eventPath("overlaySettings/masterLeaderboard"));
  masterArchiveRef=db.ref(eventPath("archive"));
  masterConfigRef.on("value",function(s){
    masterConfig=Object.assign({title:TITLE,eventInfo:SUBTITLE,pageSeconds:30,selectedArchives:{}},s.val()||{});
    TITLE=masterConfig.title||"MASTER LEADERBOARD";
    SUBTITLE=masterConfig.eventInfo||"GROUP STAGE";
    resetMasterTimer();
    rebuildMasterFromArchive();
  },function(e){setStatus(e&&e.message?e.message:"master config blocked");});
  masterArchiveRef.on("value",function(s){
    archiveCache=s.val()||{};
    rebuildMasterFromArchive();
  },function(e){setStatus(e&&e.message?e.message:"archive blocked");});

function renderHead(){
  var head=document.getElementById("head"),html="";
  var title=esc(TITLE);
  if(/^overall rankings$/i.test(TITLE)) title='OVERALL <span>RANKINGS</span>';
  if(/^master leaderboard$/i.test(TITLE)) title='MASTER <span>LEADERBOARD</span>';
  var sub=String(SUBTITLE || overlayInfo.matchEventInfo || (EVENT_ID==="default"?"PMAF":EVENT_ID).replace(/[-_]/g," ")).trim();
  html+='<div class="titlebar"><div class="title">'+title+'</div><div class="sub">'+esc(sub)+'</div></div>';
  head.innerHTML=html;

function renderLogo(team){
  if(team.logo)return '<img src="'+esc(team.logo)+'" alt="" data-logo-src="'+esc(team.logo)+'" onload="fitLogo(this)" onerror="retryLogoProxy(this)">';
  return '<span>'+esc(initials(team.name))+'</span>';
}
function retryLogoProxy(img){
  var src=img.getAttribute("data-logo-src")||"";
  var attempt=parseInt(img.getAttribute("data-logo-attempt")||"0",10);
  var candidates=logoProxyCandidates(src);
  if(attempt>=candidates.length){img.onerror=null;img.style.display="none";return;}
  img.setAttribute("data-logo-attempt",String(attempt+1));
  img.dataset.logoFitted="";
  img.src=candidates[attempt];
}
function logoProxyCandidates(src){
  if(isFirebaseStorageLogo(src)) return [];
  var clean=src.split("?")[0].replace(/^https?:\/\//,"");
  var noProtocol=src.replace(/^https?:\/\//,"");
  return [
    "https://images.weserv.nl/?url="+encodeURIComponent(noProtocol)+"&output=png",
    "https://images.weserv.nl/?url=ssl:"+encodeURIComponent(noProtocol)+"&output=png",
    "https://images.weserv.nl/?url="+encodeURIComponent(clean)+"&output=png",
    "https://wsrv.nl/?url="+encodeURIComponent(noProtocol)+"&output=png"
  ];
}
function isFirebaseStorageLogo(src){
  return /firebasestorage\.googleapis\.com|\.firebasestorage\.app/i.test(String(src||""));
}
function cropLogoFromImage(target,source){
  try{
    var c=document.createElement("canvas"),w=source.naturalWidth||0,h=source.naturalHeight||0;
    if(!w||!h) return false;
    c.width=w;c.height=h;
    var ctx=c.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(source,0,0,w,h);
    var data=ctx.getImageData(0,0,w,h).data,minX=w,minY=h,maxX=0,maxY=0,found=false;
    for(var y=0;y<h;y++){
      for(var x=0;x<w;x++){
        if(data[(y*w+x)*4+3]>18){if(x<minX)minX=x;if(y<minY)minY=y;if(x>maxX)maxX=x;if(y>maxY)maxY=y;found=true;}
      }
    }
    if(found){
      var cropW=maxX-minX+1,cropH=maxY-minY+1;
      var visual=Math.max(cropW,cropH);
      var ratio=visual/Math.max(w,h);
      var out=180,pad=12,drawW,drawH,dx,dy,outCanvas=document.createElement("canvas"),outCtx;
      outCanvas.width=out;outCanvas.height=out;outCtx=outCanvas.getContext("2d");
      if(cropW>=cropH){drawW=out-pad*2;drawH=drawW*(cropH/cropW);dx=pad;dy=(out-drawH)/2;}
      else{drawH=out-pad*2;drawW=drawH*(cropW/cropH);dy=pad;dx=(out-drawW)/2;}
      outCtx.drawImage(source,minX,minY,cropW,cropH,dx,dy,drawW,drawH);
      target.style.setProperty("--logo-scale",ratio<.72?1.06:1);
      target.src=outCanvas.toDataURL("image/png");
      return true;
    }
  }catch(e){}
  return false;
}
function normalizeLogoViaProxy(img){
  if(img.dataset.logoProxyFit==="1") return;
  if(isFirebaseStorageLogo(img.getAttribute("data-logo-src")||img.src||"")) return;
  img.dataset.logoProxyFit="1";
  var candidates=logoProxyCandidates(img.getAttribute("data-logo-src")||img.src||"");
  var i=0;
  function next(){
    if(i>=candidates.length) return;
    var proxy=new Image();
    proxy.crossOrigin="anonymous";
    proxy.onload=function(){if(!cropLogoFromImage(img,proxy)) next();};
    proxy.onerror=next;
    proxy.src=candidates[i++];
  }
  next();
}
function fitLogo(img){
  if(img.dataset.logoFitted==="1") return;
  img.dataset.logoFitted="1";
  img.style.setProperty("--logo-scale",1);
  if(cropLogoFromImage(img,img)) return;
  normalizeLogoViaProxy(img);
}
function fitRows(count){
  var root=document.documentElement;
  var perCol=Math.max(1,Math.ceil(count/2));
  var rowH=Math.max(46,Math.min(58,Math.floor((565-(Math.max(perCol-1,0)*10))/perCol)));
  root.style.setProperty("--row-h",rowH+"px");
  root.style.setProperty("--rank-size",Math.max(23,Math.min(30,rowH*.52))+"px");
  root.style.setProperty("--name-size",Math.max(24,Math.min(32,rowH*.54))+"px");
  root.style.setProperty("--point-size",Math.max(23,Math.min(30,rowH*.52))+"px");
  root.style.setProperty("--total-size",Math.max(24,Math.min(31,rowH*.54))+"px");
  root.style.setProperty("--logo-w",Math.max(30,Math.min(42,rowH*.68))+"px");
  root.style.setProperty("--logo-h",Math.max(30,Math.min(42,rowH*.68))+"px");
}
function renderColumn(list,startIdx){

  html+=list.map(function(t,idx){

  }).join("");

function renderSignature(list){
  return list.map(function(t,idx){
    return [pageIndex,idx+1,t.name||"",t.tag||"",t.logo||"",t.country||"",teamCountryFlag(t)||"",t.kills||0,t.rankPts||0,t.total||0,t.bestSingleMatch||0].join("|");
  }).join("~")+"|"+TITLE+"|"+SUBTITLE;
}
function render(){
  renderHead();
  var all=(teams||[]).filter(function(t){return t&&t.name;}).map(function(t){var stats=teamStats(t);return Object.assign({},t,{total:stats.total,rankPts:stats.rankPts,kills:stats.kills,bestSingleMatch:stats.best});});
  all.sort(function(a,b){return b.total-a.total||b.rankPts-a.rankPts||b.kills-a.kills||b.bestSingleMatch-a.bestSingleMatch||norm(a.name).localeCompare(norm(b.name));});
  var rotation=masterPageForCount(all.length);
  var pages=rotation.pages;
  pageIndex=rotation.page;
  var start=pageIndex*LIMIT;
  var list=all.slice(start,start+LIMIT);
  var signature=renderSignature(list);
  if(signature===lastRenderSignature){
    var archiveStatus=window.__masterArchiveStatus||{selected:0,loaded:0};
    setStatus("master: "+EVENT_ID+" | archives: "+archiveStatus.loaded+" | teams: "+all.length+" | page "+(pageIndex+1)+"/"+pages);
    scheduleMasterRotation();

  }
  lastRenderSignature=signature;

  var empty=document.getElementById("empty");

  }
  empty.style.display=list.length?"none":"flex";
  var cut=Math.ceil(list.length/2);
  rows.innerHTML='<div class="rank-columns">'+renderColumn(list.slice(0,cut),start)+renderColumn(list.slice(cut),start+cut)+'</div>';
  requestAnimationFrame(function(){

    rows.querySelectorAll(".row").forEach(function(row){row.classList.add("animate-in");});
  });
  var archiveStatus=window.__masterArchiveStatus||{selected:0,loaded:0};
  setStatus("master: "+EVENT_ID+" | archives: "+archiveStatus.loaded+" | teams: "+all.length+" | page "+(pageIndex+1)+"/"+pages+" | "+currentPageSeconds+"s");
  scheduleMasterRotation();
}

watchTheme();
