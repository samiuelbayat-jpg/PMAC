<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Approvals — PUBG Mobile Afghanistan</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#070910;color:#dde4f0;font-family:'Barlow Condensed',sans-serif;min-height:100vh;padding:2rem 1.5rem;}
    h1{font-size:22px;font-weight:900;letter-spacing:4px;text-transform:uppercase;color:#f5c400;margin-bottom:4px;}
    .sub{font-family:'Share Tech Mono',monospace;font-size:10px;color:#4e5a72;letter-spacing:.1em;margin-bottom:2rem;}
    .back{display:inline-block;font-family:'Share Tech Mono',monospace;font-size:10px;color:#4e5a72;border:1px solid rgba(255,255,255,.1);padding:5px 12px;border-radius:3px;cursor:pointer;margin-bottom:1.5rem;background:none;}
    .back:hover{color:#f5c400;border-color:rgba(245,196,0,.3);}
    .filter-row{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;}
    .fbtn{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 16px;border-radius:3px;cursor:pointer;border:1px solid rgba(255,255,255,.12);background:#0f1218;color:#4e5a72;transition:all .15s;}
    .fbtn.active{background:#f5c400;color:#060810;border-color:#f5c400;}
    .count-badge{font-family:'Share Tech Mono',monospace;font-size:9px;padding:2px 7px;border-radius:10px;margin-left:6px;background:rgba(255,255,255,.06);}
    table{width:100%;border-collapse:collapse;}
    th{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#4e5a72;padding:8px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08);}
    td{padding:10px 12px;font-size:14px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;}
    td.email{font-family:'Share Tech Mono',monospace;font-size:12px;color:#a0b0c8;}
    td.date{font-family:'Share Tech Mono',monospace;font-size:10px;color:#4e5a72;}
    .status-pill{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:2px;border:1px solid;}
    .status-pill.pending  {color:#f5c400;background:rgba(245,196,0,.08);border-color:rgba(245,196,0,.25);}
    .status-pill.approved {color:#00c97a;background:rgba(0,201,122,.08);border-color:rgba(0,201,122,.25);}
    .status-pill.rejected {color:#ff4444;background:rgba(255,68,68,.08);border-color:rgba(255,68,68,.25);}
    .actions{display:flex;gap:6px;}
    .btn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:5px 14px;border-radius:2px;cursor:pointer;border:1px solid;transition:all .15s;}
    .btn-approve{background:rgba(0,201,122,.1);border-color:rgba(0,201,122,.3);color:#00c97a;}
    .btn-approve:hover{background:rgba(0,201,122,.2);}
    .btn-reject{background:rgba(255,68,68,.1);border-color:rgba(255,68,68,.3);color:#ff4444;}
    .btn-reject:hover{background:rgba(255,68,68,.2);}
    .btn-revoke{background:rgba(255,160,0,.1);border-color:rgba(255,160,0,.3);color:#ffa000;}
    .btn-revoke:hover{background:rgba(255,160,0,.2);}
    .empty{font-family:'Share Tech Mono',monospace;font-size:11px;color:#4e5a72;text-align:center;padding:3rem;letter-spacing:.08em;}
    .loading{text-align:center;padding:3rem;font-family:'Share Tech Mono',monospace;font-size:11px;color:#4e5a72;animation:pulse 1.4s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .toast{position:fixed;bottom:24px;right:24px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.06em;padding:10px 20px;border-radius:3px;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;}
    .toast.show{opacity:1;transform:none;}
    .toast-ok{background:#f5c400;color:#060810;}
    .toast-err{background:#ff4444;color:#fff;}
  </style>
</head>
<body>

<button class="back" onclick="window.location.href='admin.html'">◀ Back to Admin</button>
<h1>User Approvals</h1>
<div class="sub">Manage who can access the platform</div>

<div class="filter-row">
  <button class="fbtn active" id="f-all"      onclick="setFilter('all')">All      <span class="count-badge" id="cnt-all">0</span></button>
  <button class="fbtn"        id="f-pending"  onclick="setFilter('pending')">Pending  <span class="count-badge" id="cnt-pending">0</span></button>
  <button class="fbtn"        id="f-approved" onclick="setFilter('approved')">Approved <span class="count-badge" id="cnt-approved">0</span></button>
  <button class="fbtn"        id="f-rejected" onclick="setFilter('rejected')">Rejected <span class="count-badge" id="cnt-rejected">0</span></button>
</div>

<div id="table-wrap">
  <div class="loading">Loading users...</div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
  import { initializeApp }               from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyD-RFu-40Igcoqhm8QBbu_PgdFxV6aUIQA",
    authDomain:        "pubg-mobile-afghanistan.firebaseapp.com",
    databaseURL:       "https://pubg-mobile-afghanistan-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "pubg-mobile-afghanistan",
    storageBucket:     "pubg-mobile-afghanistan.firebasestorage.app",
    messagingSenderId: "279105805502",
    appId:             "1:279105805502:web:8def653069d0b3d73bd2ef"
  };

  const ADMIN_EMAIL = "samiuel.bayat@gmail.com";
  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getDatabase(app);

  // Guard: only admin can access this page
  onAuthStateChanged(auth, user => {
    if (!user || user.email?.toLowerCase() !== ADMIN_EMAIL) {
      window.location.href = "index.html";
    }
  });

  let allUsers = {};
  let currentFilter = "all";

  const toast = document.getElementById("toast");
  function showToast(msg, ok=true){
    toast.textContent=msg; toast.className="toast show "+(ok?"toast-ok":"toast-err");
    setTimeout(()=>toast.classList.remove("show"),2800);
  }

  function fmtDate(ts){ if(!ts) return "—"; return new Date(ts).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }

  function render(){
    const users = Object.entries(allUsers);
    const filtered = currentFilter==="all" ? users : users.filter(([,d])=>d.status===currentFilter);

    // update counts
    ["all","pending","approved","rejected"].forEach(s=>{
      document.getElementById(`cnt-${s}`).textContent = s==="all" ? users.length : users.filter(([,d])=>d.status===s).length;
    });

    if(!filtered.length){
      document.getElementById("table-wrap").innerHTML=`<div class="empty">No ${currentFilter==="all"?"users":currentFilter+" users"} found.</div>`;
      return;
    }

    let html=`<table><thead><tr><th>Email</th><th>Status</th><th>Requested</th><th>Approved</th><th>Actions</th></tr></thead><tbody>`;
    filtered.sort((a,b)=>(b[1].requestedAt||0)-(a[1].requestedAt||0)).forEach(([uid,d])=>{
      html+=`<tr>
        <td class="email">${d.email||"—"}</td>
        <td><span class="status-pill ${d.status}">${d.status}</span></td>
        <td class="date">${fmtDate(d.requestedAt)}</td>
        <td class="date">${fmtDate(d.approvedAt)}</td>
        <td class="actions">
          ${d.status!=="approved" ? `<button class="btn btn-approve" onclick="setStatus('${uid}','approved')">Approve</button>`:""}
          ${d.status!=="rejected" ? `<button class="btn btn-reject"  onclick="setStatus('${uid}','rejected')">Reject</button>`:""}
          ${d.status==="approved" ? `<button class="btn btn-revoke"  onclick="setStatus('${uid}','pending')">Revoke</button>`:""}
        </td>
      </tr>`;
    });
    html+=`</tbody></table>`;
    document.getElementById("table-wrap").innerHTML=html;
  }

  window.setStatus = async (uid, status) => {
    try{
      const updates = { status, approvedAt: status==="approved" ? Date.now() : null };
      await update(ref(db,`pmac/users/${uid}`), updates);
      showToast(`User ${status}`, true);
    } catch(e){ showToast(e.message, false); }
  };

  window.setFilter = filter => {
    currentFilter=filter;
    document.querySelectorAll(".fbtn").forEach(b=>b.classList.remove("active"));
    document.getElementById(`f-${filter}`).classList.add("active");
    render();
  };

  // Live listener
  onValue(ref(db,"pmac/users"), snap=>{
    allUsers = snap.val()||{};
    render();
  });
</script>
</body>
</html>
